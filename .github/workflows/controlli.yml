# Controlli automatici. Girano a ogni pull request (e a ogni suo aggiornamento), a ogni push su main
# e quando li richiama il rilascio. NESSUN segreto e permessi di sola lettura: possono girare anche
# su codice non ancora controllato (es. una pull request da un fork) senza poter scrivere nulla.
# Il controllo da rendere OBBLIGATORIO in GitHub (Settings → Branches) è "Tutti i controlli".
name: Controlli

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: controlli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regole:
    name: Regole del gioco
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - name: APP_VERSION e CACHE_VERSION allineati
        run: node .github/scripts/controlla-versione.js
      - name: Verso main, se cambia il gioco la versione deve salire
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if git diff --quiet origin/main -- index.html sw.js; then echo "gioco invariato"; exit 0; fi
          BASE=$(git show origin/main:index.html | grep -o 'APP_VERSION *= *"v[0-9.]*"' | grep -o 'v[0-9.]*')
          node .github/scripts/controlla-versione.js "$BASE"

  workflow:
    name: Workflow sicuri
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/*.test.js
      - run: node .github/scripts/controlla-workflow.js
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Sintassi dei workflow (actionlint, versione fissa verificata da sum.golang.org)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  sito:
    name: Il sito non pubblica i test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Jekyll 3.10 (come GitHub Pages), installato in una cartella temporanea
        run: gem install --no-document --install-dir "$RUNNER_TEMP/gems" jekyll:3.10.0 kramdown-parser-gfm webrick
      - run: GEMS="$RUNNER_TEMP/gems" node .github/scripts/controlla-sito.js

  firebase:
    name: Sicurezza Firebase (emulatore)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Mai il Firebase vero: progetto finto demo-tock ed emulatore locale, nessuna credenziale.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # serve il commit della v6.16 per le prove fra versioni
      # I test Firebase esistono dalla PR "2/6"; prima (es. main con la v6.16) questo controllo non ha niente
      # da provare. Se però la cartella c'era ed è stata TOLTA, è un errore: non si aggira così il controllo.
      - name: Ci sono i test Firebase?
        id: presenza
        run: |
          if [ -f firebase-tests/package.json ]; then echo "presente=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$(git log --format=%H -1 -- firebase-tests/package.json)" ]; then
            echo "ERRORE: firebase-tests/ è stata tolta"; exit 1
          fi
          echo "presente=no" >> "$GITHUB_OUTPUT"
          echo "Nessun test Firebase in questo branch (ancora da aggiungere): niente da provare."
      - if: steps.presenza.outputs.presente == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - if: steps.presenza.outputs.presente == 'si'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.presenza.outputs.presente == 'si'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulatori-${{ hashFiles('firebase-tests/package-lock.json') }}
      - if: steps.presenza.outputs.presente == 'si'
        working-directory: firebase-tests
        run: npm ci
      - name: Chromium per le prove del gioco (Playwright 1.56.1, anche per i branch che non lo elencano)
        if: steps.presenza.outputs.presente == 'si'
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Regole, attacchi, posti, classifica, migrazione, rilascio, gioco vero in Chromium
        if: steps.presenza.outputs.presente == 'si'
        working-directory: firebase-tests
        run: npm test
      - name: Ripristino delle regole (andata e ritorno)
        if: steps.presenza.outputs.presente == 'si'
        working-directory: firebase-tests
        run: |
          if npm run | grep -q fase0-prova; then npm run fase0-prova; else echo "prova di ripristino non ancora presente in questo branch"; fi
      - name: Prova generale della Fase 2 (transizione, dati invariati, v6.16, ritorno indietro)
        if: steps.presenza.outputs.presente == 'si'
        working-directory: firebase-tests
        run: |
          if npm run | grep -q fase2-prova; then npm run fase2-prova; else echo "prova della Fase 2 non ancora presente in questo branch"; fi
      - name: Prova generale delle regole 5A con la v6.23 (dati finti con la forma di quelli veri)
        if: steps.presenza.outputs.presente == 'si'
        working-directory: firebase-tests
        run: |
          if npm run | grep -q r2-prova; then npm run r2-prova; else echo "prova R2 non ancora presente in questo branch"; fi
      - name: Log dell'emulatore se qualcosa va storto
        if: failure()
        run: tail -n 200 firebase-tests/*-debug.log || true

  arbitro:
    name: Arbitro sul server (emulatore)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Cloud Function "arbitro" + gioco vero in Chromium, tutto sull'emulatore (progetto finto demo-tock):
    # nessuna credenziale, niente piano Blaze, niente Firebase vero.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: C'è l'arbitro?
        id: presenza
        run: |
          if [ -f functions/package.json ]; then echo "presente=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$(git log --format=%H -1 -- functions/package.json)" ]; then
            echo "ERRORE: functions/ è stata tolta"; exit 1
          fi
          echo "presente=no" >> "$GITHUB_OUTPUT"
          echo "Nessun arbitro in questo branch: niente da provare."
      - if: steps.presenza.outputs.presente == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase-tests/package-lock.json
            functions/package-lock.json
      - if: steps.presenza.outputs.presente == 'si'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.presenza.outputs.presente == 'si'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulatori-${{ hashFiles('firebase-tests/package-lock.json') }}
      - name: Motore del server e regole generati allineati a index.html
        if: steps.presenza.outputs.presente == 'si'
        run: |
          node functions/genera-motore.js --check
          node firebase-tests/regole/genera-arbitro.js --check
      - if: steps.presenza.outputs.presente == 'si'
        working-directory: functions
        run: npm ci
      - name: Logica dell'arbitro (partite intere, mosse rifiutate, carte nascoste)
        if: steps.presenza.outputs.presente == 'si'
        working-directory: functions
        run: npm test
      - if: steps.presenza.outputs.presente == 'si'
        working-directory: firebase-tests
        run: npm ci
      - name: Chromium per le prove del gioco (Playwright 1.56.1)
        if: steps.presenza.outputs.presente == 'si'
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Due telefoni con l'arbitro, fine partita, rientro, Gioca subito, passaggio dalla Fase 5A
        if: steps.presenza.outputs.presente == 'si'
        working-directory: firebase-tests
        run: npm run test-arbitro
      - name: Log dell'emulatore se qualcosa va storto
        if: failure()
        run: tail -n 200 firebase-tests/*-debug.log || true

  esito:
    name: Tutti i controlli
    if: always()
    needs: [regole, workflow, sito, firebase, arbitro]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tutti i controlli devono essere verdi
        env:
          ESITI: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Esiti: $ESITI"
          for e in $ESITI; do [ "$e" = "success" ] || { echo "Un controllo non è riuscito ($e)"; exit 1; }; done
