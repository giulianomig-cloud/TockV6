async function recoverByName(roomId, chosenName, rowBtn) {
  const name = String(chosenName || "").trim();
  if (!name) return showToast("Scrivi il tuo nome.");
  const go = rowBtn && rowBtn.querySelector(".rj-go");
  if (rowBtn) rowBtn.disabled = true;
  fbBusy(go, "Un attimo…");
  const fail = () => { fbFail(go, "Riprova"); if (rowBtn) setTimeout(() => { rowBtn.disabled = false; }, 1600); };
  try {
    const snap = await roomRef(roomId).get();
    const existing = normalizeState(snap.val());
    const match = COLORS.find(
      (c) =>
        existing.players[c] &&
        existing.players[c].name &&
        existing.players[c].name.trim().toLowerCase() === name.trim().toLowerCase()
    );
    if (!match) {
      fail();
      showToast("Non trovo nessun giocatore con questo nome in questa stanza. Controlla di averlo scritto esattamente come la prima volta, oppure continua come nuovo giocatore.");
      return;
    }
    const claim = existing.players[match];
    // "Riprende" il posto sul nuovo dispositivo: stesso meccanismo di
    // claim-token già usato dalla modalità manuale, semplicemente
    // riassegnato a questo dispositivo.
    const newToken = getOrCreateClaimToken(roomId, match);
    // Si tengono tutti i campi del posto (playerId compreso: prima andava
    // perso, e le partite giocate dopo un rientro non contavano più in
    // classifica generale); cambia solo il token, che passa a questo telefono.
    await roomRef(roomId).child("players").child(match).set({ ...claim, token: newToken });
    myColor = match;
    myRoomId = roomId;
    myName = claim.name;
    if (claim.playerId) {
      myPlayerId = claim.playerId;
      savePlayerShortcut(claim.playerId, claim.name);
    }
    if (go) { fbOk(go, "Bentornato"); await fbWait(650); }
    // Prima la shell, poi l'ascolto: con i dati già in cache Firebase può
    // richiamare onStateChange subito, e senza #start-wrap & co. va in errore
    // ("Cannot set properties of null", visto su un tavolo di torneo).
    vtGo(null, null, () => { renderGameShell(); watchRoom(roomId, onStateChange); });
  } catch (e) {
    fail();
    showToast("Non sono riuscito a farti rientrare: " + describeError(e));
    console.error(e);
  }
}

// Ref Firebase dell'ascolto in tempo reale attivo sulla schermata "scegli
// nome e colore" (prima di entrare) — al massimo uno alla volta, staccato
// ogni volta che si lascia quella schermata (rientra in stanza, cambia
// stanza, ecc.) per non restare ad ascoltare stanze che non si guardano più.
let lobbyListenerRef = null;
// Oltre all'ascolto realtime (.on("value")), un poll di riserva ogni 4s
// mentre si è su questa schermata: segnalato che con due telefoni
// entrambi in primo piano (quindi non il caso già coperto dal
// visibilitychange qui sotto) un colore preso su un telefono a volte non
// compariva preso sull'altro — la connessione realtime di Firebase può
// restare "silenziosa" su rete mobile anche senza che l'app vada in
// background. Il poll rilegge lo stato vero e ridisegna, quindi anche se
// un aggiornamento realtime va perso la lobby si allinea comunque entro
// pochi secondi.
let lobbyPollInterval = null;
function stopLobbyListener() {
  if (lobbyListenerRef) {
    lobbyListenerRef.off();
    lobbyListenerRef = null;
  }
  if (lobbyPollInterval) {
    clearInterval(lobbyPollInterval);
    lobbyPollInterval = null;
  }
}

// Campo nome con autocomplete sulla rubrica giocatori (v5): un wrapper
// {wrap, input} — `wrap` va appeso al posto del vecchio `input` semplice,
// `input` è lo stesso elemento <input> di sempre (stesso id, stesso modo
// di leggerne il valore in fase di submit). La lista a discesa è solo un
// aiuto per non dover riscrivere il proprio nome ogni volta: la
// canonicalizzazione vera (trova-o-crea in rubrica) avviene comunque al
// momento dell'invio, tramite resolvePlayerName — quindi funziona
// correttamente anche se l'utente ignora i suggerimenti e scrive a mano.
function buildRubricaNameInput(inputId, initialValue) {
  const input = el("input", { id: inputId, placeholder: "il tuo nome", value: initialValue || "", autocomplete: "off" });
  const list = el("div", { class: "name-autocomplete-list", style: "display:none;" });
  const renderList = () => {
    const matches = rubricaMatches(input.value);
    list.innerHTML = "";
    if (!matches.length) {
      list.style.display = "none";
      return;
    }
    matches.forEach((m) => {
      list.appendChild(
        el(
          "button",
          {
            type: "button",
            class: "name-autocomplete-item",
            // mousedown (non click) così scatta PRIMA del blur dell'input,
            // altrimenti il blur nasconde la lista un attimo prima che il
            // click ci arrivi e la selezione sembra "non funzionare".
            onmousedown: (e) => {
              e.preventDefault();
              input.value = m.nome;
              list.style.display = "none";
            },
          },
          m.nome
        )
      );
    });
    list.style.display = "";
  };
  input.addEventListener("input", renderList);
  input.addEventListener("focus", renderList);
  input.addEventListener("blur", () => {
    list.style.display = "none";
  });
  // Carica la rubrica una volta per schermata (fire-and-forget: se non è
  // ancora pronta quando l'utente inizia a digitare, semplicemente non
  // compaiono suggerimenti finché non arriva — non blocca la digitazione).
  loadRubrica();
  const wrap = el("div", { class: "name-autocomplete-wrap" }, input, list);
  return { wrap, input };
}

  const stepLabel = (n, text) =>

  root.appendChild(
    el(
      "div",
      { class: "lobby-card" },

        "div",
        { class: "lobby-header-row" },
        el(
          "div",

        ),

            ["circle", { cx: 18, cy: 5, r: 3 }],
            ["circle", { cx: 6, cy: 12, r: 3 }],
            ["circle", { cx: 18, cy: 19, r: 3 }],
            ["line", { x1: 8.6, y1: 10.6, x2: 15.4, y2: 6.4 }],
            ["line", { x1: 8.6, y1: 13.4, x2: 15.4, y2: 17.6 }],
          ]),
          "Invita"
        )
      ),
      el(
        "div",
        { class: "room-tag" },
        el("span", { class: "room-tag-label" }, "Stanza"),
        el("span", { class: "room-tag-code notranslate", translate: "no" }, roomId)
      ),
      el("p", { class: "muted" }, "Inserisci il tuo nome e scegli il tuo colore."),
      stepLabel(1, "Il tuo nome"),
      nameField.wrap,
      stepLabel(2, "Scegli il tuo colore"),
      el("div", { id: "color-row-wrap" }), // riempito/aggiornato da renderLobbyColorSection
      stepLabel(3, "Entra in partita"),
      el("button", { id: "join-btn", class: "primary", disabled: true, onclick: () => joinManualRoom(roomId) }, "Entra nella stanza", forwardArrowIcon()),
      el("p", { id: "join-hint", class: "muted", style: "font-size:0.8rem;margin-top:6px;" }, "Scegli un colore per continuare."),
      el(
        "div",
        { class: "sound-test-row" },
        el("button", { class: "text-link-btn", onclick: () => { if (myColor) releaseColorPending(roomId, myColor); stopLobbyListener(); renderLobby(); } }, backChevronIcon(), "Cambia stanza"),
        el("span", { class: "app-meta" }, `Tock by Mig · ${APP_VERSION} · © 2026 Mig`)
      ),
      homeScreenHint()
    )
  );

  renderLobbyColorSection(roomId, existingPlayers, {});

  // Ascolto in tempo reale: prima questa schermata era una fotografia presa
  // una volta sola, quindi se un altro giocatore sceglieva un colore (o gli
  // veniva assegnato un bot) mentre eri ancora qui, non lo vedevi finché non
  // facevi tu stesso un'azione che la ricaricava. Ora si aggiorna da sola,
  // senza toccare il nome che stai eventualmente scrivendo (solo la sezione
  // dei colori viene ridisegnata, vedi renderLobbyColorSection).
  const ref = roomRef(roomId);
  ref.on("value", (snap) => {
    const state = snap.val() ? normalizeState(snap.val()) : null;
    renderLobbyColorSection(roomId, (state && state.players) || {}, (state && state.pending) || {});
  });
  lobbyListenerRef = ref;

  // Poll di riserva (vedi il commento su lobbyPollInterval): rilegge lo
  // stato vero ogni 4s, indipendentemente da .on("value") e dal
  // visibilitychange qui sotto.
  lobbyPollInterval = setInterval(() => {
    if (!lobbyListenerRef) return;
    roomRef(roomId)
      .get()
      .then((snap) => {
        if (!lobbyListenerRef) return; // nel frattempo si è già entrati/cambiata stanza
        const state = snap.val() ? normalizeState(snap.val()) : null;
        renderLobbyColorSection(roomId, (state && state.players) || {}, (state && state.pending) || {});
      })
      .catch(() => {});
    // Chi ha scelto un colore e ci pensa su (es. scrive il nome) tiene viva
    // la prenotazione: altrimenti dopo 45 s il colore tornava "Libero" agli
    // occhi degli altri, pur avendo ancora il ✓ sul proprio telefono.
    if (myColor && Date.now() - lastPendingRefresh > 15000) reserveColorPending(roomId, myColor);
  }, 4000);
}

// Rete su mobile o cambio app/schermo bloccato possono far "addormentare"
// momentaneamente l'ascolto realtime di Firebase — se succede proprio
// mentre si è nella lobby di scelta colore, un colore preso da qualcun
// altro nel frattempo può non comparire finché non si torna sulla pagina.
// Difesa aggiuntiva: al ritorno in primo piano, se l'ascolto della lobby è
// ancora attivo, si rilegge una volta lo stato vero da Firebase (non solo
// ci si affida al prossimo evento realtime, che potrebbe essere andato
// perso) e si ridisegna — così un colore preso "durante l'assenza" compare
// comunque appena si riapre l'app, invece di restare disallineato.
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !lobbyListenerRef || !lastColorSectionArgs) return;
  roomRef(lastColorSectionArgs.roomId)
    .get()
    .then((snap) => {
      if (!lobbyListenerRef) return; // nel frattempo si è già entrati/cambiata stanza
      const state = snap.val() ? normalizeState(snap.val()) : null;
      renderLobbyColorSection(lastColorSectionArgs.roomId, (state && state.players) || {}, (state && state.pending) || {});
    })
    .catch(() => {});
});

// Ridisegna SOLO la sezione dei colori (griglia squadre + pulsanti bot) più
// lo stato di "Entra nella stanza", senza toccare il resto della card —
// così un aggiornamento in tempo reale non cancella mai il nome che stai
// scrivendo nel campo sopra. Chiamata sia al primo render sia da ogni
// tick dell'ascolto Firebase in renderManualLobby.
let lastColorSectionArgs = null;
let _roomBotChoice = null; // colore su cui si sta scegliendo il livello del computer
let _seatJustTaken = null; // v5.57: colore appena preso con "Siediti" (pallino che "pulsa" una volta)
function renderLobbyColorSection(roomId, existingPlayers, pending) {
  const wrap = $("#color-row-wrap");
  if (!wrap) return; // non siamo più su questa schermata (es. si è già entrati)
  lastColorSectionArgs = { roomId, existingPlayers, pending };

  // Una selezione già fatta non deve sparire solo perché la schermata si è
  // aggiornata (da un'azione tua su un bot, o ora anche da un altro
  // giocatore) — si azzera solo se quel colore è stato davvero preso.
  if (myColor && existingPlayers && existingPlayers[myColor]) myColor = null;
  // Un altro telefono ha prenotato per primo il colore che avevi scelto
  // (due tocchi quasi insieme): la tua scelta si annulla, così il ✓ resta
  // a uno solo ("due giocatori selezionano lo stesso colore" — segnalato).
  if (myColor && pendingByOther(roomId, pending, myColor)) {
    const lost = myColor;
    myColor = null;
    showToast(`${colorLabel(lost)} lo ha appena scelto un altro giocatore. Scegli un altro colore.`);
  }

  // v5.46 (proposta "C · Squadre"): due riquadri, uno per squadra, con una
  // riga per colore — pallino, nome/stato e a destra i pulsanti. Libero:
  // "Siediti" (= selectColor) e 🤖 (sceglie Normale/Difficile e assegna il
  // computer). Computer: "Libera". Preso da un'altra persona: solo il nome.
  // Prenotato da un altro telefono in questo momento (vedi
  // reserveColorPending): "In scelta…", senza pulsanti.
  // 🤖 apre la scelta del livello DENTRO la riga (qui non c'è il foglio a
  // comparsa dei picker: #picker-wrap esiste solo nella schermata di gioco).
  const redraw = () => { if (lastColorSectionArgs) renderLobbyColorSection(lastColorSectionArgs.roomId, lastColorSectionArgs.existingPlayers, lastColorSectionArgs.pending); };
  if (_roomBotChoice && ((existingPlayers && existingPlayers[_roomBotChoice]) || pendingByOther(roomId, pending, _roomBotChoice))) _roomBotChoice = null;
  const seatRow = (c) => {
    const occupant = existingPlayers && existingPlayers[c];
    const mine = !occupant && myColor === c;
    const pendingOther = !occupant && !mine && pendingByOther(roomId, pending, c);
    let name, sub, actions = [];
    if (occupant && occupant.isBot) {
      name = "🤖 Computer";
      sub = occupant.botLevel === "easy" ? "normale" : "difficile";
      actions = [el("button", { class: "room-chip", onclick: () => removeBotFromColor(roomId, c, () => {}) }, "Libera")];
    } else if (occupant) {
      name = occupant.name || colorLabel(c);
      sub = colorLabel(c);
    } else if (mine) {
      name = ($("#name-input") && $("#name-input").value.trim()) || myName || "Tu";
      sub = `${colorLabel(c)} · tu`;
    } else if (pendingOther) {
      name = "In scelta…";
      sub = "Un altro giocatore lo sta scegliendo";
    } else if (_roomBotChoice === c) {
      name = colorLabel(c);
      sub = "🤖 Livello?";
      const pick = (lv) => { _roomBotChoice = null; assignBotToColor(roomId, c, () => {}, lv); redraw(); };
      actions = [
        el("button", { class: "room-chip", onclick: () => pick("easy") }, "Normale"),
        el("button", { class: "room-chip", onclick: () => pick("hard") }, "Difficile"),
        el("button", { class: "room-chip room-chip-bot", "aria-label": "Annulla", onclick: () => { _roomBotChoice = null; redraw(); } }, "✕"),
      ];
    } else {
      name = "Libero";
      sub = colorLabel(c);
      actions = [
        el("button", { class: "room-chip room-chip-bot", "aria-label": `Computer al posto ${colorLabel(c)}`, onclick: () => { _roomBotChoice = c; redraw(); } }, "🤖"),
        el("button", { class: "room-chip room-chip-sit", onclick: (ev) => { _roomBotChoice = null; selectColor(c, ev.currentTarget); } }, "Siediti"),
      ];
    }
    const state = occupant ? (occupant.isBot ? "rs-bot" : "rs-taken") : mine ? "rs-mine" : pendingOther ? "rs-pending" : "rs-free";
    const pop = mine && _seatJustTaken === c ? " rs-pop" : "";
    if (pop) _seatJustTaken = null;
    return el(
      "div",
      { class: `room-seat ${state}${pop}`, "data-color": c },
      el("span", { class: "room-dot", style: `background:var(--${c})` }, mine ? "✓" : ""),
      el("div", { class: "room-seat-text" }, el("span", { class: "room-seat-name" }, name), el("span", { class: "room-seat-sub" }, sub)),
      actions
    );
  };
  const teamCard = (team) => {
    const cols = COLORS.filter((c) => TEAM_OF[c] === team);
    return el(
      "div",
      { class: "room-team" },
      el("div", { class: "room-team-head" }, `Squadra ${team === "A" ? 1 : 2} · ${TEAM_LABEL[team]}`),
      cols.map(seatRow)
    );
  };
  wrap.innerHTML = "";
  wrap.appendChild(el("div", { class: "room-teams" }, teamCard("A"), el("div", { class: "room-vs" }, "VS"), teamCard("B")));

  const joinBtn = $("#join-btn");
  if (joinBtn) joinBtn.disabled = !myColor;
  const hint = $("#join-hint");
  if (hint) hint.style.display = myColor ? "none" : "";
}

// Riconosce il sistema dal browser (iOS/iPadOS vs Android vs altro) per
// mostrare istruzioni di installazione corrette: i passaggi per
// "aggiungere a Home" sono diversi tra Safari (iPhone/iPad) e Chrome
// (Android), quindi un testo unico era fuorviante su metà dei telefoni.
function detectPlatform() {
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isIOS) return "ios";
  if (/Android/.test(ua)) return "android";
  return "other";
}

// True se il gioco è già stato aperto come app installata (standalone) —
// in tal caso il suggerimento non serve più.
function isStandaloneDisplay() {
  return (
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
    window.navigator.standalone === true
  );
}

function homeScreenHint() {
  if (localStorage.getItem("tock-hide-a2hs") === "1") return "";
  if (isStandaloneDisplay()) return "";
  const platform = detectPlatform();
  const text =
    platform === "ios"
      ? "💡 Consiglio: tocca l'icona Condividi (il quadratino con la freccia in su) in Safari e scegli \"Aggiungi a Home\" per aprire il gioco a schermo intero come un'app."
      : platform === "android"
      ? "💡 Consiglio: apri il menu ⋮ in alto a destra in Chrome e scegli \"Installa app\" (o \"Aggiungi a schermata Home\") per aprire il gioco a schermo intero come un'app."
      : "💡 Consiglio: usa la funzione \"Aggiungi a schermata Home\" del tuo browser per aprire il gioco a schermo intero come un'app.";
  const box = el(
    "div",
    { class: "a2hs-hint" },
    el("span", {}, text),
    el("button", { class: "a2hs-close", onclick: (e) => { localStorage.setItem("tock-hide-a2hs", "1"); e.target.closest(".a2hs-hint").remove(); } }, "✕")
  );
  return box;
}

function colorLabel(c) {
  return { red: "Rosso", green: "Verde", yellow: "Giallo", blue: "Blu" }[c];
}
function colorEmoji(c) {
  return { red: "🔴", green: "🟢", yellow: "🟡", blue: "🔵" }[c];
}

// A small colored circle matching the game's own palette exactly — used
// instead of a 🔴🟢🟡🔵 emoji wherever a color needs to be shown inline,
// since emoji circles have a fixed color baked in by the platform and
// never quite match our custom hex values.
function swatchDot(color) {
  return el("span", { class: "swatch swatch-" + color, style: "margin: 0 4px -2px 2px;" });
}

// Piccolo stemma tondo diviso a metà nei due colori della squadra (SVG:
// niente background-image, resta nitido su qualunque schermo/zoom) — usato
// nella pillola "Squadra" al posto dei due pallini separati (chiesto: "più
// elegante"), un solo simbolo invece di due elementi ripetuti.
function teamCrest(colors) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 26 26");
  svg.setAttribute("class", "team-crest");
  const hex = { red: "#D9636B", green: "#3FA77E", yellow: "#E3AC33", blue: "#3E8FCB" };
  const left = document.createElementNS(ns, "path");
  left.setAttribute("d", "M13 1a12 12 0 0 0 0 24z");
  left.setAttribute("fill", hex[colors[0]]);
  const right = document.createElementNS(ns, "path");
  right.setAttribute("d", "M13 1a12 12 0 0 1 0 24z");
  right.setAttribute("fill", hex[colors[1]]);
  const ring = document.createElementNS(ns, "circle");
  ring.setAttribute("cx", 13);
  ring.setAttribute("cy", 13);
  ring.setAttribute("r", 11.5);
  ring.setAttribute("fill", "none");
  ring.setAttribute("stroke", "rgba(255,255,255,0.75)");
  ring.setAttribute("stroke-width", 1.5);
  svg.append(left, right, ring);
  return svg;
}

// Prefer the name the player chose when joining; fall back to the plain
// color label if none was set (e.g. an older game, or left blank).
function playerName(state, c) {
  const p = state && state.players && state.players[c];
  const n = p && p.name;
  // Un bot ha già un nome vero (es. "Guglielmo", vedi pickBotName) invece
  // di un generico "Bot <Colore>", quindi si distingue da solo un bot
  // dall'altro qui senza bisogno di appendere altro.
  return n && n.trim() ? n.trim() : colorLabel(c);
}

async function selectColor(c, btn) {
  const roomId = lastColorSectionArgs && lastColorSectionArgs.roomId;
  // v5.57: con il pulsante "Siediti" si aspetta l'esito della prenotazione
  // (rotellina): se un altro telefono è arrivato prima, il pulsante diventa
  // rosso "Già preso" e il posto non si prende. Se la rete non risponde
  // entro 4 s si va avanti come prima (la conferma vera resta joinManualRoom).
  let reserved = false;
  if (btn && roomId) {
    fbBusy(btn, "");
    const ok = await Promise.race([reserveColorPending(roomId, c), fbWait(4000).then(() => null)]);
    if (ok === false) {
      if (btn.isConnected) fbFail(btn, "Già preso");
      else showToast(`${colorLabel(c)} lo ha appena scelto un altro giocatore. Scegli un altro colore.`);
      return;
    }
    reserved = true;
    _seatJustTaken = c;
    try { playSound("fbOk"); } catch (e) {}
  }
  const prevColor = myColor;
  myColor = c;
  // Prenota SUBITO il colore appena scelto (best-effort, non protetto da
  // transazione: la vera assegnazione resta solo joinManualRoom) e libera
  // quello eventualmente lasciato — così chiunque altro sia in questa
  // lobby proprio ora lo vede "In scelta…" in tempo reale, invece di
  // scoprirlo solo dopo aver perso la conferma finale (bug segnalato: un
  // colore selezionato da un giocatore non risultava ancora "preso" agli
  // occhi degli altri).
  if (roomId) {
    if (prevColor && prevColor !== c) releaseColorPending(roomId, prevColor);
    if (!reserved) reserveColorPending(roomId, c);
  }
  // Ridisegna l'intera sezione colori invece di limitarsi a spostare la
  // classe "selected" — ora serve perché il riquadro scelto mostra anche il
  // segno di spunta e il tuo nome, non solo un bordo diverso.
  if (lastColorSectionArgs) {
    renderLobbyColorSection(lastColorSectionArgs.roomId, lastColorSectionArgs.existingPlayers, lastColorSectionArgs.pending);
  } else {
    const joinBtn = document.getElementById("join-btn");
    if (joinBtn) joinBtn.disabled = false;
    const hint = document.getElementById("join-hint");
    if (hint) hint.style.display = "none";
  }
}

async function joinManualRoom(roomId) {
  unlockAudio();
  const typed = $("#name-input").value.trim();
  if (!myColor) return showToast("Scegli un colore.");
  myRoomId = roomId;
  // Rubrica (v5): un nome scritto passa da trova-o-crea, così due persone
  // che scrivono lo stesso nome (anche con maiuscole/spazi diversi)
  // finiscono sulla stessa voce condivisa invece di crearne una a testa.
  // Se il campo è vuoto si tiene il comportamento di sempre (nome = colore,
  // nessuna voce di rubrica creata per un "nome" che non esiste).
  if (typed) {
    const player = await resolvePlayerName(typed);
    myName = player.nome;
    myPlayerId = player.id;
    savePlayerShortcut(player.id, player.nome);
  } else {
    myName = colorLabel(myColor);
    myPlayerId = null;
  }

  // FONDAMENTALE: va staccato PRIMA di scrivere su Firebase, non dopo.
  // L'ascolto in tempo reale della lobby (aggiunto in v3.4) reagisce anche
  // alla nostra STESSA scrittura qui sotto — la vede arrivare come "questo
  // colore è stato preso" e azzerava myColor proprio mentre stavamo
  // entrando (bug: "Sei: Giuliano (undefined) · squadra undefined").
  // Staccarlo subito, prima dello scrivere, elimina la corsa critica.
  stopLobbyListener();

  const ref = roomRef(roomId);
  const claimToken = getOrCreateClaimToken(roomId, myColor);

  // Tutto dentro UNA transazione (leggi-controlla-scrivi atomico), non più
  // un get() seguito da un set() separato: quel prima/dopo lasciava una
  // finestra in cui due telefoni potevano leggere "colore libero"
  // entrambi PRIMA che uno dei due avesse scritto, e finire entrambi nello
  // stesso colore (bug segnalato). Stesso motivo per cui updateState (le
  // mosse in partita) usa già una transazione.
  let blockedReason = null; // {kind:"color", by} | {kind:"name"} | null
  let caughtError = null;
  const result = await ref
    .transaction((current) => {
      blockedReason = null;
      try {
        if (current === null) {
          const players = {};
          players[myColor] = { name: myName, token: claimToken, playerId: myPlayerId || null };
          return newGameState(players, "manual");
        }
        const state = normalizeState(JSON.parse(JSON.stringify(current)));
        const existing = state.players && state.players[myColor];
        const sameName = existing && existing.name && myName &&
          existing.name.trim().toLowerCase() === myName.trim().toLowerCase();
        if (existing && existing.token && existing.token !== claimToken && !sameName) {
          blockedReason = { kind: "color", by: existing.name || colorLabel(myColor) };
          return undefined; // annulla il tentativo, non scrivere nulla
        }
        // Il colore è libero ma un altro telefono lo ha prenotato per primo
        // ed è ancora lì a scegliere: non si entra al suo posto.
        const pend = state.pending && state.pending[myColor];
        if (!existing && pend && pend.token !== claimToken && freshPendingColor(state.pending, myColor)) {
          blockedReason = { kind: "pending" };
          return undefined;
        }
        // Due colori diversi con lo stesso nome mandano in confusione il
        // rientro-per-nome più avanti (non saprebbe a quale colore restituire
        // il posto), quindi lo blocchiamo già qui.
        const otherPlayers = state.players || {};
        const nameTakenElsewhere = COLORS.some((c) => {
          if (c === myColor) return false;
          const p = otherPlayers[c];
          return p && p.name && myName && p.name.trim().toLowerCase() === myName.trim().toLowerCase();
        });
        if (nameTakenElsewhere) {
          blockedReason = { kind: "name" };
          return undefined;
        }
        if (!state.players) state.players = {};
        state.players[myColor] = { name: myName, token: claimToken, playerId: myPlayerId || null };
        return state;
      } catch (e) {
        caughtError = e;
        return undefined;
      }
    })
    .catch((e) => {
      caughtError = e;
      return null;
    });

  if (blockedReason && blockedReason.kind === "color") {
    showToast(`Il colore ${colorLabel(myColor)} è già stato scelto da ${blockedReason.by} in questa stanza. Scegline un altro, oppure rientra usando esattamente lo stesso nome per riprenderlo.`);
    return;
  }
  if (blockedReason && blockedReason.kind === "pending") {
    // Si torna alla scelta del colore (l'ascolto della lobby era già stato
    // staccato in cima) con il nome già scritto.
    const snapVal = result && result.snapshot && result.snapshot.val();
    myColor = null;
    renderManualLobby(roomId, (snapVal && snapVal.players) || {});
    showToast("Questo colore lo sta già scegliendo un altro giocatore. Scegline un altro.");
    return;
  }
  if (blockedReason && blockedReason.kind === "name") {
    showToast(`Il nome "${myName}" è già usato da un altro giocatore in questa stanza. Scegline uno diverso (es. aggiungi un'iniziale).`);
    return;
  }
  if (caughtError) {
    console.error("joinManualRoom error:", caughtError);
    showToast("Non è stato possibile entrare nella stanza. Riprova.");
    return;
  }
  if (!result || result.committed === false) {
    showToast("Non è stato possibile entrare nella stanza (richiesta non completata). Riprova.");
    return;
  }

  // Ora che il colore è VERAMENTE assegnato (transazione confermata sopra),
  // la prenotazione leggera non serve più — la liberiamo per pulizia (non è
  // comunque un problema se questa chiamata fallisce: scade comunque da
  // sola dopo PENDING_COLOR_TTL_MS, vedi freshPendingColor).
  releaseColorPending(roomId, myColor);

  // Best-effort: registra il codice come "stanza" nell'indice condiviso
  // codes/ (i tornei sono stati tolti nella v6, l'indice resta per
  // compatibilità). Non blocca né rallenta l'ingresso se fallisce.
  codesRef().child(roomId).transaction((cur) => (cur ? cur : "room")).catch(() => {});

  // (l'ascolto della lobby è già stato staccato in cima alla funzione)
  // Prima la shell, poi l'ascolto: con i dati già in cache Firebase può
  // richiamare onStateChange subito, e senza #start-wrap & co. va in errore
  // ("Cannot set properties of null", visto su un tavolo di torneo).
  vtGo(null, null, () => { renderGameShell(); watchRoom(roomId, onStateChange); });
}

// Nomi assegnati ai bot invece di un generico "Bot Verde"/"Computer" — più
// simpatico e, quando ce n'è più di uno in stanza, li distingue subito uno
// dall'altro a colpo d'occhio in chat/registro/lobby (playerName() li usa
// così come sono, senza bisogno di codice speciale altrove).
const BOT_NAMES = [
  "Guglielmo", "Beatrice", "Leonardo", "Chiara", "Filippo", "Sofia",
  "Tommaso", "Martina", "Riccardo", "Elena", "Davide", "Alessia",
  "Lorenzo", "Giulia", "Edoardo", "Caterina", "Matteo", "Camilla",
  "Federico", "Aurora",
];
// Sceglie un nome libero (non già usato da chi è in stanza) così due bot
// non finiscono mai con lo stesso nome; se per assurdo sono finiti tutti
// occupati (più di 20 tra bot e persone) aggiunge un numero in coda invece
// di bloccarsi.
function pickBotName(usedNames) {
  const used = new Set((usedNames || []).filter(Boolean).map((n) => n.trim().toLowerCase()));
  const free = BOT_NAMES.filter((n) => !used.has(n.toLowerCase()));
  if (free.length > 0) return free[Math.floor(Math.random() * free.length)];
  const base = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
  let n = 2;
  while (used.has((base + " " + n).toLowerCase())) n++;
  return base + " " + n;
}

// Affida un posto libero al computer, invece che a una persona — utile per
// provare o giocare anche quando non siete in 4. Se la stanza non esiste
// ancora (nessuno l'ha creata cliccando "Entra nella stanza"), il computer
// può comunque essere il primo occupante: la creiamo qui allo stesso modo.
//
// `onDone`, se passato, sostituisce il ri-render di default (pensato per la
// lobby PRIMA di entrare, dove non c'è ancora un ascoltatore realtime
// attivo). Chiamata invece dalla sala d'attesa DOPO essere entrati — dove
// watchRoom/onStateChange è già in ascolto e si aggiorna da solo — basta
// passare un no-op per evitare di essere rispediti per errore alla
// schermata di scelta colore/nome.
async function assignBotToColor(roomId, color, onDone, botLevel) {
  unlockAudio();
  const level = botLevel === "easy" ? "easy" : "hard"; // default storico: "difficile" (comportamento di sempre)
  try {
    const ref = roomRef(roomId);
    const snap = await ref.get();
    if (!snap.exists()) {
      const players = {};
      players[color] = { name: pickBotName([]), token: "BOT-" + color, isBot: true, botLevel: level };
      const state = newGameState(players, "manual");
      await writeState(roomId, state);
    } else {
      await updateState(roomId, (state) => {
        if (state.players[color]) throw new Error("questo colore è già stato preso");
        const used = COLORS.map((c) => state.players[c] && state.players[c].name);
        state.players[color] = { name: pickBotName(used), token: "BOT-" + color, isBot: true, botLevel: level };
      });
    }
  } catch (e) {
    showToast("Non riesco ad assegnare il computer: " + describeError(e));
    return;
  }
  if (onDone) { onDone(); return; }
  const snap2 = await roomRef(roomId).get();
  renderManualLobby(roomId, (snap2.val() && snap2.val().players) || {});
}

// Libera un posto assegnato al computer (mai un posto occupato da una
// persona vera — il controllo isBot dentro la transazione lo garantisce).
// Stesso discorso di `onDone` sopra.
async function removeBotFromColor(roomId, color, onDone) {
  try {
    await updateState(roomId, (state) => {
      const p = state.players[color];
      if (!p || !p.isBot) return; // non tocca un posto umano
      delete state.players[color];
    });
  } catch (e) {
    showToast("Non riesco a togliere il computer: " + describeError(e));
    return;
  }
  if (onDone) { onDone(); return; }
  const snap = await roomRef(roomId).get();
  renderManualLobby(roomId, (snap.val() && snap.val().players) || {});
}

// Equivalente di assignBotToColor/removeBotFromColor ma per la modalità
// "estrazione" (roomMode "draw"): qui non si sceglie un colore, quindi il
// bot entra come un giocatore qualsiasi nel draft (nome + token) e rientra
// nel sorteggio delle coppie come chiunque altro. Il colore gli viene
// assegnato più avanti da maybeAdvanceDraft/maybeAdvanceDraftBots, esattamente
// come per una persona vera — solo che se finisce su una coppia composta da
// due bot (nessun umano che possa cliccare "scegli il colore" per loro),
// ci pensa maybeAdvanceDraftBots a farlo al posto suo.
async function assignBotToDraft(roomId, botLevel) {
  unlockAudio();
  const level = botLevel === "easy" ? "easy" : "hard";
  try {
    await updateState(roomId, (state) => {
      if (!state.draft) throw new Error("questa stanza non è in modalità estrazione");
      if (Object.keys(state.draft.players).length >= 4) throw new Error("la stanza è già piena (4 giocatori)");
      const token = "bot-" + Math.random().toString(36).slice(2, 8);
      const name = pickBotName(Object.values(state.draft.players));
      state.draft.players[token] = name;
      state.draft.order.push(token);
      if (!state.draft.botTokens) state.draft.botTokens = {};
      state.draft.botTokens[token] = level;
      maybeStartPairDraw(state);
    });
  } catch (e) {
    showToast("Non riesco ad aggiungere il computer: " + describeError(e));
  }
}

// Toglie un bot dall'estrazione prima che la stanza si riempia (dopo, il
// sorteggio è già partito e non ha più senso liberare il posto da qui).
async function removeBotFromDraft(roomId, token) {
  try {
    await updateState(roomId, (state) => {
      if (!state.draft || !state.draft.botTokens || !state.draft.botTokens[token]) return; // non è un bot, non tocca
      delete state.draft.players[token];
      delete state.draft.botTokens[token];
      state.draft.order = state.draft.order.filter((t) => t !== token);
    });
  } catch (e) {
    showToast("Non riesco a togliere il computer: " + describeError(e));
  }
}

// A color, once claimed in a room, stays claimed by the same device/browser
// (matched via a random token saved in localStorage) so it can always be
// rejoined, while a different device trying to grab an already-taken color
// gets blocked instead of silently stealing the seat.
function getOrCreateClaimToken(roomId, color) {
  const key = "tock-claim-" + roomId + "-" + color;
  try {
    let token = localStorage.getItem(key);
    if (!token) {
      token = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(key, token);
    }
    return token;
  } catch (e) {
    // localStorage unavailable (private mode, etc.) — fall back to a
    // fresh token every time, which just means no reconnect protection.
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
}

// Prenotazione "leggera" e best-effort di un colore, scritta nell'istante
// stesso in cui lo si SELEZIONA in lobby — non solo quando si preme "Entra
// nella stanza", che resta l'unica scrittura VERA e protetta da
// transazione (vedi joinManualRoom). Serve solo a mostrare agli altri
// giocatori "In scelta…" invece di "Libero" durante la finestra in cui
// qualcuno ha già cliccato ma non ancora confermato (bug segnalato: un
// colore selezionato non risultava "preso" agli occhi degli altri finché
// uno dei due non perdeva la transazione finale). Un fallimento di
// scrittura qui non deve mai bloccare nulla — nel peggiore dei casi
// l'avviso semplicemente non compare.
// Con una transazione: la prenotazione si prende (o si rinnova) solo se è
// libera, scaduta o già nostra — mai sovrascrivendo quella fresca di un
// altro telefono. Prima era un semplice set(): l'ultimo a toccare vinceva
// la prenotazione ma il primo restava col suo ✓, e i due telefoni
// mostravano entrambi lo stesso colore come proprio.
let lastPendingRefresh = 0;
function reserveColorPending(roomId, color) {
  try {
    const token = getOrCreateClaimToken(roomId, color);
    lastPendingRefresh = Date.now();
    // Restituisce true (prenotato), false (lo ha già un altro telefono) o
    // null (errore/rete): serve a "Siediti" per mostrare l'esito sul pulsante.
    return roomRef(roomId)
      .child("pending")
      .child(color)
      .transaction((current) => {
        if (current && current.token !== token && freshPendingColor({ x: current }, "x")) return undefined;
        return { token, ts: serverNow() };
      })
      .then((r) => !!(r && r.committed))
      .catch(() => null);
  } catch (e) {
    return Promise.resolve(null);
  }
}

// La prenotazione di questo colore è di un ALTRO telefono (ed è ancora valida).
function pendingByOther(roomId, pending, c) {
  if (!freshPendingColor(pending, c)) return false;
  try {
    return pending[c].token !== getOrCreateClaimToken(roomId, c);
  } catch (e) {
    return true;
  }
}

// Libera una prenotazione SOLO se è la nostra (stesso token, verificato con
// una transazione) — così non si rischia mai di cancellare per sbaglio la
// prenotazione di un altro giocatore che nel frattempo ha scelto lo stesso
// colore dopo di noi.
function releaseColorPending(roomId, color) {
  try {
    const token = getOrCreateClaimToken(roomId, color);
    roomRef(roomId)
      .child("pending")
      .child(color)
      .transaction((current) => (current && current.token === token ? null : current))
      .catch(() => {});
  } catch (e) {}
}

// Una prenotazione conta solo per una finestra breve: se chi l'ha fatta
// chiude la scheda, cambia idea senza scegliere un altro colore, o perde
// semplicemente la connessione, non deve restare mostrata come "In
// scelta…" per sempre — scade da sola, senza bisogno di nessuna pulizia
// lato server.
const PENDING_COLOR_TTL_MS = 45000;
function freshPendingColor(pending, c) {
  const p = pending && pending[c];
  return !!(p && p.token && typeof p.ts === "number" && serverNow() - p.ts < PENDING_COLOR_TTL_MS);
}

// A room-scoped (not per-color) token used only during il flusso
// "estrazione", prima che un colore sia assegnato — serve a riconoscere lo
// stesso dispositivo se ricarica la pagina mentre si è ancora in attesa o a
// metà del sorteggio.
function getOrCreateRoomToken(roomId) {
  const key = "tock-roomtoken-" + roomId;
  try {
    let token = localStorage.getItem(key);
    if (!token) {
      token = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(key, token);
    }
    return token;
  } catch (e) {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
}

// ================= Gioca subito: accoppiamento automatico (v6) =================
//
// "🎲 Gioca subito" in home cerca da solo altri giocatori disponibili. Usa
// stanze pubbliche con codici fissi (AUTO-1, AUTO-2, …) in modalità
// "estrazione" (vedi più sotto): niente percorsi nuovi su Firebase.
//  - si sceglie la stanza più bassa con qualcuno già in attesa, altrimenti
//    una vuota (o una partita abbandonata da riusare, vedi mmIsAbandoned);
//  - chi aspetta e chiude l'app sparisce da solo dalla stanza
//    (onDisconnect toglie draft/players/<token>), così nessun "fantasma"
//    occupa un posto;
//  - al 4° giocatore coppie e colori si decidono a caso NELLA STESSA
//    transazione (mmAutoTeams) e si distribuisce subito: nessuna schermata
//    di estrazione, si va dritti al tabellone;
//  - chi non vuole aspettare completa i posti liberi con il computer.
const MM_PREFIX = "AUTO-";
const MM_BATCH = 6; // stanze lette insieme a ogni giro della ricerca
const MM_MAX_ROOMS = 60;
const MM_ABANDONED_MS = 10 * 60 * 1000; // partita ferma e senza nessuno collegato da 10 minuti
const MM_LAST_KEY = "tock-last-match";
// v6.04: chi aspetta dà un "segno di vita" ogni 15 s (draft/seen/<token>); chi
// tace da più di 45 s è un posto fantasma (app chiusa ma connessione non ancora
// caduta, tipico dell'iPhone) e viene tolto da chiunque passi dalla stanza.
const MM_BEAT_MS = 15000;
const MM_STALE_MS = 45000;

function isMatchRoom(roomId) {
  return typeof roomId === "string" && roomId.indexOf(MM_PREFIX) === 0;
}

let mm = null; // { roomId, token, since, busy } mentre si cerca / si aspetta

function mmIsStale(d, t) {
  if (d.botTokens && d.botTokens[t]) return false;
  const seen = d.seen && d.seen[t];
  return !seen || serverNow() - seen > MM_STALE_MS;
}
// Posti davvero occupati (computer + persone che hanno dato segno di vita).
function mmLiveTokens(d) {
  if (!d || !d.players) return [];
  const order = (d.order || []).filter((t) => d.players[t]);
  Object.keys(d.players).forEach((t) => { if (!order.includes(t)) order.push(t); });
  return order.filter((t) => !mmIsStale(d, t));
}
// Toglie i posti fantasma (mai il proprio).
function mmPruneStale(d, keep) {
  if (!d || !d.players || d.pairDraw) return;
  Object.keys(d.players).forEach((t) => {
    if (t === keep || !mmIsStale(d, t)) return;
    delete d.players[t];
    if (d.playerIds) delete d.playerIds[t];
    if (d.seen) delete d.seen[t];
    if (Array.isArray(d.order)) d.order = d.order.filter((x) => x !== t);
  });
}
function mmDraftCount(st) {
  return st && st.draft ? mmLiveTokens(st.draft).length : 0;
}
function mmIsWaitingRoom(st) {
  return !!(st && st.roomMode === "draw" && st.phase === "lobby" && st.draft && !st.draft.pairDraw && mmDraftCount(st) < 4);
}
// Ultimo segno di vita di una partita: inizio dell'ultimo turno o ultimo messaggio in chat.
function mmLastActivity(st) {
  let t = Number(st.turnStartedAt) || 0;
  (st.chat || []).forEach((m) => { if (m && m.ts > t) t = m.ts; });
  return t;
}
function mmFingerprint(st) {
  return st.phase + "|" + (st.turnStartedAt || 0) + "|" + (st.log ? st.log.length : 0);
}
// Una partita già cominciata si può riusare solo se nessuno è collegato e
// (è finita, oppure è ferma da più di MM_ABANDONED_MS).
function mmIsAbandoned(st, presenceVal) {
  if (!st || st.roomMode !== "draw" || st.phase === "lobby") return false;
  const someoneOnline = presenceVal && Object.values(presenceVal).some((conns) => conns && typeof conns === "object" && Object.keys(conns).length > 0);
  if (someoneOnline) return false;
  if (st.phase === "finished") return true;
  return Date.now() - mmLastActivity(st) > MM_ABANDONED_MS;
}

// Cerca la stanza giusta: { roomId, recycle: fingerprint|null }.
async function mmFindRoom() {
  for (let start = 1; start <= MM_MAX_ROOMS; start += MM_BATCH) {
    const ids = [];
    for (let n = start; n < start + MM_BATCH && n <= MM_MAX_ROOMS; n++) ids.push(MM_PREFIX + n);
    const snaps = await Promise.all(ids.map((id) => roomRef(id).get()));
    const states = snaps.map((s) => (s.exists() ? normalizeState(s.val()) : null));
    // 1) c'è già qualcuno che aspetta? si va con chi è più vicino a 4
    // 0) ci sono già io (rientro dopo aver chiuso l'app)? stessa stanza, stesso posto
    const mine = states.findIndex((st) => st && st.roomMode === "draw" && st.phase === "lobby" && st.draft && !st.draft.pairDraw && st.draft.players && st.draft.players[mmDeviceToken()]);
    if (mine >= 0) return { roomId: ids[mine], recycle: null };
    let best = -1;
    states.forEach((st, i) => {
      if (mmIsWaitingRoom(st) && mmDraftCount(st) > 0 && (best < 0 || mmDraftCount(st) > mmDraftCount(states[best]))) best = i;
    });
    if (best >= 0) return { roomId: ids[best], recycle: null };
    // 2) altrimenti la prima libera: vuota, mai usata o abbandonata
    const started = states.map((st, i) => (st && st.phase !== "lobby" ? i : -1)).filter((i) => i >= 0);
    const presence = {};
    await Promise.all(started.map((i) => db.ref("presence/" + ids[i]).get().then((p) => { presence[i] = p.val(); }).catch(() => { presence[i] = { x: { x: 1 } }; })));
    for (let i = 0; i < ids.length; i++) {
      const st = states[i];
      if (!st || mmIsWaitingRoom(st)) return { roomId: ids[i], recycle: null };
      if (mmIsAbandoned(st, presence[i])) return { roomId: ids[i], recycle: mmFingerprint(st) };
    }
  }
  return null;
}

// v6.04: un solo "posto" per telefono (prima era nuovo a ogni ricerca, e chi
// chiudeva e riapriva l'app si ritrovava seduto due volte).
let _mmDevice = null;
function mmDeviceToken() {
  if (_mmDevice) return _mmDevice;
  try { _mmDevice = localStorage.getItem("tock-mm-device"); } catch (e) {}
  if (!_mmDevice) {
    _mmDevice = "d" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { localStorage.setItem("tock-mm-device", _mmDevice); } catch (e) {}
  }
  return _mmDevice;
}
function mmFreshToken(roomId) {
  const token = mmDeviceToken();
  try { localStorage.setItem("tock-roomtoken-" + roomId, token); } catch (e) {}
  return token;
}

// Due sconosciuti possono chiamarsi uguale: il secondo diventa "Marco 2".
function mmUniqueName(draftPlayers, token, name) {
  const taken = Object.entries(draftPlayers || {}).filter(([t]) => t !== token).map(([, n]) => String(n || "").trim().toLowerCase());
  let out = name, k = 2;
  while (taken.includes(out.trim().toLowerCase())) out = name + " " + k++;
  return out;
}

// Prova a sedersi in roomId. Esito: "ok" | "taken" | "error".
async function mmJoinRoom(roomId, recycle, token) {
  let outcome = "taken";
  const res = await roomRef(roomId)
    .transaction((current) => {
      outcome = "taken";
      let st;
      if (current === null) st = newGameState({}, "draw");
      else {
        st = normalizeState(JSON.parse(JSON.stringify(current)));
        if (recycle && st.phase !== "lobby" && mmFingerprint(st) === recycle) st = newGameState({}, "draw");
        else if (!(st.draft && st.draft.players && st.draft.players[token]) && !mmIsWaitingRoom(st)) return undefined;
      }
      const d = st.draft;
      mmPruneStale(d, token);
      if (!d.seen) d.seen = {};
      d.seen[token] = serverNow();
      if (!d.players[token]) d.order.push(token);
      d.players[token] = mmUniqueName(d.players, token, myName);
      if (!d.playerIds) d.playerIds = {};
      d.playerIds[token] = myPlayerId || null;
      if (!d.botTokens) d.botTokens = {};
      maybeStartPairDraw(st);
      mmAutoTeams(st);
      outcome = "ok";
      return st;
    })
    .catch((e) => { console.error(e); outcome = "error"; return null; });
  if (outcome === "ok" && res && res.committed === false) outcome = "taken";
  return outcome;
}

// Chi aspetta e perde la connessione (app chiusa, telefono spento) viene
// tolto dalla stanza dal server stesso.
function mmArmDisconnect(roomId, token) {
  const base = roomRef(roomId).child("draft");
  base.child("players/" + token).onDisconnect().remove().catch(() => {});
  base.child("playerIds/" + token).onDisconnect().remove().catch(() => {});
  base.child("seen/" + token).onDisconnect().remove().catch(() => {});
}
function mmDisarmDisconnect(roomId, token) {
  if (!roomId || !token) return;
  const base = roomRef(roomId).child("draft");
  base.child("players/" + token).onDisconnect().cancel().catch(() => {});
  base.child("playerIds/" + token).onDisconnect().cancel().catch(() => {});
  base.child("seen/" + token).onDisconnect().cancel().catch(() => {});
}

// Segno di vita mentre si aspetta (+ pulizia dei posti fantasma degli altri).
let mmBeatTimer = null;
function mmStartBeat() {
  clearInterval(mmBeatTimer);
  mmBeatTimer = setInterval(() => {
    if (!mm || !mm.roomId) { clearInterval(mmBeatTimer); return; }
    const tok = mm.token;
    roomRef(mm.roomId).transaction((st) => {
      if (!st || !st.draft || !st.draft.players || st.draft.pairDraw || !st.draft.players[tok]) return undefined;
      if (!st.draft.seen) st.draft.seen = {};
      st.draft.seen[tok] = serverNow();
      mmPruneStale(st.draft, tok);
      return st;
    }).catch(() => {});
  }, MM_BEAT_MS);
}

// Punto d'ingresso dal pulsante "Gioca subito".
async function startMatchmaking() {
  unlockAudio();
  const saved = getSavedPlayerShortcut();
  if (!saved || !saved.nome) return vtGo(null, null, () => renderMatchNameScreen());
  myName = saved.nome;
  myPlayerId = saved.id || null;
  mmSearch();
}

function renderMatchNameScreen() {
  const root = $("#app");
  root.innerHTML = "";
  const saved = getSavedPlayerShortcut();
  const nameField = buildRubricaNameInput("name-input", myName || (saved && saved.nome) || "");
  const go = el("button", { id: "join-btn", class: "primary" }, "Cerca giocatori", forwardArrowIcon());
  const submit = async () => {
    const typed = nameField.input.value.trim();
    if (!typed) return showToast("Scrivi il tuo nome.");
    unlockAudio();
    fbBusy(go, "Un attimo…");
    let player;
    try {
      player = await resolvePlayerName(typed);
    } catch (e) {
      fbFail(go, "Nessuna connessione");
      return;
    }
    myName = player.nome;
    myPlayerId = player.id;
    savePlayerShortcut(player.id, player.nome);
    mmSearch();
  };
  go.onclick = submit;
  nameField.input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  root.appendChild(
    el(
      "div",
      { class: "lobby-card" },
      smallScreenHeader("", ""),
      el("p", { class: "rj-title" }, "🎲 Gioca subito"),
      el("p", { class: "rj-text" }, "Come ti chiami? Il nome lo vedono gli altri giocatori e serve per la classifica."),
      el("p", { class: "step-label" }, "Il tuo nome"),
      nameField.wrap,
      go,
      el("button", { class: "text-link-btn", style: "margin-top:10px;", onclick: () => vtGo(null, null, renderLobby) }, backChevronIcon(), "Torna alla home")
    )
  );
  setTimeout(() => { try { nameField.input.focus(); } catch (e) {} }, 50);
}

async function mmSearch() {
  if (mm && mm.busy) return;
  mm = { roomId: null, token: null, since: Date.now(), busy: true };
  mmRenderKey = null;
  renderMatchWaiting(null);
  try {
    for (let attempt = 0; attempt < 6 && mm; attempt++) {
      const found = await mmFindRoom();
      if (!mm) return; // annullato nel frattempo
      if (!found) break;
      const token = mmFreshToken(found.roomId);
      const outcome = await mmJoinRoom(found.roomId, found.recycle, token);
      if (!mm) return;
      if (outcome === "ok") {
        mm.roomId = found.roomId;
        mm.token = token;
        mm.busy = false;
        myRoomId = found.roomId;
        myToken = token;
        mmArmDisconnect(found.roomId, token);
        mmStartBeat();
        incrementStat("matchmaking");
        watchRoom(found.roomId, onDraftStateChange);
        return;
      }
      if (outcome === "error") throw new Error("join");
    }
    throw new Error("nessuna stanza");
  } catch (e) {
    console.error(e);
    mm = null;
    showToast("Non riesco a cercare giocatori adesso: controlla la connessione e riprova.");
    renderLobby();
  }
}

// Rientra nella stessa stanza se il server ci ha tolto (connessione caduta
// per un attimo); se nel frattempo la partita è partita senza di noi si
// ricomincia la ricerca.
let mmRejoining = false;
async function mmRejoin() {
  if (!mm || !mm.roomId || mmRejoining) return;
  mmRejoining = true;
  try {
    const outcome = await mmJoinRoom(mm.roomId, null, mm.token);
    if (!mm) return;
    if (outcome === "ok") mmArmDisconnect(mm.roomId, mm.token);
    else {
      roomRef(mm.roomId).off("value");
      mm.busy = false;
      mmSearch();
    }
  } finally {
    mmRejoining = false;
  }
}

async function mmCancel() {
  const cur = mm;
  mm = null;
  if (cur && cur.roomId) {
    roomRef(cur.roomId).off("value");
    clearInterval(mmBeatTimer);
    mmDisarmDisconnect(cur.roomId, cur.token);
    await roomRef(cur.roomId).transaction((st) => {
      if (!st || !st.draft || !st.draft.players || st.draft.pairDraw) return undefined;
      delete st.draft.players[cur.token];
      if (st.draft.playerIds) delete st.draft.playerIds[cur.token];
      if (st.draft.seen) delete st.draft.seen[cur.token];
      if (Array.isArray(st.draft.order)) st.draft.order = st.draft.order.filter((t) => t !== cur.token);
      // rimasti solo computer? si svuota la stanza, così è subito libera
      if (Object.keys(st.draft.players).every((t) => st.draft.botTokens && st.draft.botTokens[t])) return newGameState({}, "draw");
      return st;
    }).catch(() => {});
  }
  myRoomId = null;
  myToken = null;
  vtGo(null, null, renderLobby);
}

// Completa tutti i posti liberi con il computer (una sola scrittura).
async function mmFillWithBots(level, btn) {
  if (!mm || !mm.roomId) return;
  if (btn) fbBusy(btn, "Preparo il tavolo…");
  try {
    await updateState(mm.roomId, (state) => {
      const d = state.draft;
      if (!d || d.pairDraw) return;
      if (!d.botTokens) d.botTokens = {};
      mmPruneStale(d, mm && mm.token);
      while (Object.keys(d.players).length < 4) {
        const token = "bot-" + Math.random().toString(36).slice(2, 8);
        d.players[token] = pickBotName(Object.values(d.players));
        d.order.push(token);
        d.botTokens[token] = level === "easy" ? "easy" : "hard";
      }
      maybeStartPairDraw(state);
      mmAutoTeams(state);
    });
  } catch (e) {
    if (btn) fbFail(btn, "Riprova");
    showToast("Non riesco ad aggiungere il computer: " + describeError(e));
  }
}

// Al 4° giocatore: coppie, accoppiata di colori e colori a caso, poi si
// distribuisce subito (stessa transazione di chi completa il tavolo).
function mmAutoTeams(state) {
  const d = state.draft;
  if (!d || !d.pairDraw || d.pairChoice) return;
  d.pairChoice = { pickIndex: 0, pick: Math.random() < 0.5 ? "RY" : "GB" };
  assignBotPairColors(state, 0);
  assignBotPairColors(state, 1);
  maybeFinalizeDraft(state);
}

function mmElapsed() {
  return mm ? formatElapsed(Date.now() - mm.since) : "";
}

let mmTimer = null;
let mmRenderKey = null;
function renderMatchWaiting(state) {
  const root = $("#app");
  if (!root) return;
  const d = state && state.draft;
  const tokens = d ? mmLiveTokens(d) : [];
  if (d && d.players[myToken] && !tokens.includes(myToken)) tokens.push(myToken);
  // Ridisegna solo se cambia chi è seduto (il segno di vita ogni 15 s non deve
  // far ripartire le animazioni).
  const key = d ? tokens.map((t) => t + ":" + d.players[t]).join("|") : "searching";
  if (key === mmRenderKey && root.querySelector(".mm-card")) return;
  mmRenderKey = key;
  const n = tokens.length || (mm && mm.roomId ? 0 : 1);
  const slots = [];
  for (let i = 0; i < 4; i++) {
    const t = tokens[i];
    if (t) {
      const isBot = !!(d.botTokens && d.botTokens[t]);
      const nm = d.players[t];
      slots.push(el("div", { class: "mm-slot mm-in" + (t === myToken ? " mm-me" : "") },
        el("span", { class: "mm-av", style: isBot ? "" : `background:${tAvatarColor(nm)}` }, isBot ? "🤖" : (nm || "?").trim().charAt(0).toUpperCase()),
        el("span", { class: "mm-nm" }, t === myToken ? "Tu" : nm)));
    } else if (!d && i === 0) {
      slots.push(el("div", { class: "mm-slot mm-in mm-me" },
        el("span", { class: "mm-av", style: `background:${tAvatarColor(myName || "")}` }, (myName || "?").trim().charAt(0).toUpperCase()),
        el("span", { class: "mm-nm" }, "Tu")));
    } else {
      slots.push(el("div", { class: "mm-slot" }, el("span", { class: "mm-av mm-empty" }, el("i"), el("i"), el("i")), el("span", { class: "mm-nm" }, "Libero")));
    }
  }
  const missing = 4 - Math.max(n, tokens.length);
  const elapsed = el("span", { class: "mm-time" }, mmElapsed());
  const card = el(
    "div",
    { class: "lobby-card mm-card" },
    smallScreenHeader("", ""),
    el("div", { class: "mm-hero" },

      el("p", {}, d ? `Siete in ${Math.max(n, tokens.length)} su 4 · ` : "", elapsed),
      el("div", { class: "mm-slots" }, slots)),
    d && missing > 0
      ? el("div", { class: "mm-bots" },
          el("p", {}, "Non vuoi aspettare? I posti liberi li prende il computer:"),
          el("div", { class: "mm-bot-btns" },
            el("button", { class: "primary", onclick: (ev) => mmFillWithBots("easy", ev.currentTarget) }, "🤖 Normale"),
            el("button", { class: "primary", onclick: (ev) => mmFillWithBots("hard", ev.currentTarget) }, "🤖 Difficile")))
      : "",
    el("p", { class: "muted mm-note" }, "Tieni aperta l'app: appena siete in 4 squadre e colori si decidono a caso e la partita parte da sola."),

  }, 1000);
}

// Colore dell'iniziale nei tondini (ricavato dal nome, sempre lo stesso).
function tAvatarColor(s) {
  const pal = ["#D9636B", "#3FA77E", "#E3AC33", "#3E8FCB", "#9B6BC4", "#D9884A", "#4BA3A8"];
  let h = 0;
  for (const ch of String(s || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return pal[h % pal.length];
}

// ================= Estrazione squadre =================
//
// Modalità alternativa alla lobby manuale: si entra con solo il nome, e
// quando la stanza è piena (4 nomi) parte da sola, per tutti in
// contemporanea (via Firebase), una sequenza di 3 passaggi:
//  1. sorteggio delle coppie (chi gioca con chi)
//  2. la coppia sceglie l'accoppiata di colori (Rosso+Giallo o Verde+Blu) —
//     chi clicca per primo se la aggiudica
//  3. ciascuno sceglie il proprio colore tra i due della propria squadra
// Al termine, i colori finali vengono scritti in state.players esattamente
// come nella modalità manuale, quindi da lì in poi il resto del gioco
// (tabellone, mano, ecc.) non sa nemmeno che è stata usata un'estrazione.

function renderDraftNameScreen(roomId) {

  const savedPlayer = getSavedPlayerShortcut();
  const nameField = buildRubricaNameInput("name-input", myName || (savedPlayer && savedPlayer.nome) || "");
  root.appendChild(
    el(
      "div",
      { class: "lobby-card" },
      smallScreenHeader("Stanza", roomId),
      el("p", { class: "rj-title" }, "🎲 Estrazione a sorte"),
      el("p", { class: "rj-text" }, "Qui non scegli il colore: scrivi il tuo nome. Quando siete in 4, coppie e colori si decidono a caso."),
      el("p", { class: "step-label" }, "Il tuo nome"),
      nameField.wrap,
      el("button", { id: "join-btn", class: "primary", onclick: () => joinDraftRoom(roomId) }, "Entra nella stanza", forwardArrowIcon()),
      el("button", { class: "text-link-btn", style: "margin-top:10px;", onclick: vtHome }, backChevronIcon(), "Cambia stanza"),
      homeScreenHint()
    )
  );
}

async function joinDraftRoom(roomId) {
  unlockAudio();
  const typed = $("#name-input").value.trim();
  if (!typed) return showToast("Inserisci il tuo nome.");
  // Rubrica (v5): vedi il commento gemello in joinManualRoom.
  const player = await resolvePlayerName(typed);
  myRoomId = roomId;
  myName = player.nome;
  myPlayerId = player.id;
  savePlayerShortcut(player.id, player.nome);
  myToken = getOrCreateRoomToken(roomId);

  // Un'UNICA transazione atomica (leggi-controlla-scrivi), non più un
  // get() separato seguito da un set()/updateState(): quel prima/dopo
  // lasciava una finestra in cui la stanza poteva risultare "esistente"
  // al get() iniziale ma "non ancora in cache" un istante dopo dentro la
  // transazione (tipico subito dopo essere entrati, prima che un
  // ascoltatore stabile l'abbia letta) — capitava un falso "questa stanza
  // non esiste più" anche su una stanza appena creata. Qui, come già in
  // joinManualRoom, `current === null` non è trattato come un errore: si
  // prova a creare la stanza da zero, e se in realtà esisteva già (solo
  // non in cache), Firebase stesso rifiuta il tentativo e ripete la
  // callback con lo stato vero — nessuna finestra di corsa critica.
  const ref = roomRef(roomId);
  let blockedReason = null; // "wrongMode" | "full" | "nameTaken" | null
  let caughtError = null;
  const result = await ref
    .transaction((current) => {
      blockedReason = null;
      try {
        if (current === null) {
          const state = newGameState({}, "draw");
          state.draft.players[myToken] = myName;
          state.draft.order.push(myToken);
          if (!state.draft.playerIds) state.draft.playerIds = {};
          state.draft.playerIds[myToken] = myPlayerId || null;
          return state;
        }
        const state = normalizeState(JSON.parse(JSON.stringify(current)));
        if (state.roomMode !== "draw") {
          blockedReason = "wrongMode";
          return undefined;
        }
        if (!state.draft.players[myToken] && Object.keys(state.draft.players).length >= 4) {
          blockedReason = "full";
          return undefined;
        }
        // Due giocatori con lo stesso nome mandano in confusione il
        // rientro-per-nome più avanti (non saprebbe a chi dei due
        // restituire il posto), quindi lo blocchiamo già qui.
        const nameTaken = Object.entries(state.draft.players).some(
          ([tok, n]) => tok !== myToken && n && n.trim().toLowerCase() === myName.trim().toLowerCase()
        );
        if (nameTaken) {
          blockedReason = "nameTaken";
          return undefined;
        }
        if (!state.draft.players[myToken]) state.draft.order.push(myToken);
        state.draft.players[myToken] = myName;
        if (!state.draft.playerIds) state.draft.playerIds = {};
        state.draft.playerIds[myToken] = myPlayerId || null;
        maybeStartPairDraw(state);
        return state;
      } catch (e) {
        caughtError = e;
        return undefined;
      }
    })
    .catch((e) => {
      caughtError = e;
      return null;
    });

  if (blockedReason === "wrongMode") {
    const snap = await ref.get().catch(() => null);
    const existing = snap && snap.val() ? normalizeState(snap.val()) : null;
    showToast("Questa stanza è già in modalità manuale — scegli il colore.");
    renderManualLobby(roomId, (existing && existing.players) || {});
    return;
  }
  if (blockedReason === "full") {
    showToast("Non è entrato: la stanza è già piena (4 giocatori).");
    return;
  }
  if (blockedReason === "nameTaken") {
    showToast(`"${myName}" è già stato usato da un altro giocatore in questa stanza. Scegli un nome diverso (es. aggiungi un'iniziale).`);
    return;
  }
  if (caughtError) {
    showToast("Non è entrato: " + describeError(caughtError));
    console.error(caughtError);
    return;
  }
  if (result && result.committed === false) {
    showToast("Non è entrato: richiesta non completata. Riprova.");
    return;
  }

  draftAnimShown.pairDraw = false;
  // Best-effort, vedi il commento gemello in joinManualRoom.
  codesRef().child(roomId).transaction((cur) => (cur ? cur : "room")).catch(() => {});
  watchRoom(roomId, onDraftStateChange);
}

function onDraftStateChange(state) {
  if (!state) return;

  // Se il mio colore finale è già stato assegnato, l'estrazione è
  // conclusa: passo alla normale schermata di gioco, esattamente come la
  // modalità manuale.
  const myColorFound = COLORS.find((c) => state.players[c] && state.players[c].token === myToken);
  if (myColorFound) {
    myColor = myColorFound;
    // Così un eventuale ricollegamento futuro passa dal normale
    // meccanismo per-colore, condiviso con la modalità manuale.
    try { localStorage.setItem("tock-claim-" + myRoomId + "-" + myColor, myToken); } catch (e) {}
    if (isMatchRoom(myRoomId)) {
      mmDisarmDisconnect(myRoomId, myToken);
      mmRememberRoom(myRoomId);
      mm = null;
      clearInterval(mmTimer);
      clearInterval(mmBeatTimer);
      mmRenderKey = null;
    }
    // IMPORTANTE: costruisco la shell di gioco PRIMA di agganciare il
    // listener Firebase e prima di chiamare onStateChange a mano. Prima
    // l'ordine era invertito (watchRoom veniva attaccato prima di
    // renderGameShell): se il listener richiamava onStateChange in modo
    // sincrono (o comunque prima che renderGameShell fosse eseguita),
    // la schermata di rivelazione del mazziere veniva creata e inserita
    // in #app, e SUBITO DOPO renderGameShell() azzerava #app con
    // innerHTML="" cancellandola — ma dealerDrawAnimShown risultava già
    // marcato per questa stanza, quindi il richiamo successivo (quello nel
    // requestAnimationFrame qui sotto) veniva bloccato dalla guardia e non
    // la ricreava più. Risultato: il toast di riserva compariva (era stato
    // mostrato durante la prima chiamata, prima della cancellazione) ma il
    // riquadro dell'estrazione no. Costruendo prima la shell, qualunque
    // chiamata a onStateChange (dal listener o dal nostro rAF) trova #app
    // già pronta e non rischia più di essere spazzata via.
    renderGameShell();
    roomRef(myRoomId).off("value");
    watchRoom(myRoomId, onStateChange);
    // Non aspetta il prossimo giro del listener Firebase per mostrare la
    // schermata di gioco vera e propria (mano già distribuita, rivelazione
    // del mazziere inclusa, vedi dealAndRevealDealer): lo stato lo abbiamo
    // già qui, quindi lo disegniamo subito — stesso principio "non
    // dipendere da un secondo giro" già applicato altrove in questa
    // sessione, invece di fidarsi ciecamente del fatto che il listener
    // appena riattaccato richiami onStateChange in tempo utile da solo.
    //
    // Un frame di ritardo (requestAnimationFrame) apposta: anche se ora
    // #app è già stata ricostruita da renderGameShell() qui sopra, il
    // frame appena dopo lascia comunque al browser il tempo di "vedere" lo
    // stato iniziale del nuovo albero DOM prima di far partire eventuali
    // animazioni CSS di comparsa, invece di crearle e animarle nello stesso
    // istante sincrono in cui sono state inserite.
    requestAnimationFrame(() => onStateChange(state));
    return;
  }

  maybeAdvanceDraft(state);
  if (isMatchRoom(myRoomId)) {
    if (mm && mm.roomId === myRoomId && !state.draft.players[myToken]) mmRejoin();
    renderMatchWaiting(state);
    return;
  }
  maybeAdvanceDraftBots(state);
  renderDraftScreen(state);
}

// Estrae il sorteggio delle coppie non appena il 4° posto si riempie.
// Va chiamata DIRETTAMENTE dentro la stessa transazione che scrive il 4°
// giocatore (join di una persona, o aggiunta dell'ultimo bot) — non solo
// da maybeAdvanceDraft in risposta al listener "value" — così la stanza
// passa al sorteggio in modo atomico, senza dover contare su un secondo
// giro di scrittura innescato dopo il fatto: se per qualsiasi motivo quel
// secondo giro tardasse o non scattasse, la stanza restava bloccata a
// "in attesa" anche con 4/4 giocatori già presenti.
function maybeStartPairDraw(state) {
  const d = state.draft;
  if (!d || d.pairDraw) return;
  if (Object.keys(d.players).length !== 4) return;
  const tokens = d.order.filter((t) => d.players[t]).slice(0, 4);
  const shuffled = shuffle(tokens);
  d.pairDraw = { pairs: [[shuffled[0], shuffled[1]], [shuffled[2], shuffled[3]]] };
}

// Fa avanzare l'estrazione da uno stato all'altro. È chiamata da tutti e 4
// i client ogni volta che lo stato cambia, ma ogni passaggio è protetto da
// un controllo dentro la transazione Firebase, quindi anche se più client
// la eseguono nello stesso istante il risultato viene scritto una volta
// sola (gli altri tentativi diventano no-op). Resta come rete di sicurezza
// oltre a maybeStartPairDraw (es. se il 4° giocatore fosse entrato prima
// di questo aggiornamento del codice, o in un caso limite non coperto).
function maybeAdvanceDraft(state) {
  const d = state.draft;
  if (!d) return;

  if (Object.keys(d.players).length === 4 && !d.pairDraw) {
    updateState(myRoomId, (s) => {
      maybeStartPairDraw(s);
      if (isMatchRoom(myRoomId)) mmAutoTeams(s);
    }).catch(() => {});
    return;
  }

  if (d.pairDraw && Object.keys(d.colorPicks).length === 4 && Object.keys(state.players).length < 4) {
    updateState(myRoomId, (s) => {
      maybeFinalizeDraft(s);
    }).catch(() => {});
  }
}

// Anche questa, come maybeStartPairDraw/assignBotPairColors, va richiamata
// direttamente dentro la stessa transazione che porta colorPicks a 4 (vedi
// pickSoloColor e pickColorPair) e non solo dal giro di sicurezza qui sopra
// innescato dal listener.
function maybeFinalizeDraft(state) {
  const d = state.draft;
  if (!d) return;
  if (Object.keys(state.players).length >= 4) return; // già finalizzato
  if (Object.keys(d.colorPicks).length < 4) return;
  for (const [token, color] of Object.entries(d.colorPicks)) {
    const botLevel = d.botTokens && d.botTokens[token];
    state.players[color] = botLevel
      ? { name: d.players[token], token, isBot: true, botLevel }
      : { name: d.players[token], token, playerId: (d.playerIds && d.playerIds[token]) || null };
  }
  // A differenza della modalità manuale (dove tutti scelgono il proprio
  // colore da soli e quindi c'è sempre qualcuno pronto a cliccare "Inizia
  // partita"), qui l'estrazione è già di per sé l'azione che l'unica
  // persona presente ha compiuto: non ha senso rimandarla a un secondo
  // click su un pulsante che potrebbe non essere ovvio da trovare. Si
  // distribuisce quindi subito la prima mano (vedi la nota su
  // dealAndRevealDealer per perché non si aspetta più l'animazione).
  dealAndRevealDealer(state);
}

// Determina il mazziere e distribuisce subito la prima mano, invece di
// limitarsi a impostare la fase "dealerDraw" e ASPETTARE che l'animazione
// lato client (fino a ~30s: pesca carte finché non esce l'Asso di Cuori)
// finisca per davvero distribuire — quell'attesa dipendeva da un SOLO
// client che restasse in primo piano per tutta la sua durata, esattamente
// il tipo di punto debole già visto e corretto altrove in questa sessione
// (se quel client si bloccava, andava in background o si ricaricava a
// metà, la partita restava bloccata per sempre su "in attesa"). Il
// risultato dell'estrazione è comunque deterministico e calcolato subito
// (buildDealerDrawSequence), quindi non c'è motivo di farlo dipendere da
// un'animazione: la sequenza resta salvata in state.dealerDraw SOLO per
// essere mostrata come effetto scenico da ogni client (vedi
// renderDealerDrawScreen), ma il gioco vero e proprio (fase, mazziere,
// carte in mano) è già pronto anche se nessuno la vede fino alla fine.
function dealAndRevealDealer(state) {
  const draw = buildDealerDrawSequence();
  state.dealerDraw = draw;
  state.dealerColor = draw.winnerColor;
  dealNewHand(state); // porta la fase a "exchanging" e distribuisce le carte
}

// Se una coppia estratta è composta da DUE bot, nessun client umano
// cliccherà mai "scegli il colore" per loro (pickColorPair/pickSoloColor
// sono pensati per una persona che clicca sulla propria squadra) — la
// scelta della squadra normale, quando almeno uno dei due è umano, resta
// invariata: il partner umano che clicca assegna automaticamente anche il
// colore del compagno bot (vedi pickSoloColor). Qui si copre solo il caso
// in cui NESSUNO dei due può farlo da sé: un bot decide al posto della
// coppia, dopo una piccola pausa "umana", con lo stesso schema idempotente
// (transazione Firebase) usato per le mosse dei bot in partita.
let draftBotTimer = null;
function scheduleDraftBotAction(fn) {
  if (draftBotTimer) return;
  const delay = 900 + Math.random() * 900; // 0,9s – 1,8s
  draftBotTimer = setTimeout(() => {
    draftBotTimer = null;
    fn().catch((e) => console.error("bot estrazione:", e));
  }, delay);
}

function maybeAdvanceDraftBots(state) {
  const d = state.draft;
  if (!d || !d.pairDraw || !d.pairChoice) return;
  if (Object.keys(d.colorPicks).length >= 4) return;
  const botTokens = d.botTokens || {};
  for (let pairIndex = 0; pairIndex < 2; pairIndex++) {
    const pair = d.pairDraw.pairs[pairIndex];
    if (!pair || !pair.every((t) => botTokens[t])) continue; // almeno un umano: ci pensa lui/lei
    if (pair.some((t) => d.colorPicks[t])) continue; // già assegnato
    scheduleDraftBotAction(() => botPickPairColors(pairIndex));
    return;
  }
}

// Logica pura (nessuna transazione propria) così può essere richiamata sia
// da botPickPairColors (giro separato, rete di sicurezza) sia direttamente
// dentro la transazione di pickColorPair — vedi lì per il perché.
function assignBotPairColors(state, pairIndex) {
  const d = state.draft;
  if (!d || !d.pairDraw || !d.pairChoice) return;
  const pair = d.pairDraw.pairs[pairIndex];
  if (!pair) return;
  if (pair.some((t) => d.colorPicks[t])) return; // già deciso
  const { pickIndex, pick } = d.pairChoice;
  const myPick = pairIndex === pickIndex ? pick : (pick === "RY" ? "GB" : "RY");
  const options = myPick === "RY" ? ["red", "yellow"] : ["green", "blue"];
  const color = options[Math.floor(Math.random() * 2)];
  const otherColor = options.find((c) => c !== color);
  d.colorPicks[pair[0]] = color;
  d.colorPicks[pair[1]] = otherColor;
}

async function botPickPairColors(pairIndex) {
  await updateState(myRoomId, (state) => {
    assignBotPairColors(state, pairIndex);
    maybeFinalizeDraft(state);
  });
}

function renderDraftScreen(state) {
  const d = state.draft;
  const joined = Object.keys(d.players).length;
  if (joined < 4 || !d.pairDraw) return renderDraftWaiting(state);
  if (!d.pairChoice) return renderPairDrawScreen(state);
  if (!d.colorPicks[myToken]) return renderSoloColorChoice(state);
  return renderDraftFinalizing(state);
}

function renderDraftWaiting(state) {
  const root = $("#app");
  root.innerHTML = "";
  const botTokens = state.draft.botTokens || {};
  const tokens = state.draft.order.filter((t) => state.draft.players[t]);
  const items = [];
  for (let i = 0; i < 4; i++) {
    const t = tokens[i];
    if (t) {
      const isBot = !!botTokens[t];
      items.push(
        el(
          "li",
          {},
          el("span", { class: "wdot" }),
          el(
            "span",
            { class: "wname" },
            (isBot ? "🤖 " : "") + state.draft.players[t] + (t === myToken ? " (tu)" : "")
          ),
          isBot
            ? el(
                "button",
                { class: "bot-btn bot-btn-remove", onclick: () => removeBotFromDraft(myRoomId, t) },
                "Rimuovi"
              )
            : ""
        )
      );
    } else {
      items.push(el("li", { class: "pending" }, el("span", { class: "wdot off" }), `in attesa del ${i + 1}° giocatore...`));
    }
  }
  const missingCount = 4 - tokens.length;
  root.appendChild(
    el(
      "div",
      { class: "lobby-card" },
      el("h1", {}, "Tock"),
      el("p", { class: "muted" }, `Stanza ${myRoomId} — in attesa dei giocatori (${tokens.length}/4).`),
      el("ul", { class: "waiting-list" }, items),
      missingCount > 0
        ? el(
            "div",
            { class: "bot-cell-assign" },
            el("div", { class: "bot-assign-label" }, "Manca qualcuno? Fallo giocare al computer:"),
            el(
              "div",
              { class: "bot-btn-row" },
              el("button", { class: "bot-btn", onclick: () => assignBotToDraft(myRoomId, "easy") }, "🤖 Aggiungi normale"),
              el("button", { class: "bot-btn", onclick: () => assignBotToDraft(myRoomId, "hard") }, "🤖 Aggiungi difficile")
            )
          )
        : "",
      el("p", { class: "muted" }, "Appena arrivano tutti e 4, parte da sola l'estrazione delle coppie.")
    )
  );
}

function renderPairDrawScreen(state) {
  const renderToken = ++draftPairRenderToken;
  const root = $("#app");
  root.innerHTML = "";
  const [pairA, pairB] = state.draft.pairDraw.pairs;
  const nameOf = (t) => state.draft.players[t] || "?";

  root.appendChild(
    el(
      "div",
      { class: "lobby-card" },
      el("h1", {}, "Tock"),
      el("p", { class: "muted" }, "Estrazione delle coppie..."),
      el(
        "div",
        { class: "teams-grid" },
        el(
          "div",
          { class: "team-group", id: "draft-team-a" },
          el("div", { class: "player-slot", id: "draft-slot-a1" }, el("span", {}, "")),
          el("div", { class: "player-slot", id: "draft-slot-a2" }, el("span", {}, ""))
        ),
        el(
          "div",
          { class: "team-group", id: "draft-team-b" },
          el("div", { class: "player-slot", id: "draft-slot-b1" }, el("span", {}, "")),
          el("div", { class: "player-slot", id: "draft-slot-b2" }, el("span", {}, ""))
        ),
        el("div", { class: "vs-badge" }, el("span", {}, "VS"))
      ),
      el("div", { id: "draft-pair-choice-wrap" })
    )
  );

  if (draftAnimShown.pairDraw) {
    showDraftSlotsInstant(pairA, pairB, nameOf);
    renderPairChoiceButtons(state);
  } else {
    draftAnimShown.pairDraw = true;
    animateDraftSlots(pairA, pairB, nameOf, renderToken).then(() => {
      // Nel frattempo potrebbe essere arrivato un altro aggiornamento e lo
      // schermo essere stato ridisegnato: in quel caso questa animazione è
      // superata, non tocchiamo più nulla (l'ha già fatto il render nuovo).
      if (renderToken !== draftPairRenderToken) return;
      renderPairChoiceButtons(state);
    });
  }
}

function showDraftSlotsInstant(pairA, pairB, nameOf) {
  const set = (id, text) => {
    const s = document.getElementById(id);
    if (s) s.querySelector("span").textContent = text;
  };
  set("draft-slot-a1", nameOf(pairA[0]));
  set("draft-slot-a2", nameOf(pairA[1]));
  set("draft-slot-b1", nameOf(pairB[0]));
  set("draft-slot-b2", nameOf(pairB[1]));
  const ta = document.getElementById("draft-team-a");
  const tb = document.getElementById("draft-team-b");
  if (ta) ta.classList.add("ready");
  if (tb) tb.classList.add("ready");
}

async function animateDraftSlots(pairA, pairB, nameOf, renderToken) {
  const pool = [nameOf(pairA[0]), nameOf(pairA[1]), nameOf(pairB[0]), nameOf(pairB[1])];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const stale = () => renderToken !== draftPairRenderToken;
  const spin = async (id, finalText, staggerMs) => {
    await sleep(staggerMs);
    if (stale()) return;
    const slotEl = document.getElementById(id);
    if (!slotEl) return;
    const span = slotEl.querySelector("span");
    slotEl.classList.add("spinning");
    const start = Date.now();
    while (Date.now() - start < 650) {
      if (stale()) return;
      span.textContent = pool[Math.floor(Math.random() * pool.length)];
      await sleep(55);
    }
    if (stale()) return;
    span.textContent = finalText;
    slotEl.classList.remove("spinning");
  };
  await Promise.all([
    spin("draft-slot-a1", nameOf(pairA[0]), 0),
    spin("draft-slot-a2", nameOf(pairA[1]), 200),
    spin("draft-slot-b1", nameOf(pairB[0]), 400),
    spin("draft-slot-b2", nameOf(pairB[1]), 600),
  ]);
  if (stale()) return;
  const ta = document.getElementById("draft-team-a");
  const tb = document.getElementById("draft-team-b");
  if (ta) ta.classList.add("ready");
  if (tb) tb.classList.add("ready");
  await sleep(150);
}

function renderPairChoiceButtons(state) {

  const partnerToken = (myPairIndex === 0 ? pairA : pairB).find((t) => t !== myToken);
  const partnerName = state.draft.players[partnerToken] || "il tuo compagno";
  wrap.appendChild(
    el(
      "div",

      el("p", { class: "muted" }, `La tua squadra: tu + ${partnerName}. Scegliete l'accoppiata di colori (chi clicca per primo se la aggiudica).`),
      el(
