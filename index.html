/* --- rilievo 3D: tasti avanti/indietro, pallini, carte --- */
html.fx3d .icon-btn-pair {
  box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 -2px 0 rgba(0,0,0,.06) inset, 0 3px 0 rgba(150,120,70,.55), 0 7px 10px -4px rgba(60,40,10,.4);
}
html.fx3d .icon-btn-half:active { background: rgba(120,90,40,.18); box-shadow: 0 2px 4px rgba(90,65,20,.35) inset; }
html.fx3d[data-theme="dark"] .icon-btn-pair { box-shadow: 0 1px 0 rgba(255,255,255,.1) inset, 0 3px 0 rgba(0,0,0,.55), 0 7px 10px -4px rgba(0,0,0,.6); }
/* barra in alto: con il tasto 3D in più le icone sono un filo più piccole per stare tutte in riga */
.top-actions-icons { gap: 3px; }
.top-actions-icons .icon-btn, .top-actions-icons .theme-toggle-btn { width: 29px; height: 29px; }
.top-actions-icons .icon-btn-pair { height: 29px; }
.top-actions-icons .icon-btn-half { width: 26px; }
/* pallini pedine accanto ai nomi: piccole sfere in rilievo */
html.fx3d .mini-pawns { filter: drop-shadow(0 2px 1.2px rgba(45,28,5,.55)); overflow: visible; }
/* carte in mano: cartoncino con bordo interno, spessore e lucido */
html.fx3d .card-btn {
  background: linear-gradient(165deg, #FFFFFF 0%, #FBF5E6 55%, #F0E5CB 100%);
  border-color: #B5A78C;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.9) inset,
    0 0 0 3px rgba(150,120,70,.10) inset,
    0 -2px 0 rgba(0,0,0,.05) inset,
    0 3px 0 #C9B992,
    0 4px 0 rgba(120,90,40,.35),
    0 10px 12px -3px rgba(50,32,8,.45);
}
html.fx3d .card-btn:disabled { box-shadow: 0 1px 0 #D8CBA9, 0 3px 5px -2px rgba(50,32,8,.25); }
html.fx3d .card-btn.selected { background: var(--gold-metallic); }
/* carta al centro: più grande, leggermente inclinata, con spessore */
html.fx3d .center-discard { filter: drop-shadow(0 8px 8px rgba(30,18,4,.5)); }
html.fx3d .center-discard .mini-card {
  width: 56px; height: 75px; border-radius: 9px;
  transform: none;
  background: linear-gradient(165deg, #FFFFFF 0%, #FBF5E6 55%, #F0E5CB 100%);
  border-color: #B5A78C;
  box-shadow: 0 0 0 1px rgba(255,255,255,.9) inset, 0 -2px 0 rgba(0,0,0,.05) inset, 0 3px 0 #C9B992, 0 4px 0 rgba(120,90,40,.35);
}
html.fx3d .center-discard .mini-card-rank { font-size: 1.15rem; top: 6px; left: 6px; }
html.fx3d .center-discard .mini-card svg { width: 26px; height: 26px; }
html.fx3d[data-theme="dark"] .card-btn { box-shadow: 0 0 0 1px rgba(255,255,255,.5) inset, 0 3px 0 #8B7B5A, 0 10px 12px -3px rgba(0,0,0,.7); }

/* --- effetto "premuto" per i tasti in rilievo --- */
html.fx3d .icon-btn, html.fx3d .theme-toggle-btn, html.fx3d .chat-fab, html.fx3d .reaction-btn, html.fx3d .card-btn, html.fx3d .icon-btn-pair {
  transition: transform .07s ease, box-shadow .07s ease;
}
html.fx3d .icon-btn:active, html.fx3d .theme-toggle-btn:active, html.fx3d .chat-fab:active, html.fx3d .reaction-btn:active,
html.fx3d .card-btn:not(:disabled):active, html.fx3d .icon-btn-pair:active {
  transform: translateY(3px);
  box-shadow: 0 3px 5px rgba(90,65,20,.4) inset, 0 0 0 rgba(0,0,0,0), 0 1px 0 rgba(255,255,255,.7);
  filter: brightness(.96);
}
html.fx3d[data-theme="dark"] .icon-btn:active, html.fx3d[data-theme="dark"] .theme-toggle-btn:active, html.fx3d[data-theme="dark"] .chat-fab:active,
html.fx3d[data-theme="dark"] .reaction-btn:active, html.fx3d[data-theme="dark"] .card-btn:not(:disabled):active, html.fx3d[data-theme="dark"] .icon-btn-pair:active {
  box-shadow: 0 3px 6px rgba(0,0,0,.6) inset, 0 1px 0 rgba(255,255,255,.08);
}



/* --- v5.32: Rilievo 3D più marcato (pedine, caselle, cornice) ---
   Una sola luce, in alto a sinistra. Arcade escluso: ha già il suo stile. */
.pawn-gloss-3d { display: none; }
html.fx3d[data-skin="arcade"] .board-cell { filter: url(#fx3d-sunk-arcade); }
html.fx3d:not([data-skin="arcade"]) .pawn-gloss-3d { display: inline; }
html.fx3d:not([data-skin="arcade"]) .pawn { filter: drop-shadow(2px 4px 1.5px rgba(40,24,4,.6)) drop-shadow(6px 12px 8px rgba(40,24,4,.32)); }
html.fx3d:not([data-skin="arcade"]) #board-wrap {
  position: relative;
  box-shadow: 0 10px 18px -6px rgba(70,45,10,.55) inset, 0 -2px 0 rgba(255,255,255,.55) inset,
              0 2px 0 rgba(255,255,255,.9), 0 14px 26px -12px rgba(60,38,8,.55);
}
html.fx3d:not([data-skin="arcade"]) #board-wrap::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 40%, rgba(40,24,4,0) 60%, rgba(40,24,4,.2) 100%);
}
html.fx3d[data-theme="dark"]:not([data-skin="arcade"]) #board-wrap {
  box-shadow: 0 10px 18px -6px rgba(0,0,0,.7) inset, 0 -1px 0 rgba(255,255,255,.12) inset, 0 1px 0 rgba(255,255,255,.08), 0 14px 26px -12px rgba(0,0,0,.7);
}
html.fx3d[data-theme="dark"]:not([data-skin="arcade"]) .pawn { filter: drop-shadow(2px 4px 1.5px rgba(0,0,0,.7)) drop-shadow(6px 12px 8px rgba(0,0,0,.4)); }

/* --- v5.34: righe con freccia nella cornice del tabellone (vedi drawDirectionArrows) --- */
.dir-arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 2; color: rgba(92,62,28,.6); }
.dir-arrows line, .dir-arrows path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
:root[data-theme="dark"] .dir-arrows, html[data-skin="wood"] .dir-arrows, html[data-skin="night"] .dir-arrows { color: #E2BF63; }
html[data-skin="arcade"] .dir-arrows { color: #22e4ff; }
/* --- v5.31: ritocchi grafici (nomi interi, offline, reazioni) --- */
/* Pallini delle pedine più piccoli nelle pillole: il posto va al nome,
   che prima veniva tagliato già a 6-7 lettere ("Giulia…"). */
.board-player .mini-pawns { width: 32px; height: 8px; min-width: 0; }
html[data-skin="arcade"] .board-player { gap: 6px; }
html[data-skin="arcade"] .board-player-name { font-size: .66rem; letter-spacing: .03em; }
/* Quando tocca a te nella barra c'è solo il nome: più grande. */
.turn-line.my-turn .turn-name { font-size: 1.2rem; }
/* Giocatore non connesso: pallino grigio al posto del ⚠️. */
.status-offline-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #9A948C; box-shadow: 0 0 0 2px var(--panel, #fff); }
html[data-skin="arcade"] .status-offline-dot { background: #6c6c80; box-shadow: none; border-radius: 0 !important; }
/* Pulsante delle reazioni accanto alla chat (stessi colori dei pulsanti
   reazione di ogni stile grafico, ma tondo come la chat). */
.chat-fab-row .reaction-btn.reaction-fab { flex: 0 0 auto; width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 1.35rem; display: flex; align-items: center; justify-content: center; }
.chat-fab-row .reaction-fab.open { font-size: 1rem; font-weight: 800; }
#chat-wrap .reaction-bar { margin-top: 0; animation: lmIn .15s ease-out; }
/* v5.55: schermata di gioco in stile Bento (solo stile Classico; carte e tabellone invariati) */
html:not([data-skin]) body:has(.game-shell) { background: var(--bx-bg); }
html:not([data-skin]) .game-shell .icon-btn, html:not([data-skin]) .game-shell .icon-btn-pair { background: var(--bx-card); border: none; border-radius: 12px; box-shadow: var(--bx-shadow); }
html:not([data-skin]) .game-shell .icon-btn-pair .icon-btn { box-shadow: none; }
html:not([data-skin]) .game-shell .room-team-row { border: none; border-radius: 22px; background: var(--bx-card); box-shadow: var(--bx-shadow); overflow: hidden; }
html:not([data-skin]) .game-shell .board-player { border: none; box-shadow: var(--bx-shadow); }
html:not([data-skin]) .game-shell #board-wrap { border-radius: 28px; box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 18px 34px -20px rgba(60,40,10,.55); }
html:not([data-skin]) .game-shell .turn-line.my-turn { background: var(--bx-btn-bg); border: none; border-radius: 22px; box-shadow: 0 12px 26px -14px rgba(168,125,34,.7); }
html:not([data-skin]) .game-shell .turn-line:not(.my-turn) { background: var(--bx-card); border: none; border-radius: 22px; box-shadow: var(--bx-shadow); }
html:not([data-skin]) .game-shell .chat-preview { background: var(--bx-card); border: none; border-radius: 18px; box-shadow: var(--bx-shadow); }
html:not([data-skin]) .game-shell .chat-fab { background: var(--bx-btn-bg); box-shadow: 0 10px 22px -12px rgba(168,125,34,.7); }
html:not([data-skin]) .game-shell .reaction-fab { background: var(--bx-card); border: none; box-shadow: var(--bx-shadow); }
html:not([data-skin]) .game-shell .nudge-btn { background: var(--bx-card); border: none; border-radius: 18px; box-shadow: var(--bx-shadow); }
/* v5.73: schermata di gioco come la home ("B · Tessere"). Dalla v5.74 anche in Legno, Notte e Luminoso
   (non in Arcade): la disposizione è uguale, i colori di tessere e riquadro sono quelli di ogni stile. */
.gx-tiles, .chat-k { display: none; }
.gx-card { display: contents; }
.gx-card > * { margin: 0 !important; }
html:not([data-skin="arcade"]) .game-shell .room-team-row { display: none; }
html:not([data-skin="arcade"]) .game-shell .gx-tiles { display: grid; grid-template-columns: 1fr 1.45fr; gap: 10px; }
html:not([data-skin="arcade"]) .game-shell .gx-tile { min-width: 0; box-sizing: border-box; background: var(--bx-card); border-radius: 22px; padding: 7px 14px 8px; box-shadow: var(--bx-shadow); }
html:not([data-skin="arcade"]) .game-shell .gx-big { display: flex; align-items: center; gap: 7px; margin-top: 1px; font-size: 1.08rem; font-weight: 800; letter-spacing: -.01em; color: var(--bx-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html:not([data-skin="arcade"]) .game-shell .gx-big svg { width: 18px; height: 18px; flex: none; }
html:not([data-skin="arcade"]) .game-shell .gx-big .identity-team { overflow: hidden; text-overflow: ellipsis; color: inherit; font: inherit; }
html:not([data-skin="arcade"]) .game-shell .gx-card { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px; background: var(--bx-card); border-radius: 28px; box-shadow: var(--bx-shadow); }
html:not([data-skin="arcade"]) .game-shell .chat-preview { flex-wrap: wrap; row-gap: 1px; padding-top: 6px; padding-bottom: 7px; }
html:not([data-skin="arcade"]) .game-shell .chat-k { display: block; flex-basis: 100%; font-style: normal; }
html:not([data-skin]) .game-shell .gx-card #board-wrap { box-shadow: none; }
html:not([data-skin]) .game-shell .gx-card .board-player { box-shadow: none; }
html:not([data-skin]) .game-shell .turn-line { border-radius: 24px; }
html:not([data-skin]) .game-shell .chat-preview { border-radius: 22px; }
html:not([data-skin]) .game-shell .nudge-btn { border-radius: 22px; }
/* Legno: come la vecchia fascia Stanza/Squadra (legno scuro, bordo oro) */
html[data-skin="wood"] .game-shell .gx-tile,
html[data-skin="wood"] .game-shell .gx-card { background: var(--wood-grain), linear-gradient(180deg,#3C2614,#28180C); background-size: 500px 500px, auto; border: 1px solid #B98F3E; box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), inset 0 0 0 4px rgba(214,175,92,.35), 0 10px 18px -8px rgba(0,0,0,.7); }
html[data-skin="wood"] .game-shell .gx-tile .bx-k, html[data-skin="wood"] .game-shell .gx-tile .bx-k *,
html[data-skin="wood"] .game-shell .chat-preview .chat-k, html[data-skin="wood"] .game-shell .chat-preview .chat-k * { color: #D9B661 !important; letter-spacing: .1em; }
html[data-skin="wood"] .game-shell .gx-big, html[data-skin="wood"] .game-shell .gx-big * { color: #F6E7C8; }
/* Notte: vetro scuro con bordo oro */
html[data-skin="night"] .game-shell .gx-tile,
html[data-skin="night"] .game-shell .gx-card { background: rgba(255,255,255,.07); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1.5px solid rgba(217,182,88,.55); box-shadow: 0 8px 16px -8px rgba(0,0,0,.7); }
html[data-skin="night"] .game-shell .gx-tile .bx-k, html[data-skin="night"] .game-shell .gx-tile .bx-k *,
html[data-skin="night"] .game-shell .chat-preview .chat-k, html[data-skin="night"] .game-shell .chat-preview .chat-k * { color: #E8D699 !important; }
html[data-skin="night"] .game-shell .gx-big, html[data-skin="night"] .game-shell .gx-big * { color: #F4EBD0; }
/* Luminoso (tema chiaro): bianco semitrasparente con ombra viola */
html[data-skin="bright"]:not([data-theme="dark"]) .game-shell .gx-tile,
html[data-skin="bright"]:not([data-theme="dark"]) .game-shell .gx-card { background: rgba(255,255,255,.75); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 10px 20px -10px rgba(70,60,120,.35); }
html[data-skin="bright"]:not([data-theme="dark"]) .game-shell .gx-big, html[data-skin="bright"]:not([data-theme="dark"]) .game-shell .gx-big * { color: #2B2440; }
/* v5.56: estrazione del mazziere in stile Bento (solo stile Classico): un riquadro per giocatore,
   carte lanciate dal mazzetto che restano a mucchietto, "👑 Mazziere" sul riquadro di chi vince. */
html:not([data-skin]) #picker-wrap:has(.dealer-draw-grid) { background: var(--bx-bg); }
html:not([data-skin]) .dealer-draw-grid { column-gap: 14px; row-gap: 14px; margin-top: 14px; }
html:not([data-skin]) .dealer-slot { background: var(--bx-card); border-radius: 22px; box-shadow: var(--bx-shadow); padding: 14px 8px 16px; transition: opacity .4s ease, box-shadow .3s ease; }
html:not([data-skin]) .dealer-slot-label, html:not([data-skin]) .dealer-slot-label * { color: var(--bx-ink); font-size: .86rem; font-weight: 800; }
html:not([data-skin]) .dealer-slot-label .swatch { width: 10px; height: 10px; }
html:not([data-skin]) .dealer-deck { z-index: 3; width: 40px; height: 56px; margin: -28px 0 0 -20px; opacity: .9; }
/* v5.81: mazzetto piccolo color crema con bordo oro (prima grande e rosso) */
html:not([data-skin]) .dealer-deck span { background: linear-gradient(135deg,#FBF4E4,#EAD9B4); border: 1.5px solid #D9A93E; border-radius: 6px; box-shadow: 0 2px 6px rgba(60,40,10,.15); }
html:not([data-skin]) .dealer-deck span:nth-child(1) { transform: translate(2px, 2px) rotate(3deg); }
html:not([data-skin]) .dealer-deck span:nth-child(2) { transform: translate(1px, 1px) rotate(-2deg); }
html:not([data-skin]) .dealer-slot .card-btn { z-index: 4; }
html:not([data-skin]) .dealer-slot.dealer-winner { animation: none; box-shadow: 0 0 0 2.5px #D9A93E, 0 14px 28px -14px rgba(168,125,34,.75); }
html:not([data-skin]) .dealer-slot.dealer-winner::before { content: "👑 Mazziere"; top: -12px; background: var(--bx-btn-bg); color: #241C15; font-size: .7rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 14px -8px rgba(168,125,34,.8); }
html:not([data-skin]) .dealer-draw-grid:has(.dealer-winner) .dealer-slot:not(.dealer-winner) { opacity: .5; }
html:not([data-skin]) .dealer-pile { position: relative; width: 64px; height: 90px; }
html:not([data-skin]) .dealer-pile .card-btn { position: absolute; left: 0; top: 0; }
html:not([data-skin]) .dealer-pile .card-btn.dealer-under { z-index: 3; filter: brightness(.97); }
/* v5.57: codice stanza "a caselle" in home + animazione dopo "Gioca"
   (caselle in cerchio che si fondono, cerchi verdi e ✓) e pulsanti "con
   esito" (rotellina → verde ✓ / rosso che trema), idea "Glassy OTP". */
.bx-play.cf { flex-direction: column; gap: 8px; padding: 8px; }
.cf-row { position: relative; height: 48px; display: flex; gap: 6px; justify-content: center; align-items: center; cursor: text; }
.cf-row.cf-long { gap: 4px; }
/* L'input vero è invisibile sopra le caselle (!important: batte gli stili per id dei campi). */
.cf-row > input { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; opacity: 0 !important; font-size: 16px !important; color: transparent !important; caret-color: transparent; border: none !important; background: transparent !important; box-shadow: none !important; z-index: 2; text-indent: -9999px; }
/* v5.73: su iPhone, scrivendo, compariva un riquadro grigio a sinistra (evidenziazione dei suggerimenti
   della tastiera sul testo dell'input invisibile): suggerimenti spenti (autocorrect) e testo spostato fuori. */
.cf-row > input::selection { background: transparent; }
.cf-card { background: var(--bx-card); border-radius: 18px; padding: 8px; box-shadow: 0 10px 24px -14px rgba(60,40,10,.45); margin-bottom: 12px; }
.cf-row.cf-stage { height: 0; overflow: visible; margin: 4px 0 8px; }
.cf-row.cf-run > input { pointer-events: none; }
.cf-box { position: relative; flex: 1 1 0; max-width: 40px; min-width: 0; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1.25rem; color: var(--bx-ink); background: var(--bx-bg); border: 1.5px solid var(--bx-line); transition: border-color .25s, box-shadow .25s, background .25s; }
.cf-long .cf-box { font-size: 1rem; border-radius: 10px; }
.cf-box.filled { border-color: #D9A93E; background: rgba(217,169,62,.08); }
.cf-box.active { border-color: #D9A93E; animation: cfBreathe 1.6s ease-in-out infinite; }
.cf-box.active::after { content: ""; width: 2px; height: 22px; border-radius: 2px; background: #C99A3A; animation: cfBlink 1s steps(1) infinite; }
.cf-box .ch { display: inline-block; animation: cfPop .32s cubic-bezier(.2,1.6,.4,1); }
.cf-hint { position: absolute; left: 12px; right: 12px; text-align: center; color: var(--bx-sub); font-weight: 600; font-size: .9rem; pointer-events: none; }
@keyframes cfBreathe { 0%,100% { box-shadow: 0 0 0 3px rgba(217,169,62,.14), 0 0 14px rgba(217,169,62,.25); } 50% { box-shadow: 0 0 0 5px rgba(217,169,62,.08), 0 0 22px rgba(217,169,62,.45); } }
@keyframes cfBlink { 50% { opacity: 0; } }
@keyframes cfPop { 0% { transform: scale(.3) translateY(6px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.bx-play.cf #continue-btn { display: block; text-align: center; padding: 14px 20px; }
.cf-spinwrap { position: absolute; inset: 0; pointer-events: none; }
.cf-box.cf-abs { position: absolute; left: 50%; top: 50%; width: 36px; max-width: none; height: 46px; margin: -23px 0 0 -18px; flex: none; }
.cf-box.cf-warn { border-color: #E8A24A; box-shadow: 0 0 16px rgba(232,162,74,.55); background: rgba(232,162,74,.08); animation: none; }
.cf-box.cf-okx { border-color: #4FB477; box-shadow: 0 0 20px rgba(79,180,119,.55); background: rgba(79,180,119,.1); animation: none; }
.cf-box.cf-bad { border-color: #D9534F; box-shadow: 0 0 18px rgba(217,83,79,.5); background: rgba(217,83,79,.1); animation: fbShake .45s; }
.cf-ring { position: absolute; left: 50%; top: 50%; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(79,180,119,.85); box-shadow: 0 0 22px rgba(79,180,119,.45), inset 0 0 16px rgba(79,180,119,.2); opacity: 0; pointer-events: none; }
.cf-orbit { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; opacity: 0; pointer-events: none; }
.cf-orbit i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #4FB477; box-shadow: 0 0 8px #6FD394; }
.cf-check { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; pointer-events: none; }
.cf-check path { stroke: #2F9E5F; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; }
:root[data-theme="dark"] .cf-check path { stroke: #8FE0A8; }
.bx-hero.cf-hero-ok { box-shadow: inset 0 0 0 2px rgba(79,180,119,.45); transition: box-shadow .6s; }
.bx-hero h1 .cf-g { background: linear-gradient(135deg, #5CC489, #2F9E5F); -webkit-background-clip: text; background-clip: text; color: transparent; }
/* Pulsanti "con esito" (fbBusy / fbOk / fbFail). */
.fb-spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: -2px; margin-right: 8px; opacity: .75; animation: fbSpin .7s linear infinite; }
.fb-busy { cursor: progress; }
.fb-busy, .fb-ok, .fb-fail { opacity: 1 !important; }
.room-chip.fb-busy, .room-chip.fb-fail { min-width: 64px; }
.fb-busy .fb-spin:last-child { margin-right: 0; }
/* Alcuni pulsanti colorano tutti i figli (es. ".room-chip-sit *"): la rotellina resta sempre visibile. */
.fb-spin { background: transparent !important; border-color: currentColor !important; border-right-color: transparent !important; }
@keyframes fbSpin { to { transform: rotate(360deg); } }
.fb-ok { background: linear-gradient(135deg, #9BE8B4, #4FB477) !important; border-color: transparent !important; box-shadow: 0 10px 22px -12px rgba(79,180,119,.8) !important; }
