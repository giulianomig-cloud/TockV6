// ---- Rivedi mosse precedenti ----------------------------------------------
// Cronologia SOLO locale (non scritta su Firebase, non fa parte dello stato
// di gioco): tiene traccia, lato client, delle mosse viste MENTRE questo
// client era connesso, così le due frecce in alto possono farne scorrere
// avanti/indietro più di una — non solo l'ultima. Stesso principio "solo
// eventi freschi" già usato da _pawnAnimState.primed (vedi renderPawns), per
// non riempirla con l'intera partita già in corso al primo collegamento/
// ricollegamento: la cronologia riparte vuota ogni volta che ti ricolleghi.
const MOVE_HISTORY_MAX = 20;
let moveReplayHistory = [];
let moveReplayIndex = -1; // -1 = nessuna mossa selezionata (vista "live")
const _historyTrack = { ids: { seven: 0, move: 0, capture: 0, swap: 0, homeEntry: 0 }, primed: false };
// Replay vero: ogni mossa ricordata porta con sé la posizione delle pedine
// DOPO di essa (e prima), così le frecce riportano davvero il tabellone
// com'era. replayViewPawns != null = tabellone in modalità replay.
let replayViewPawns = null;
let replayViewCard = null;
let replayNoteText = "";
let replayNoteTimer = null;
let _prevPawnsSnapshot = null;
function clonePawnsSnapshot(p) { return JSON.parse(JSON.stringify(p)); }

// Richiamata da buildBoardSVG (quindi a ogni renderGameShell, cioè a ogni
// ingresso/ricollegamento in una stanza) — stesso momento in cui si azzera
// _pawnAnimState, per lo stesso motivo: gli id salvati in _historyTrack
// riguardano un tabellone che non esiste più, e ripartire da una
// cronologia vuota evita sia falsi "eventi freschi" sia mosse cliccabili
// che punterebbero a pedine ormai in un'altra configurazione.
function resetMoveReplayHistory() {
  moveReplayHistory = [];
  moveReplayIndex = -1;
  replayViewPawns = null;
  replayViewCard = null;
  replayNoteText = "";
  _prevPawnsSnapshot = null;
  _historyTrack.ids = { seven: 0, move: 0, capture: 0, swap: 0, homeEntry: 0 };
  _historyTrack.primed = false;
}

// Stessa precedenza già usata qui: se più eventi scattano nello stesso giro
// (es. un 7 che include anche una mangiata), se ne sceglie uno solo a
// rappresentare l'intera giocata — seven > move > capture > swap >
// homeEntry a parità di istante (sort stabile).
function recordMoveHistoryIfFresh(state) {
  const t = _historyTrack;
  const events = [
    { key: "seven", data: state.lastSeven },
    { key: "move", data: state.lastMove },
    { key: "capture", data: state.lastCapture },
    { key: "swap", data: state.lastSwap },
    { key: "homeEntry", data: state.lastHomeEntry },
  ];
  const fresh = [];
  events.forEach(({ key, data }) => {
    if (data && data.id && data.id !== t.ids[key]) {
      t.ids[key] = data.id;
      if (t.primed) fresh.push({ key, data });
    }
  });
  t.primed = true;
  const beforeSnap = _prevPawnsSnapshot;
  _prevPawnsSnapshot = state.pawns ? clonePawnsSnapshot(state.pawns) : null;
  if (fresh.length === 0) return;
  fresh.sort((a, b) => (b.data.ts || 0) - (a.data.ts || 0));
  const entry = buildHistoryEntry(fresh[0].key, fresh[0].data);
  if (!entry) return;
  entry.before = beforeSnap;
  entry.after = _prevPawnsSnapshot;
  const lcp = state.lastCardPlayed;
  if (lcp && lcp.card && !lcp.burned) {
    entry.card = lcp.card;
    entry.cardColor = lcp.color;
    entry.label = `${entry.label} · ${cardLabel(lcp.card)}`;
  }
  moveReplayHistory.push(entry);
  if (moveReplayHistory.length > MOVE_HISTORY_MAX) moveReplayHistory.shift();
  // Una mossa vera e propria appena arrivata "chiude" una revisione in
  // corso: si torna alla vista live, altrimenti l'indice selezionato
  // resterebbe puntato a una mossa vecchia mentre la partita va avanti.
  moveReplayIndex = -1;
  replayViewPawns = null;
  replayViewCard = null;
}

function buildHistoryEntry(key, data) {
  if (key === "seven") {
    return { label: `${cn(data.color)} gioca il 7`, run: () => flashSevenReplay(boardSvg, BOARD, data.color, data.portions) };
  }
  if (key === "swap") {
    return { label: `${cn(data.a.color)} e ${cn(data.b.color)} si scambiano (Jack)`, run: () => flashJackSwapReplay(boardSvg, BOARD, data) };
  }
  if (key === "capture") {
    const label = data.by ? `${cn(data.by)} mangia ${cn(data.color)}` : `${cn(data.color)} viene mangiato`;
    return { label, run: () => flashCapture(boardSvg, BOARD, data.color, data.atPos) };
  }
  if (key === "homeEntry") {
    return { label: `${cn(data.color)} entra in casa`, run: () => flashHomeEntry(boardSvg, BOARD, data.color, data.pos - 1000) };
  }
  return { label: `${cn(data.color)} muove`, run: () => flashMoveReplay(boardSvg, BOARD, data.color, data.from, data.pos) };
}

// Chiamata dalle due frecce in alto: dir -1 = mossa precedente (più
// indietro nel tempo), dir +1 = mossa successiva (più recente). Al primo
// tocco (nessuna mossa ancora selezionata) qualunque freccia parte dalla
// più recente — stesso comportamento di prima del singolo "rivedi ultima
// mossa".
function stepReplay(dir) {
  if (!currentState || !boardSvg) return;
  const n = moveReplayHistory.length;
  if (n === 0) {
    showReplayNote("Nessuna mossa da rivedere ancora");
    return;
  }
  let k;
  if (moveReplayIndex === -1) {
    // Dalla vista live: ◀ parte dall'ultima mossa; ▶ non ha nulla più avanti.
    if (dir > 0) {
      showReplayNote("Sei già alla mossa più recente");
      return;
    }
    k = n - 1;
  } else {
    k = moveReplayIndex + dir;
    if (k < 0) {
      showReplayNote("Non ci sono altre mosse più indietro");
      return;
    }
    if (k > n - 1) {
      exitReplay(); // ▶ oltre l'ultima mossa = torna alla partita reale
      return;
    }
  }
  enterReplayAt(k);
}

// Riporta il tabellone alla posizione DOPO la mossa k della cronologia e ne
// ripropone l'animazione (partenza → arrivo). Locale: non tocca lo stato di
// gioco né Firebase.
function enterReplayAt(k) {
  const entry = moveReplayHistory[k];
  if (!entry) return;
  moveReplayIndex = k;
  replayNoteText = "";
  replayViewPawns = entry.after || null;
  replayViewCard = entry.card ? { color: entry.cardColor, card: entry.card } : null;
  renderPawns(boardSvg, BOARD, currentState.pawns, null, null, null);
  renderCenterDiscard(currentState);
  renderTurnIndicator(currentState);
  setTimeout(() => {
    if (moveReplayIndex === k && replayViewPawns === (entry.after || null)) entry.run();
  }, 450);
}

function exitReplay() {
  moveReplayIndex = -1;
  replayViewPawns = null;
  replayViewCard = null;
  replayNoteText = "";
  if (!currentState || !boardSvg) return;
  renderPawns(boardSvg, BOARD, currentState.pawns, currentState.lastSwap, currentState.lastCapture, currentState.lastHomeEntry, currentState.lastSeven);
  renderCenterDiscard(currentState);
  renderTurnIndicator(currentState);
}

// Avviso leggero nella barra del turno (nessun OK da chiudere): sparisce da solo.
function showReplayNote(text) {
  replayNoteText = text;
  if (currentState) renderTurnIndicator(currentState);
  clearTimeout(replayNoteTimer);
  replayNoteTimer = setTimeout(() => {
    replayNoteText = "";
    if (currentState) renderTurnIndicator(currentState);
  }, 1800);
}

function renderReplayBar(wrap) {
  const n = moveReplayHistory.length;
  const k = moveReplayIndex;
  let text;
  if (replayNoteText) text = "ℹ️ " + replayNoteText;
  else text = `⏪ ${k + 1}/${n} · ${moveReplayHistory[k] ? moveReplayHistory[k].label : ""}`;
  wrap.appendChild(
    el(
      "div",
      { class: "turn-line replay-line" },
      el("span", { class: "replay-txt" }, text),
      replayViewPawns ? el("button", { class: "replay-live-btn", onclick: exitReplay }, "Torna al live") : ""
    )
  );
}

const TUT_KEY = "tock-tut-done";
function tutDone() { try { return JSON.parse(localStorage.getItem(TUT_KEY) || "[]"); } catch (e) { return []; } }
function tutMarkDone(id) { try { const d = tutDone(); if (d.indexOf(id) < 0) { d.push(id); localStorage.setItem(TUT_KEY, JSON.stringify(d)); } } catch (e) {} }

function tutMakeState(pawns, hand, lapped) {
  const names = { red: "Tu", green: "Verde", yellow: "Il tuo compagno", blue: "Blu" };
  const players = {};
  COLORS.forEach((c) => { players[c] = { name: names[c], token: "tut-" + c, playerId: "tut-" + c }; });
  const st = newGameState(players, "manual");
  st.phase = "playing"; st.turnColor = "red"; st.dealerColor = "blue";
  COLORS.forEach((c) => { st.pawns[c] = [-1, -1, -1, -1]; st.hands[c] = []; });
  Object.keys(pawns || {}).forEach((c) => { st.pawns[c] = pawns[c].slice(); });
  st.hands.red = hand.slice();
  (lapped || []).forEach((l) => setLapped(st, l[0], l[1], true));
  st.playedThisCycle = [];
  return st;
}

let _tut = null;
function tutEnsureRoot() {
  let root = document.getElementById("tut-overlay");
  if (!root) { root = el("div", { id: "tut-overlay", class: "tut-overlay" }); document.body.appendChild(root); }
  return root;
}
function openTutorial() { showTutorialList(); }
function closeTutorial() {
  const root = document.getElementById("tut-overlay");
  if (root) root.remove();
  _tut = null;
  // Se c'è una partita sotto, ridisegna il suo tabellone.
  try { if (document.querySelector("#board-wrap #board-svg") && typeof rebuildBoardForTheme === "function") { resetPawnAnimState(); rebuildBoardForTheme(); } } catch (e) {}
}
// v5.50: barra dei progressi, lezioni numerate in un unico riquadro a righe,
// ✓ sulle fatte e "Inizia ›" sulla prima ancora da fare.
function showTutorialList() {
  const root = tutEnsureRoot(); _tut = null;
  const done = tutDone(); root.innerHTML = "";
  const n = TUT_LESSONS.length, k = TUT_LESSONS.filter((l) => done.indexOf(l.id) >= 0).length;
  const nextIdx = TUT_LESSONS.findIndex((l) => done.indexOf(l.id) < 0);
  root.appendChild(el("div", { class: "tut-wrap" },
    el("div", { class: "tut-head" }, el("h2", {}, "🎓 Impara a giocare"), el("button", { class: "tut-x", onclick: () => vtGo(document.querySelector(".tl-prog"), ".bx-imp", closeTutorial), "aria-label": "Chiudi" }, "✕")),
    el("p", { class: "tut-sub" }, "Lezioni brevi sul vero tabellone, nell'ordine che preferisci."),
    el("div", { class: "tl-prog" }, el("div", { class: "tl-prog-top" }, k === n ? "Hai completato tutto! 🎉" : "Il tuo percorso", el("span", {}, `${k} di ${n} lezioni`)), el("div", { class: "tl-bar" }, el("i", { style: `width:${Math.round((k / n) * 100)}%` }))),
    el("div", { class: "tl-list" }, TUT_LESSONS.map((l, i) => {
      const isDone = done.indexOf(l.id) >= 0, isNext = i === nextIdx;
      return el("button", { class: "tl-row" + (isDone ? " tl-is-done" : "") + (isNext ? " tl-is-next" : ""), onclick: () => openTutorialLesson(i) },
        el("span", { class: "tl-num" }, String(i + 1)), el("span", { class: "tl-ico" }, l.icon),
        el("span", { class: "tl-txt" }, el("b", {}, l.title), el("small", {}, l.desc)),
        isDone ? el("span", { class: "tl-done" }, "✓") : isNext ? el("span", { class: "tl-next" }, "Inizia ›") : "");
    }))));
  root.scrollTop = 0;
}

function openTutorialLesson(idx) {
  const lesson = TUT_LESSONS[idx];
  const root = tutEnsureRoot();
  const T = {
    idx, lesson, s: lesson.make(), busy: false, finished: false,
    anim: { positions: {}, els: {}, lastSwapId: null, lastCaptureId: null, lastHomeEntryId: null, lastSevenId: null, primed: false },
  };
  _tut = T;
  const holder = el("div", { class: "tut-board" });
  T.bubble = el("div", { class: "tut-bubble" }, lesson.text);
  T.handEl = el("div", { class: "tut-hand" });
  T.chipsEl = el("div", { class: "tut-chips" });
  T.footEl = el("div", { class: "tut-foot" });
  root.innerHTML = "";
  root.appendChild(el("div", { class: "tut-wrap" },
    el("div", { class: "tut-head" },
      el("button", { class: "tut-x", onclick: showTutorialList, "aria-label": "Elenco lezioni" }, "‹"),
      el("h2", {}, lesson.icon + " " + lesson.title),
      el("button", { class: "tut-x", onclick: () => vtGo(document.querySelector(".tl-prog"), ".bx-imp", closeTutorial), "aria-label": "Chiudi" }, "✕")),
    holder, T.bubble, T.handEl, T.chipsEl, T.footEl));
  root.scrollTop = 0;
  T.svg = buildBoardSVG(holder, BOARD);
  T.svg.setAttribute("id", "tut-board-svg");
  tutRenderPawns(T);
  tutRenderHand(T);
  tutRenderFoot(T);
  if (lesson.info) { T.finished = true; tutMarkDone(lesson.id); tutRenderFoot(T); }
}

// renderPawns usa lo stato di animazione globale della partita: lo si
// scambia con quello del tutorial solo per la durata della chiamata, così
// una partita eventualmente aperta sotto non viene toccata.
function tutRenderPawns(T) {
  const game = Object.assign({}, _pawnAnimState);
  Object.assign(_pawnAnimState, T.anim);
  let ms = 0;
  try { ms = renderPawns(T.svg, BOARD, T.s.pawns, T.s.lastSwap, T.s.lastCapture, T.s.lastHomeEntry, T.s.lastSeven); } finally {
    Object.assign(T.anim, _pawnAnimState);
    Object.assign(_pawnAnimState, game);
  }
  return ms;
}
function tutSay(T, text, kind) { T.bubble.textContent = text; T.bubble.className = "tut-bubble" + (kind ? " " + kind : ""); }
function tutRenderHand(T) {
  T.handEl.innerHTML = "";
  if (T.lesson.info) return;
  T.s.hands.red.forEach((card) => {
    const b = buildCardButton(card, true, () => tutOnCard(T, card, b), false);
    if (card === T.lesson.card || T.lesson.anyCard) b.classList.add("tut-target");
    T.handEl.appendChild(b);
  });
}
function tutRenderFoot(T) {
  T.footEl.innerHTML = "";
  if (!T.lesson.info) T.footEl.appendChild(el("button", { onclick: () => openTutorialLesson(T.idx) }, "↺ Ricomincia"));
  if (T.finished) {
    const last = T.idx >= TUT_LESSONS.length - 1;
    T.footEl.appendChild(el("button", { class: "primary", onclick: () => (last ? showTutorialList() : openTutorialLesson(T.idx + 1)) }, last ? "Fine ✓" : "Prossima ›"));
  }
  if (T.lesson.info && !T.finished) T.footEl.appendChild(el("button", { class: "primary", onclick: () => { T.finished = true; tutRenderFoot(T); } }, "Avanti"));
}
function tutFinish(T, text) {
  T.finished = true; T.busy = false;
  tutMarkDone(T.lesson.id);
  tutSay(T, text || T.lesson.done, "ok");
  tutRenderFoot(T);
}
function tutOnCard(T, card, btn) {
  if (T.busy || T.finished) return;
  const L = T.lesson;
  try { playSound("cardFlick"); } catch (e) {}
  if (L.anyCard) { T.handEl.querySelectorAll(".card-btn").forEach((b) => b.classList.remove("tut-target")); return tutFinish(T); }
  if (card !== L.card) { tutSay(T, (L.wrong && L.wrong[card]) || "Per questa lezione usa la carta evidenziata.", "no"); return; }
  const ch = L.choices(T.s);
  T.chipsEl.innerHTML = "";
  if (ch.length === 1) return tutApply(T, card, btn, ch[0]);
  tutSay(T, "Scegli come giocarla:");
  ch.forEach((c) => {
    T.chipsEl.appendChild(el("button", { class: "tut-chip", onclick: () => tutPick(T, card, btn, c) }, c.label, el("small", {}, c.sub || "")));
  });
}
function tutPick(T, card, btn, c) {
  if (T.busy || T.finished) return;
  if (!c.ok) { tutSay(T, c.hint || "Prova un'altra scelta.", "no"); return; }
  T.chipsEl.innerHTML = "";
  tutApply(T, card, btn, c);
}
function tutApply(T, card, btn, c) {
  T.busy = true;
  T.chipsEl.innerHTML = "";
  if (c.burn) {
    if (btn) btn.classList.add("card-burning");
    try { playSound("burn"); } catch (e) {}
    burnOneCard(T.s, "red", card);
    setTimeout(() => { tutRenderHand(T); tutFinish(T, c.done); }, 700);
    return;
  }
  applyMove(T.s, "red", card, c.move);
  tutRenderHand(T);
  const ms = tutRenderPawns(T);
  setTimeout(() => tutFinish(T, c.done), Math.min(2800, (ms || 0) + 350));
}

function setPawnCandidates(active, options) {

function optionTitle(opt) {
  return `Pedina #${opt.pawnIndex + 1}`;
}
function optionSubtitle(opt) {
  if (opt.type === "enter") return "entra in gioco";
  if (opt.type === "move") {
    const dest = opt.path[opt.path.length - 1];
    return dest >= 1000 ? "entra in casa" : "continua il giro";
  }
  return "muovi";
}

async function playMove(active, card, move) {
  if (moveInFlight) {
    showToast("Aspetta, la mossa precedente è ancora in salvataggio...");
    return;
  }
  if (isSelfCapture(currentState, active, move)) {
    if (!confirm("Questa mossa mangia una tua pedina. Confermi?")) return;
  }
  setMoveInFlight(true);
  try {
    await runUpdate((state) => {
      applyMove(state, active, card, move);
      if (state.phase !== "finished") advanceTurn(state);
    });
  } catch (e) {
    // runUpdate ha già mostrato un toast con un messaggio comprensibile
    // (vedi sotto) — qui si limita a evitare una unhandledrejection, non
    // ne mostra un secondo (prima capitava: due toast identici in coda
    // uno via l'altro per lo stesso identico errore).
    console.error(e);
  } finally {
    setMoveInFlight(false);
  }
}

function isSelfCapture(state, color, move) {
  if (move.type === "move") {
    const dest = move.path[move.path.length - 1];
    if (dest >= 1000) return false;
    const occ = occupantAt(state, dest);
    return !!occ && occ.color === color && occ.pawnIndex !== move.pawnIndex;
  }
  if (move.type === "enter") {
    const occ = occupantAt(state, BOARD.baseIndex[color]);
    return !!occ && occ.color === color;
  }
  return false;
}

async function runUpdate(mutatorFn) {
  try {
    await updateState(myRoomId, mutatorFn);
  } catch (e) {
    showToast("Non sono riuscito a salvare la mossa: " + describeError(e));
    console.error(e);
    throw e; // il chiamante può comunque reagire (es. annullare un'animazione già avviata)
  }
}

async function toggleJackPick(active, card, target) {
  keepAudioAlive();
  const already = jackPicked.findIndex((p) => p.color === target.color && p.pawnIndex === target.pawnIndex);
  if (already !== -1) jackPicked.splice(already, 1);
  else if (jackPicked.length < 2) jackPicked.push(target);

  if (jackPicked.length === 2) {
    const [a, b] = jackPicked;
    closePicker();
    jackPicked = [];
    await playMove(active, card, { type: "jack", a, b });
    return;
  }
  renderJackPicker(active, card);
}

// ---------------- Seven splitter ----------------

// pos >= 1000 è la codifica interna delle 4 caselle del percorso-casa
// (1000 + indice 0..3, vedi il commento sulla forma dello stato più sopra).
// Per le pedine sul giro principale il numero di casella (0..63) è un
// dettaglio interno che al giocatore non dice niente (richiesto di
// toglierlo) — l'icona a pallini davanti alla riga identifica già di
// quale pedina si tratta, quindi basta "in gioco".
function sevenRowLabel(p, val) {
  const pos = p.pos;
  if (pos === -1) return "Base → entra in gioco";
  if (pos >= 1000) return `In casa (${pos - 1000 + 1}ª casella) → prosegue`;
  // In gioco sul giro principale: se ci sono già passi assegnati, verifica
  // se QUESTA allocazione la fa entrare in casa (non solo "prosegue" sul
  // giro) — altrimenti l'etichetta resta generica finché non si assegna
  // almeno un passo (segnalato: "non scrive entra in casa ma solo passa").
  if (val > 0) {
    const path = sevenSinglePawnPath(currentState, p.color, pos, val, true, hasLapped(currentState, p.color, p.pawnIndex));
    if (path && path[path.length - 1] >= 1000) return "In gioco → entra in casa";
  }
  return "In gioco → prosegue";
}

// sevenAllocation è tenuta come mappa piatta "colore:pawnIndex" -> passi,
// così una riga della propria squadra e una del compagno con lo stesso
// pawnIndex (0..3) non si confondono mai (i colori dei due possibili
// bersagli sono sempre diversi tra loro).
function sevenAllocKey(color, pawnIndex) {
  return color + ":" + pawnIndex;
}

// Chiavi (colore:pawnIndex) delle righe attualmente disegnate nel foglio
// del 7 — usata da renderSevenSplitter per capire se può limitarsi ad
// aggiornare i numeri (vedi patchSevenSplitterNumbers) invece di
// ricostruire tutto il foglio da capo a ogni tocco di -/+. Azzerata
// quando il foglio si apre da zero o si chiude.
let _sevenRowKeys = null;

function openSevenSplitter(active, card) {
  // Non proporre pedine già in gioco che in realtà non potrebbero ricevere
  // nemmeno un passo in NESSUNA distribuzione valida (bloccate da una
  // pedina protetta davanti, o a fine percorso-casa) — altrimenti lo
  // splitter mostra righe che sembrano un'opzione ma non lo sono mai. Se
  // però questo 7 può mandare tutte le proprie pedine a casa a metà
  // giocata e proseguire sul compagno, mostra comunque tutte le proprie
  // pedine in gioco: la combinazione esatta la verifica comunque il tasto
  // "Conferma" (vedi confirmSeven).
  // v5.66: anche nel caso "passi avanzati al compagno" solo le pedine che
  // possono davvero muovere (sevenMovableOwnPawns).
  const ownPawns = sevenMovableOwnPawns(currentState, active).map((i) => ({ pawnIndex: i, pos: currentState.pawns[active][i], color: active }));
  sevenAllocation = {};
  ownPawns.forEach((p) => (sevenAllocation[sevenAllocKey(p.color, p.pawnIndex)] = 0));
  _sevenRowKeys = null; // forza una costruzione completa del foglio, è la prima apertura
  renderSevenSplitter(active, card, ownPawns);
}

function renderSevenSplitter(active, card, ownPawns) {
  const partner = PARTNER_OF[active];

  // Quanti passi sono già assegnati alle proprie pedine in questo momento?
  const ownDist = ownPawns
    .map((p) => ({ pawnIndex: p.pawnIndex, steps: sevenAllocation[sevenAllocKey(active, p.pawnIndex)] || 0 }))
    .filter((d) => d.steps > 0);
  const ownTotal = ownDist.reduce((s, d) => s + d.steps, 0);

  // Se l'allocazione attuale sulle proprie pedine le manda TUTTE a casa, i
  // passi rimasti del 7 possono proseguire sulle pedine del compagno (vedi
  // sevenValidateDistribution) — a quel punto si aprono anche le sue righe.
  let partnerPawns = [];
  if (ownTotal > 0 && ownTotal < 7) {
    const ownResult = sevenValidateOwnPortions(currentState, active, ownDist);
    if (ownResult && ownResult.allHome) {
      // Esclude anche una pedina del compagno già arrivata nell'ULTIMA
      // casella di casa (non c'è una 5ª casella dopo, pathForward
      // restituisce sempre null): senza questo filtro compariva comunque
      // come riga selezionabile nel foglio, pur non potendo mai ricevere
      // davvero un passo — confuso ("perché mi dice di muoverla se è già
      // in casa?", segnalato). Le pedine nelle altre 3 caselle di casa
      // restano proponibili: possono ancora avanzare (vedi "casa#2 →
      // casa#4" nel registro mosse).
      // v5.66: più in generale, solo le pedine del compagno che possono
      // ricevere almeno uno dei passi avanzati (sevenMovablePartnerPawns).
      partnerPawns = sevenMovablePartnerPawns(currentState, active, ownResult.pawns, 7 - ownTotal)
        .map((i) => ({ pawnIndex: i, pos: ownResult.pawns[partner][i], color: partner }));
    }
  }
  // Ripulisce eventuali passi lasciati sul compagno da un'allocazione
  // precedente che ora non lo rende più raggiungibile (l'utente ha tolto
  // passi alle proprie pedine).
  for (const key of Object.keys(sevenAllocation)) {
    if (key.startsWith(partner + ":") && !partnerPawns.some((p) => sevenAllocKey(p.color, p.pawnIndex) === key)) {
      delete sevenAllocation[key];
    }
  }
  partnerPawns.forEach((p) => {
    const key = sevenAllocKey(p.color, p.pawnIndex);
    if (!(key in sevenAllocation)) sevenAllocation[key] = 0;
  });

  const total = Object.values(sevenAllocation).reduce((a, b) => a + b, 0);
  const remaining = 7 - total;
  const allRows = ownPawns.concat(partnerPawns);
  const newKeys = new Set(allRows.map((p) => sevenAllocKey(p.color, p.pawnIndex)));

  // Se l'insieme di righe mostrate non è cambiato da prima (stesse pedine,
  // solo i numeri sono da aggiornare) e il foglio è ancora davvero quello
  // del 7, AGGIORNA SOLO I NUMERI invece di ricostruire tutto il foglio da
  // capo con openPicker(). Prima ogni singolo tocco di -/+ rifaceva
  // l'intero DOM del foglio (bottoni compresi): un tocco rapido successivo,
  // se il dito era già appoggiato su un bottone appena sostituito da un
  // bottone nuovo, a volte non veniva registrato — segnalato come "a volte
  // il tocco non registra". Ricostruire da capo resta necessario solo
  // quando le righe del compagno compaiono/spariscono (cambia la struttura
  // del foglio), non per un semplice +1/-1.
  if (_sevenRowKeys && setsEqual(_sevenRowKeys, newKeys) && document.getElementById("seven-remaining")) {
    patchSevenSplitterNumbers(total, remaining, newKeys);
    return;
  }
  _sevenRowKeys = newKeys;

  const row = (p) => {
    const key = sevenAllocKey(p.color, p.pawnIndex);
    const val = sevenAllocation[key] || 0;
    return el(
      "div",
      { class: "seven-row" + (val > 0 ? " has-steps" : ""), id: "seven-row-" + key },
      pipIcon(p.color, p.pawnIndex, 34),
      el("div", { class: "seven-row-text", id: "seven-row-text-" + key }, sevenRowLabel(p, val)),
      el("button", { class: "seven-step-btn", id: "seven-minus-" + key, disabled: val <= 0, "aria-label": "Un passo in meno", onclick: () => adjustSeven(active, card, ownPawns, p.color, p.pawnIndex, -1) }, "−"),
      el("span", { class: "seven-val", id: "seven-val-" + key }, String(val)),
      el("button", { class: "seven-step-btn", id: "seven-plus-" + key, disabled: remaining <= 0, "aria-label": "Un passo in più", onclick: () => adjustSeven(active, card, ownPawns, p.color, p.pawnIndex, 1) }, "+")
    );
  };

  openPicker(
    el(
      "div",
      { class: "choice-box" },
      el(
        "div",
        { style: "display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;" },
        el("div", { style: "font-weight:800;font-size:1.05rem;" }, "Distribuisci il 7"),
        el("div", { id: "seven-remaining", class: "muted", style: "font-size:0.78rem;font-weight:700;" }, `Restano ${remaining}`)
      ),
      el(
        "div",
        { id: "seven-pips", class: "seven-pips" },
        Array.from({ length: 7 }, (_, i) => el("span", { class: "seven-pip" + (i < total ? " filled" : "") }))
      ),
      ownPawns.map(row),
      partnerPawns.length > 0
        ? el(
            "div",
            { class: "muted", style: "font-size:0.78rem;font-weight:700;margin:8px 0 2px;" },
            `Le tue pedine sono tutte in casa: continua con quelle di ${cn(partner)}`
          )
        : null,
      partnerPawns.map(row),
      el(
        "button",
        {
          id: "seven-confirm-btn",
          class: "primary",
          style: "margin-bottom:10px;",
          disabled: remaining !== 0,
          onclick: () => confirmSeven(active, card),
        },
        remaining === 0 ? "Conferma" : `Conferma (mancano ${remaining} passi)`
      ),
      el(
        "button",
        { class: "text-link-btn", style: "display:flex;width:100%;justify-content:center;", onclick: () => { sevenAllocation = null; _sevenRowKeys = null; closePicker(); } },
        "Annulla"
      )
    )
  );
}

function setsEqual(a, b) {
  if (a.size !== b.size) return false;
  for (const x of a) if (!b.has(x)) return false;
  return true;
}

// Aggiorna solo i numeri del foglio del 7 già aperto (pallini, "Restano
// N", il valore e l'evidenziazione di ogni riga, il bottone Conferma) —
// senza toccare il DOM dei bottoni -/+ stessi, così un tocco rapido
// successivo non rischia più di cadere su un bottone appena sostituito.
function patchSevenSplitterNumbers(total, remaining, keys) {
  const remainingEl = document.getElementById("seven-remaining");
  if (remainingEl) remainingEl.textContent = `Restano ${remaining}`;
  const pipsWrap = document.getElementById("seven-pips");
  if (pipsWrap) {
    Array.from(pipsWrap.children).forEach((pip, i) => pip.classList.toggle("filled", i < total));
  }
  keys.forEach((key) => {
    const val = sevenAllocation[key] || 0;
    const valEl = document.getElementById("seven-val-" + key);
    if (valEl) valEl.textContent = String(val);
    // v5.39: "−" spento a zero, "+" spento quando i 7 passi sono già tutti
    // assegnati — prima restavano uguali e il tocco sembrava non funzionare.
    const minusEl = document.getElementById("seven-minus-" + key);
    if (minusEl) minusEl.disabled = val <= 0;
    const plusEl = document.getElementById("seven-plus-" + key);
    if (plusEl) plusEl.disabled = remaining <= 0;
    const rowEl = document.getElementById("seven-row-" + key);
    if (rowEl) rowEl.classList.toggle("has-steps", val > 0);
    const sep = key.indexOf(":");
    const color = key.slice(0, sep);
    const pawnIndex = parseInt(key.slice(sep + 1), 10);
    const textEl = document.getElementById("seven-row-text-" + key);
    if (textEl) textEl.textContent = sevenRowLabel({ color, pawnIndex, pos: currentState.pawns[color][pawnIndex] }, val);
  });
  const confirmBtn = document.getElementById("seven-confirm-btn");
  if (confirmBtn) {
    confirmBtn.disabled = remaining !== 0;
    confirmBtn.textContent = remaining === 0 ? "Conferma" : `Conferma (mancano ${remaining} passi)`;
  }
}

function adjustSeven(active, card, ownPawns, targetColor, pawnIndex, delta) {
  const total = Object.values(sevenAllocation).reduce((a, b) => a + b, 0);
  const key = sevenAllocKey(targetColor, pawnIndex);
  const next = (sevenAllocation[key] || 0) + delta;
  if (next < 0) return;
  if (delta > 0 && total >= 7) return;
  sevenAllocation[key] = next;
  renderSevenSplitter(active, card, ownPawns);
}

// v5.30: col 7 si possono mangiare anche le proprie pedine (vedi
// sevenCheckPath) — stessa conferma di isSelfCapture per le altre carte.
// Ripercorre le porzioni nell'ordine in cui verranno giocate, perché una
// pedina mossa da una porzione precedente non è più dov'era all'inizio.
function sevenSelfCapture(state, valid) {
  const scratch = clonePawns(state.pawns);
  for (let i = 0; i < valid.order.length; i++) {
    const { color, pawnIndex } = valid.order[i];
    for (const cell of valid.paths[i]) {
      if (cell >= 1000) continue;
      const idx = scratch[color].indexOf(cell);
      if (idx !== -1 && idx !== pawnIndex) return true;
    }
    landSevenPortion(scratch, color, pawnIndex, valid.paths[i]);
  }
  return false;
}

async function confirmSeven(active, card) {
  keepAudioAlive();
  const partner = PARTNER_OF[active];
  const distribution = Object.entries(sevenAllocation)
    .map(([key, steps]) => {
      const sep = key.indexOf(":");
      const color = key.slice(0, sep);
      const pawnIndex = parseInt(key.slice(sep + 1), 10);
      return { pawnIndex, steps, forPartner: color === partner };
    })
    .filter((d) => d.steps > 0);
  const valid = sevenValidateDistribution(currentState, active, distribution);
  if (!valid) {
    showToast("Questa distribuzione non è valida (percorso bloccato o casella-casa occupata). Prova un'altra combinazione.");
    return;
  }
  if (sevenSelfCapture(currentState, valid) && !confirm("Questo 7 mangia una tua pedina. Confermi?")) return;
  closePicker();
  sevenAllocation = null;
  await playMove(active, card, { type: "seven", distribution });
}

// ---------------- Chat ----------------

// La chat non è più una riga da aprire in linea nella pagina (segnalato:
// "è un po' sotto e non è visibile a colpo d'occhio") — ora è un bottone
// rotondo sempre a portata subito sotto i campi delle pedine (vedi il
// commento su #chat-wrap in renderGameShell), che apre la chat vera e
// propria nello stesso foglio a comparsa (openPicker) già usato per Jack/7/
// regole/estrazione mazziere — coerente col resto dell'app.
let chatPickerOpen = false;
let chatSeenCount = 0; // messaggi già visti (badge = solo quelli arrivati dopo)
let _chatFabRenderKey = null; // evita di ridisegnare il bottone ad ogni giro se non serve
let reactionsOpen = false; // riga delle reazioni aperta dal pulsante 😀 (v5.31)

function renderChat(state) {
  const messages = state.chat || [];
  if (chatPickerOpen) {
    // Il foglio è già aperto: aggiorna la lista messaggi al volo (non un
    // openPicker da capo, che perderebbe lo scroll e ripartirebbe con
    // l'animazione d'entrata) — e considera tutto già "visto".
    updateChatPickerMessages(messages);
    chatSeenCount = messages.length;
  }
  renderChatFab(messages);
}

// L'anteprima mostra l'ULTIMO messaggio così com'è (senza tagliarlo a
// mano): il testo lungo si ferma da solo con l'ellissi CSS
// (.chat-preview-text), e un tocco apre lo stesso foglio di sempre dove si
// legge per intero — "visibile e ingrandibile se richiesto" (chiesto).
function renderChatFab(messages) {
  showReactionsFrom(currentState);
  const wrap = $("#chat-wrap");
  if (!wrap) return; // schermata di gioco non presente (es. timer/ritardo dopo essere usciti dal tavolo)
  const unread = chatPickerOpen ? 0 : Math.max(0, messages.length - chatSeenCount);
  const key = messages.length + ":" + chatPickerOpen + ":" + reactionsOpen;
  if (_chatFabRenderKey === key) return;
  _chatFabRenderKey = key;
  wrap.innerHTML = "";
  const last = messages[messages.length - 1];
  const preview = last
    ? el(
        "div",
        { class: "chat-preview", onclick: (ev) => openPickerFrom(ev.currentTarget, openChatPicker), title: "Apri la chat" },
        el("span", { class: "chat-k bx-k" }, "💬 Chat"),
        el(
          "span",
          { class: "chat-avatar chat-avatar-" + last.color },
          (playerName(currentState, last.color) || "?").trim().charAt(0).toUpperCase()
        ),
        el(
          "span",
          { class: "chat-preview-text" },
          el("strong", {}, (last.color === myColor ? "Tu" : playerName(currentState, last.color)) + ": "),
          last.text
        )
      )
    : el(
        "div",
        { class: "chat-preview chat-preview-empty", onclick: (ev) => openPickerFrom(ev.currentTarget, openChatPicker), title: "Apri la chat" },
        el("span", { class: "chat-k bx-k" }, "💬 Chat"),
        "Nessun messaggio ancora — tocca per scrivere"
      );
  wrap.appendChild(
    el(
      "div",
      { class: "chat-fab-row" },
      preview,
      el(
        "button",
        { class: "chat-fab", "aria-label": "Apri la chat", onclick: (ev) => openPickerFrom(ev.currentTarget, openChatPicker) },
        chatBubbleIconSvg(),
        unread > 0 ? el("span", { class: "chat-fab-badge" }, unread > 99 ? "99+" : String(unread)) : ""
      ),
      // v5.31: le reazioni non occupano più una riga fissa sotto le carte:
      // si aprono da questo pulsante e si richiudono dopo averne mandata una.
      el(
        "button",
        {
          class: "reaction-btn reaction-fab" + (reactionsOpen ? " open" : ""),
          "aria-label": reactionsOpen ? "Chiudi le reazioni" : "Reazioni",
          "aria-expanded": reactionsOpen ? "true" : "false",
          onclick: () => { reactionsOpen = !reactionsOpen; _chatFabRenderKey = null; renderChatFab(currentState.chat || []); },
        },
        reactionsOpen ? "✕" : "😀"
      )
    )
  );
  if (reactionsOpen) {
    wrap.appendChild(
      el(
        "div",
        { class: "reaction-bar" },
        REACTIONS.map((r) => el("button", {
          class: "reaction-btn",
          "aria-label": "Reazione " + r,
          onclick: () => { reactionsOpen = false; _chatFabRenderKey = null; renderChatFab(currentState.chat || []); sendReaction(r); },
        }, r))
      )
    );
  }
  wrap.appendChild(
    el(
      "div",
      { class: "nudge-row" },
      el("button", { class: "nudge-btn" + (Date.now() < _nudgeOkUntil ? " fb-ok" : ""), title: "Sveglia chi deve giocare", onclick: (ev) => sendNudge(ev.currentTarget) }, ...(Date.now() < _nudgeOkUntil ? ["✓ Sveglia inviata"] : ["👋", el("span", { class: "nudge-label" }, " Sveglia chi deve giocare")]))
    )
  );
}

// Reazioni rapide: sono normali messaggi di chat che contengono UNA sola
// emoji (nessun campo nuovo nello stato -> nessun rischio con le regole
// Firebase). Chi le riceve vede l'emoji "volare" sullo schermo.
// v6.11: tolto 🖕 (offensivo, non adatto agli store né agli sconosciuti di "Gioca subito"): al suo posto 🎉.
const REACTIONS = ["😂", "😱", "👏", "🎉", "🙏", "🔥"];
const reactionTracker = { roomId: null, lastId: null };
const NUDGE_TEXT = "👋 Sveglia, tocca a te!";
let lastNudgeAt = 0;

// "Sveglia": chi aspetta dà un colpetto a chi deve giocare. È un messaggio di
// chat speciale (nessun campo nuovo nello stato): chi è di turno lo riceve
// con vibrazione, suono e avviso; gli altri vedono solo il 👋 volare.
// Chiamata vocale di gruppo su Jitsi Meet (gratis, senza account): la stanza
// prende il nome dal codice della partita, quindi tutti quelli nella stessa
// partita entrano nella stessa chiamata. Si apre in una scheda a parte.
function openCallRoom() {
  const name = "Tock-" + String(myRoomId || "").replace(/[^A-Za-z0-9-]/g, "");
  const url = "https://meet.jit.si/" + name + "#config.startWithVideoMuted=true&config.prejoinPageEnabled=false";
  showToast("📞 Apro la chiamata: tutti nella tua partita entrano nella stessa stanza");
  window.open(url, "_blank", "noopener");
}

// v5.65: "Sveglia" con esito sul pulsante (rotellina → verde "✓ Sveglia inviata").
// _nudgeOkUntil tiene il verde anche se la chat ridisegna il pulsante.
let _nudgeOkUntil = 0;
async function sendNudge(btn) {
  keepAudioAlive();
  const st = currentState;
  if (!st) return;
  const t = st.turnColor;
  if (!t || st.winnerTeam) return showToast("Ora non c'è nessuno da svegliare.");
  if (t === myColor) return showToast("Tocca a te! 😄");
  if (st.players && st.players[t] && st.players[t].isBot) return showToast("Gioca il computer, è già veloce.");
  if (Date.now() - lastNudgeAt < 30000) return showToast("Hai appena svegliato: aspetta un po'.");
  lastNudgeAt = Date.now();
  fbBusy(btn, "Invio…");
  try {
    await updateState(myRoomId, (state) => {
      postChatMessage(state, myColor, NUDGE_TEXT);
    });
    _nudgeOkUntil = Date.now() + 2200;
    const live = document.querySelector(".nudge-btn");
    fbOk(live || btn, "Sveglia inviata a " + playerName(st, t));
    setTimeout(() => { _nudgeOkUntil = 0; _chatFabRenderKey = null; if (currentState) renderChatFab(currentState.chat || []); }, 2300);
  } catch (e) {
    console.error(e);
    fbFail(btn, "Riprova");
  }
}

async function sendReaction(emoji) {
  keepAudioAlive();
  try {
    await updateState(myRoomId, (state) => {
      postChatMessage(state, myColor, emoji);
    });
  } catch (e) {
    console.error(e);
  }
}

function showReactionsFrom(state) {
  const msgs = state.chat || [];
  const lastId = msgs.length ? msgs[msgs.length - 1].id || 0 : 0;
  if (reactionTracker.roomId !== myRoomId || reactionTracker.lastId === null) {
    reactionTracker.roomId = myRoomId;
    reactionTracker.lastId = lastId; // primo giro: niente animazioni per i vecchi messaggi
    return;
  }
  const fresh = msgs.filter((m) => (m.id || 0) > reactionTracker.lastId && (REACTIONS.includes(m.text) || m.text === NUDGE_TEXT));
  reactionTracker.lastId = lastId;
  fresh.slice(-3).forEach((m, i) => {
    if (m.text === NUDGE_TEXT && !state.winnerTeam) shakeTurnBanner();
    if (m.text === NUDGE_TEXT && m.color !== myColor && state.turnColor === myColor && !state.winnerTeam) {
      vibrate([200, 100, 200]);
      showToast("👋 " + playerName(state, m.color) + " ti sveglia: tocca a te!");
    }
    setTimeout(() => {
      const who = m.color === myColor ? "Tu" : playerName(state, m.color);
      const node = el(
        "div",
        { class: "reaction-float", style: `left:${20 + Math.random() * 60}%;` },
        el("div", { class: "reaction-emoji" }, m.text === NUDGE_TEXT ? "👋" : m.text),
        el("div", { class: "reaction-who reaction-who-" + m.color }, who)
      );
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 2300);
      if (m.text !== NUDGE_TEXT) reactionBurst(m.text, node);
    }, i * 250);
  });
}

// v5.60: "come i cuori nelle dirette" — insieme all'emoji grande ne salgono
// altre più piccole che ondeggiano a destra e sinistra e svaniscono.
function reactionBurst(emoji, from) {
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !document.body.animate) return;
  const left = from && from.style.left ? from.style.left : "50%";
  for (let k = 0; k < 7; k++) {
    const mini = el("div", { class: "reaction-mini", style: `left:${left}` }, emoji);
    document.body.appendChild(mini);
    const rise = 220 + Math.random() * 120, sway = 14 + Math.random() * 16, dir = Math.random() < 0.5 ? -1 : 1;
    const dx = (Math.random() - 0.5) * 50, size = 0.55 + Math.random() * 0.45;
    const a = mini.animate(
      [
        { transform: `translate(${dx}px, 0) scale(${size * 0.4})`, opacity: 0 },
        { transform: `translate(${dx + dir * sway}px, -${rise * 0.25}px) scale(${size})`, opacity: 1, offset: 0.2 },
        { transform: `translate(${dx - dir * sway}px, -${rise * 0.55}px) scale(${size})`, opacity: 0.9, offset: 0.55 },
        { transform: `translate(${dx + dir * sway * 0.6}px, -${rise}px) scale(${size * 0.85})`, opacity: 0 },
      ],
      { duration: 1700 + Math.random() * 700, delay: 120 + k * 110, easing: "ease-out", fill: "both" }
    );
    a.finished.then(() => mini.remove(), () => mini.remove());
  }
}

function chatBubbleIconSvg() {
  return svgIcon(19, 19, "0 0 24 24", "#FFFFFF", 2.1, [
    ["path", { d: "M21 11.5a8.38 8.38 0 0 1-4.8 7.6 8.5 8.5 0 0 1-9.4-1.2L3 19l1.1-3.8A8.38 8.38 0 0 1 3 11.5a8.5 8.5 0 0 1 8.5-8.5h.5a8.48 8.48 0 0 1 8 8v.5z" }],
  ]);
}

function openChatPicker() {
  if (!currentState) return;
  chatPickerOpen = true;
  const messages = currentState.chat || [];
  chatSeenCount = messages.length;
  _chatFabRenderKey = null; // forza il ridisegno del badge (torna a 0) alla prossima renderChat

  const list = el("div", { id: "chat-messages", class: "chat-messages" });
  messages.forEach((m) => list.appendChild(chatLine(m)));

  const input = el("input", { id: "chat-input", placeholder: "Scrivi un messaggio..." });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendChat();
  });

  openPicker(
    el(
      "div",
      { class: "choice-box" },
      el("p", { style: "font-weight:800;font-size:1.05rem;margin:0 0 10px;" }, "💬 Chat di stanza"),
      list,
      // v6: con gli sconosciuti di "Gioca subito" solo frasi pronte (niente
      // testo libero: è la condizione degli store per le chat fra estranei).
      isMatchRoom(myRoomId)
        ? el("div", { class: "chat-quick" }, QUICK_CHAT_PHRASES.map((t) => el("button", { class: "chat-quick-btn", onclick: (ev) => sendQuickChat(t, ev.currentTarget) }, t)))
        : el(
        "div",
        { class: "chat-input-row" },
        input,
        el(
          "button",
          { class: "chat-send-btn", "aria-label": "Invia", onclick: sendChat },

// ---------------- Log / win ----------------

// Icona per tipo di evento, ma colore SEMPRE di chi ha compiuto l'azione
// (byActorColor) — non più un colore fisso per tipo come nella prima
// versione (mangiata=rossa, 7=oro, arrivo in casa=verde fissi): su
// richiesta, il pallino deve riconoscere subito CHI ha giocato guardando
// solo il registro, qualunque sia il tipo di mossa. Le righe "normali"
// (mazzo distribuito, carta bruciata, mossa semplice...) restano un
// pallino pieno del colore di chi ha agito, senza icona (fallbackColor).
const LOG_EVENT_TYPES = [
  { test: (l) => l.includes("mangia"), byActorColor: true, sw: 3, shapes: [["path", { d: "M6 6l12 12M18 6L6 18" }]] },
  { test: (l) => l.includes("gioca il 7") || l.includes("parte del 7"), byActorColor: true, sw: 3, shapes: [["path", { d: "M8 3L4 7l4 4M16 3l4 4-4 4M4 7h16" }]] },
  { test: (l) => l.includes("Jack"), byActorColor: true, sw: 2.6, shapes: [["path", { d: "M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" }]] },
  { test: (l) => l.includes("casa#"), byActorColor: true, sw: 2.6, shapes: [["path", { d: "M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.9-6.1-3.5-6.1 3.5 1.4-6.9-5.1-4.7 6.9-.8z" }]] },
];
// Trova il numero della PEDINA SPECIFICA (1-4) menzionata subito dopo il
// nome del colore nella riga — cerca "#N" a ridosso del nome (con o senza
// spazio: "Rosso #2" nelle mosse normali, "Rosso#2" nello scambio Jack),
// non un "#N" qualunque nella frase (es. "casa#1", che è un'etichetta di
// posizione, non una pedina). Ritorna l'indice 0-based per PIP_LAYOUTS/
// pipIcon, o null se la riga non nomina una pedina precisa di quel colore
// (es. una mangiata generica, che non indica mai il numero) — in quel
// caso il chiamante ricade sul pallino/icona per tipo di evento di prima.
// Nome del colore nella lingua in cui si MOSTRA il registro (vedi trLog).
function logColorName(c) {
  return LANG === "en" ? IT_COLOR_EN[colorLabel(c)] : colorLabel(c);
}
function actorPawnNumberInLine(line, color) {
  if (!color) return null;
  const label = logColorName(color);
  const idx = line.indexOf(label);
  if (idx === -1) return null;
  const after = line.slice(idx + label.length, idx + label.length + 6);
  const m = after.match(/^\s*#(\d)\b/);
  if (!m) return null;
  const n = parseInt(m[1], 10);
  if (n < 1 || n > 4) return null;
  return n - 1;
}
function logEventBadge(line, fallbackColor, itLine) {
  // Priorità alla PEDINA vera e propria: stesso disegno (cerchio colorato
  // + pallini a dado) già usato nei picker Jack/7 per riconoscere le 4
  // pedine di un colore a colpo d'occhio — così nel registro si vede
  // subito ESATTAMENTE quale pedina si è mossa, non solo di che colore.
  const pawnIdx = actorPawnNumberInLine(line, fallbackColor);
  if (pawnIdx !== null) {
    const wrap = el("span", { class: "log-dot log-dot-pawn" });
    wrap.appendChild(pipIcon(fallbackColor, pawnIdx, 21));
    return wrap;
  }
  const type = LOG_EVENT_TYPES.find((t) => t.test(itLine || line));
  if (!type) return el("span", { class: "log-dot", style: `background:${fallbackColor ? `var(--${fallbackColor})` : "#C7BCA4"};` });
  const bg = type.byActorColor ? (fallbackColor ? `var(--${fallbackColor})` : "#3E8FCB") : type.bg;
  return el("span", { class: "log-dot", style: `background:${bg};` }, svgIcon(11, 11, "0 0 24 24", "#FFFFFF", type.sw, type.shapes));
}
const LOG_COLORS = ["red", "green", "yellow", "blue"];

// Piccola pedina inline (stesso disegno pallino+dadini di pipIcon, usato
// anche nel badge a sinistra) da mettere DENTRO il testo al posto del
// crudo "#N" — chiesto: "il 7 per esempio non è comprensibile, al posto
// del numero mettere il simbolo della pedina corretta". Un "#3" da solo
// non dice nulla; il disegno della pedina (già usato nei picker Jack/7)
// invece è lo stesso linguaggio visivo con cui il giocatore la riconosce
// sul tabellone.
function pawnInlineIcon(color, pawnIndex) {
  const wrap = el("span", { class: "log-pawn-inline" });
  wrap.appendChild(pipIcon(color, pawnIndex, 16));
  return wrap;
}

// Spezza il testo sui nomi-colore (grassetto, scuro) e sui riferimenti a
// una pedina specifica ("#N", non "casaN" — vedi il lookbehind) sostituiti
// con l'iconcina della pedina vera e propria, invece di lasciare "#N" nudo
// nel testo. Il colore della pedina è quello dell'ultimo nome-colore
// incontrato leggendo da sinistra (di norma il soggetto della frase), non
// necessariamente ripetuto ogni volta — come nella riga del 7, dove dopo
// "Rosso gioca il 7" seguono "#1", "#3", "#2" senza ripetere "Rosso" per
// ognuno: sono comunque le SUE pedine.
function richLogText(line, actorColor) {
  const names = LOG_COLORS.map(logColorName);
  const re = new RegExp(`\\b(${names.join("|")})\\b|(?<!casa|home)#(\\d)\\b`, "g");
  const parts = [];
  let last = 0, m;
  let activeColor = actorColor || null;
  while ((m = re.exec(line))) {
    if (m.index > last) parts.push(line.slice(last, m.index));
    if (m[1]) {
      activeColor = LOG_COLORS.find((c) => logColorName(c) === m[1]) || activeColor;
      parts.push(el("b", {}, m[1]));
    } else {
      const n = parseInt(m[2], 10);
      if (activeColor && n >= 1 && n <= 4) {
        parts.push(pawnInlineIcon(activeColor, n - 1));
      } else {
        parts.push(m[0]);
      }
    }
    last = m.index + m[0].length;
  }
  if (last < line.length) parts.push(line.slice(last));
  return parts;
}
function detectLogColor(line) {
  // pick whichever color name appears EARLIEST in the sentence — that's
  // always the subject/actor of the log line — not just the first color
  // checked in a fixed order (which broke lines like "Blu mangia Rosso").
  let bestColor = null;
  let bestIndex = Infinity;
  for (const c of LOG_COLORS) {
    const idx = line.indexOf(logColorName(c));
    if (idx !== -1 && idx < bestIndex) {
      bestIndex = idx;
      bestColor = c;
    }
  }
  return bestColor;
}

const OLD_SUIT_SYMBOL = { hearts: "♥", diamonds: "♦", clubs: "♣", spades: "♠" };

// Old log lines (written before this update) still use the raw English
// color keys and card codes verbatim, since a log entry is stored exactly
// as it happened and never gets rewritten later. This translates them for
// DISPLAY only, on the fly, so a game that started before this change
// still reads consistently in Italian.
// Every name a color has ever been shown under, oldest first — so old log
// lines (saved under an earlier name) still get translated and color-coded
// correctly after a rename, not just brand-new lines.
const LEGACY_COLOR_NAMES = {
  red: ["red", "Rosso"],
  green: ["green", "Verde"],
  yellow: ["yellow", "Giallo", "Ambra", "Ocra"],
  blue: ["blue", "Blu"],
};

function displayLogLine(line) {
  let out = line;
  for (const key of COLORS) {
    const current = colorLabel(key);
    for (const old of LEGACY_COLOR_NAMES[key]) {
      if (old === current) continue;
      out = out.replace(new RegExp(`\\b${old}\\b`, "g"), current);
    }
  }
  out = out.replace(/\b([2-9]|10|[AKQJ])-(hearts|diamonds|clubs|spades)\b/g, (m, rank, suit) => rank + OLD_SUIT_SYMBOL[suit]);
  return out;
}

// Pannello "debug" con le mani di tutti e 4 i colori in tempo reale (bot

try { handsDebugVisible = localStorage.getItem("tock-hands-debug") === "1"; } catch (e) {}

// Exports the full move log PLUS the current board state (positions,
// hands, whose turn) as a plain-text file — everything needed to
// reconstruct and check a reported bug, without screenshots.
function downloadDebugDump(state) {
  const lines = [];
  lines.push(`Tock — registro completo (${new Date().toLocaleString("it-IT")})`);
  lines.push(`Stanza: ${myRoomId}`);
  lines.push("");
  lines.push("=== STATO ATTUALE ===");
  lines.push(`Fase: ${state.phase}`);
  lines.push(`Turno: ${state.turnColor ? colorLabel(state.turnColor) : "-"}`);
  for (const c of COLORS) {
    const name = playerName(state, c);
    lines.push(`${colorLabel(c)} (${name}): pedine=${JSON.stringify(state.pawns[c])} mano=${JSON.stringify(state.hands[c])}`);
  }
  const xd = state.exchangeDebug || {};
  if (Object.keys(xd).length) {
    lines.push("");
    lines.push("=== ULTIMO SCAMBIO (mano di partenza, carta data, pedine) ===");
    for (const c of COLORS) {
      if (xd[c]) lines.push(`${colorLabel(c)}: mano=${JSON.stringify(xd[c].mano)} ha dato=${xd[c].data} pedine=${JSON.stringify(xd[c].pedine)}`);
    }
  }
  lines.push("");
  lines.push("=== REGISTRO MOSSE (in ordine) ===");
  (state.log || []).forEach((line, i) => lines.push(`${i + 1}. ${trLog(displayLogLine(line))}`));

  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `tock-registro-${myRoomId}-${Date.now()}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function toggleLog() {
  logExpanded = !logExpanded;
  const btn = document.getElementById("log-toggle-btn");
  if (btn) btn.textContent = logExpanded ? "Mostra solo recenti" : "Mostra tutto";
  const list = document.getElementById("log-list");
  if (list && currentState) fillLogList(list, currentState);
}

// Premi "divertenti" di fine partita, calcolati dai contatori in state.stats
// (mangiate fatte/subite e scambi Jack per colore). Mostra solo i premi con
// almeno 1 evento; se la partita è stata pacifica lo dice.
function buildAwards(state) {
  const st = state.stats || {};
  const top = (kind) => {
    let best = null;
    for (const c of COLORS) {
      const n = (st[kind] && st[kind][c]) || 0;
      if (n > 0 && (!best || n > best.n)) best = { c, n };
    }
    return best;
  };
  const rows = [];
  const a = top("capt");
  const b = top("lost");
  const j = top("swaps");
  if (a) rows.push(["🦈", "Squalo", playerName(state, a.c), a.n === 1 ? "1 pedina mangiata" : a.n + " pedine mangiate"]);
  if (b) rows.push(["🎯", "Vittima della serata", playerName(state, b.c), b.n === 1 ? "mangiata 1 volta" : "mangiata " + b.n + " volte"]);
  if (j) rows.push(["🃏", "Re dei Jack", playerName(state, j.c), j.n === 1 ? "1 scambio" : j.n + " scambi"]);
  if (!rows.length) rows.push(["🕊️", "Partita pacifica", "", "nessuna pedina mangiata"]);
  return el(
    "div",
    { class: "win-awards" },
    rows.map((r) =>
      el(
        "div",
        { class: "win-award" },
        el("span", { class: "win-award-ico" }, r[0]),
        el("span", { class: "win-award-txt" }, el("strong", {}, r[1]), r[2] ? " · " + r[2] : "", el("em", {}, " — " + r[3]))
      )
    )
  );
}

function launchConfetti(winnerColors) {
  const hexOf = isArcade() ? ARCADE_NEON : { red: "#D9636B", green: "#3FA77E", yellow: "#E3AC33", blue: "#3E8FCB" };
  const colors = winnerColors.map((c) => hexOf[c]).concat(isArcade() ? ["#ff2bd6", "#00f0ff"] : ["#C99A3A", "#ffffff"]);
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  document.body.appendChild(layer);

  const pieceCount = 90;
  for (let i = 0; i < pieceCount; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const left = Math.random() * 100;
    const delay = Math.random() * 0.6;
    const duration = 2.4 + Math.random() * 1.6;
    const size = 6 + Math.random() * 7;
    const rotStart = Math.random() * 360;
    const drift = (Math.random() - 0.5) * 140;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const round = Math.random() < 0.5;
    piece.style.left = left + "vw";
    piece.style.width = size + "px";
    piece.style.height = (round ? size : size * 1.5) + "px";
    piece.style.background = color;
    piece.style.borderRadius = round ? "50%" : "2px";
    piece.style.animationDelay = delay + "s";
    piece.style.animationDuration = duration + "s";
    piece.style.setProperty("--drift", drift + "px");
    piece.style.setProperty("--rot0", rotStart + "deg");
    layer.appendChild(piece);
  }
  // Carte da gioco che cadono.
  const suits = [["♥", "red"], ["♦", "red"], ["♠", "black"], ["♣", "black"]];
  for (let i = 0; i < 18; i++) {
    const [g, k] = suits[i % 4];
    const c = document.createElement("div");
    c.className = "confetti-card " + k;
    c.textContent = g;
    c.style.left = (4 + Math.random() * 92) + "vw";
    c.style.animationDelay = (0.3 + Math.random() * 1.6) + "s";
    c.style.animationDuration = (3.4 + Math.random() * 1.8) + "s";
    c.style.setProperty("--drift", ((Math.random() - 0.5) * 120) + "px");
    c.style.setProperty("--rot0", (Math.random() * 60 - 30) + "deg");
    layer.appendChild(c);
  }
  // Due "cannoni" di coriandoli dagli angoli in basso.
  for (let i = 0; i < 44; i++) {
    const p = document.createElement("div");
    p.className = "confetti-piece burst";
    const fromLeft = i % 2 === 0;
    const size = 6 + Math.random() * 6;
    p.style.left = fromLeft ? "2vw" : "auto";
    p.style.right = fromLeft ? "auto" : "2vw";
    p.style.width = size + "px";
    p.style.height = size * 1.4 + "px";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.borderRadius = Math.random() < 0.5 ? "50%" : "2px";
    p.style.animationDelay = (Math.random() * 0.35) + "s";
    p.style.animationDuration = (2.2 + Math.random() * 1.2) + "s";
    const dir = fromLeft ? 1 : -1;
    p.style.setProperty("--bx", (dir * (30 + Math.random() * 150)) + "px");
    p.style.setProperty("--rot0", (Math.random() * 360) + "deg");
    layer.appendChild(p);
  }
  setTimeout(() => layer.remove(), 7000);
}

function shakeTurnBanner() {
  const t = document.querySelector(".turn-line");
  if (!t) return;
  t.classList.remove("shake");
  void t.offsetWidth;
  t.classList.add("shake");
  setTimeout(() => t.classList.remove("shake"), 1000);
}

// ---------------- boot ----------------

window.addEventListener("DOMContentLoaded", () => {
  installDebugPanel();
  // Il data-theme può già essere "dark" (impostato dallo script inline in
  // <head> prima ancora di questo boot) — qui si aggiornano solo i meta
  // tag (color-scheme/theme-color) di conseguenza, senza toccare
  // l'attributo già corretto. Il pulsante vero e proprio lo disegna ogni
  // schermata (vedi themeToggleButton), non serve installarlo qui.
  applyTheme(currentTheme);
  initFirebase();
  renderLobby();
  applyInviteLinkIfPresent();
});

// Se si arriva da un link di invito (?room=CODICE, vedi buildInviteLink),
// precompila il codice stanza e prosegue da solo, come se la persona lo
// avesse scritto ed avesse premuto "Continua". Pulisce poi l'URL (senza
// ricaricare) così un refresh successivo non ripete l'auto-ingresso.
function applyInviteLinkIfPresent() {
  let params;
  try {
    params = new URLSearchParams(location.search);
  } catch (e) {
    return;
  }
  // Scorciatoia dell'icona (manifest.json, "Gioca subito"): parte la ricerca.
  if (params.get("gioca")) {
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    startMatchmaking();
    return;
  }
  const roomId = (params.get("room") || "").trim().toUpperCase();
  if (!roomId) return;
  const input = document.getElementById("room-input");
  if (input) { input.value = roomId; codeBoxesDraw(input.parentNode); }
  try {
    history.replaceState(null, "", location.pathname);
  } catch (e) {
    // non fondamentale: se fallisce l'URL resta con ?room=..., pazienza
  }
  continueFromRoomCode();
}

function installDebugPanel() {
  const panel = document.createElement("div");
  panel.id = "debug-panel";
  // top parte SOTTO la fascia protetta da .status-bar-shield (stessa altezza
  // di riserva, notch/status-bar + 18px), non da 0: a differenza di
  // .conn-lost (un banner "in flusso" che lo scudo copre da dietro), questo
  // pannello ha z-index 9999 — più alto dello scudo (600) — quindi se
  // partiva da top:0 il suo sfondo rosso finiva proprio nella fascia sotto
  // la notch, sfocato dalla traslucenza della status bar iOS ("un alone
  // rosso in cima", segnalato) anche senza un vero errore visibile, perché
  // il testo restava comunque nascosto sotto la notch stessa.
  panel.style.cssText =
    "position:fixed;top:calc(env(safe-area-inset-top, 0px) + 18px);left:0;right:0;z-index:9999;background:#c0392b;color:#fff;" +
    "font-size:12px;padding:6px 10px;display:none;max-height:40vh;overflow-y:auto;white-space:pre-wrap;";
  document.body.appendChild(panel);
  function showError(msg) {
    panel.style.background = "#c0392b";
    panel.style.display = "block";
    panel.textContent = "ERRORE: " + msg;
  }
  window.addEventListener("error", (e) => {
    // "Script error." senza file né riga è il messaggio generico che il browser
    // dà per un errore dentro uno script di un ALTRO sito (Firebase/Google) —
    // nessun dettaglio utile e di solito un semplice problema di rete passeggero
    // (segnalato con la barra rossa su una schermata normale). Non mostrarlo;
    // resta in console.
    if ((e.message === "Script error." || e.message === "Script error") && !e.filename && !e.lineno) {
      console.warn("Script error (script esterno, nessun dettaglio)", e);
      return;
    }
    showError((e.message || "errore sconosciuto") + " (" + (e.filename || "") + ":" + (e.lineno || "") + ")");
  });
  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason;
    // Prime righe dello stack: aiutano a capire QUALE scrittura è fallita.
    const where = r && r.stack ? "\n" + String(r.stack).split("\n").slice(0, 4).join("\n") : "";
    showError("promise non gestita: " + (r && r.message ? r.message : r) + where);
  });
}

// Registra il service worker per rendere il gioco installabile (PWA) su
// home screen. Ogni volta che pubblichi una nuova build, aggiorna
// CACHE_VERSION in sw.js — così i telefoni scaricano subito la novità
// invece di restare bloccati su una copia vecchia.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

// ---- Controllo periodico di nuove versioni pubblicate --------------------
// Il service worker sopra è "network-first" per index.html (vedi sw.js),
// ma quello aggiorna solo cosa verrà caricato al PROSSIMO reload — una
// scheda già aperta continua a eseguire il JavaScript già in memoria,
// anche a lungo, finché non la ricarichi. Con 4 giocatori sincronizzati
// via Firebase, se pubblico una build a metà partita (es. una regola
// cambiata) chi ha la scheda aperta da prima resta indietro senza
// accorgersene — sembra un bug ("a me non me lo fa fare") invece che una
// versione vecchia. Ogni tot minuti si richiede la index.html vera e
// propria bypassando la cache, e se il suo APP_VERSION è diverso da
// quello in esecuzione qui si mostra un banner discreto — mai un reload
// forzato, per non interrompere una mossa a metà.
const VERSION_CHECK_INTERVAL_MS = 5 * 60 * 1000; // ogni 5 minuti
let versionCheckDismissed = false;

function checkForNewVersion() {
  if (versionCheckDismissed || document.getElementById("version-banner")) return;
  fetch("./index.html?v=" + Date.now(), { cache: "no-store" })
    .then((res) => (res.ok ? res.text() : null))
    .then((html) => {
      if (!html) return;
      const m = html.match(/const APP_VERSION\s*=\s*"([^"]+)"/);
      if (m && m[1] && m[1] !== APP_VERSION) showNewVersionBanner(m[1]);
    })
    .catch(() => {}); // offline o rete debole: nessun avviso, si ricontrolla al giro successivo
}

// fromRoom (v5.30): un altro giocatore in stanza ha già una versione più
// nuova — l'avviso è più deciso e non si può chiudere, perché con regole
// diverse le mosse viste dai due telefoni potrebbero non tornare.
function showNewVersionBanner(newVersion, fromRoom) {
  const existing = document.getElementById("version-banner");
  if (existing) {
    if (!fromRoom || existing.dataset.fromRoom === "1") return;
    existing.remove(); // sostituito dalla versione "non chiudibile"
  }
  const text = fromRoom
    ? `Un altro giocatore usa una versione più nuova (${newVersion}). Ricarica per giocare con le stesse regole.`
    : `È disponibile una nuova versione (${newVersion}). Ricaricala quando fa comodo.`;
  const bar = el(
    "div",
    { id: "version-banner", class: "version-banner" },
    el("div", { class: "version-banner-text" }, text),
    el("button", { class: "version-banner-btn", onclick: () => location.reload() }, "Ricarica"),
    fromRoom
      ? null
      : el(
          "button",
          { class: "version-banner-dismiss", "aria-label": "Ignora", onclick: () => { versionCheckDismissed = true; bar.remove(); } },
          "✕"
        )
  );
  if (fromRoom) bar.dataset.fromRoom = "1";
  document.body.appendChild(bar);
}

setInterval(checkForNewVersion, VERSION_CHECK_INTERVAL_MS);
</script>
