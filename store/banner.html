<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Banner store</title>
<style>
@font-face { font-family: J; font-weight: 800; src: url("../fonts/plus-jakarta-sans-latin-800-normal.woff2"); }
@font-face { font-family: J; font-weight: 600; src: url("../fonts/plus-jakarta-sans-latin-600-normal.woff2"); }
html, body { margin: 0; }
.b { width: 1024px; height: 500px; position: relative; overflow: hidden; font-family: J, sans-serif; color: #1D1712;
  background: radial-gradient(60% 80% at 0% 0%, #F7C9CC 0%, transparent 60%), radial-gradient(60% 80% at 100% 0%, #BFE6D2 0%, transparent 60%), radial-gradient(60% 80% at 100% 100%, #BCD7F1 0%, transparent 60%), radial-gradient(60% 80% at 0% 100%, #F8E3A6 0%, transparent 60%), #FFF8EE; }
.l { position: absolute; left: 70px; top: 72px; width: 330px; }
h1 { position: absolute; left: 72px; top: 268px; margin: 0; font-size: 50px; line-height: 1.05; letter-spacing: -1.5px; font-weight: 800; width: 470px; }
p { position: absolute; left: 74px; top: 395px; margin: 0; font-size: 23px; font-weight: 600; color: #5A4E42; }
.shot { position: absolute; right: 70px; top: 40px; width: 300px; height: 533px; border-radius: 36px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(60,40,10,.5), 0 0 0 8px #1D1712; transform: rotate(4deg); }
.shot img { width: 100%; display: block; }
</style></head>
<body><div class="b">
<img class="l" src="../logo.png" alt="">
<h1>Il gioco da tavolo a coppie, con le carte</h1>
<p>Gioca subito con chi è online · o con gli amici</p>
<div class="shot"><img src="google-play/it/3-partita.png" alt=""></div>
</div></body></html>
