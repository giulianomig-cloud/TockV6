  const ranked = botRankedCandidates(state, active, seat, seatTeam, seatLevels);
  if (ranked.length === 0) {
    // Nessuna mossa legale per nessuna carta: si brucia la meno utile e si
    // passa, senza spendere un ply "vero" di ricerca.
    const clone = botCloneStateForSearch(state);
    burnOneCard(clone, seat, botCardToGiveAway(state, seat));
    if (COLORS.every((c) => clone.hands[c].length === 0)) return botLeafValue(state, botTeam);
    advanceTurn(clone);
    return botLookaheadValue(clone, botTeam, plies - 1, seatLevels);
  }

  const beam = ranked.slice(0, BOT_LOOKAHEAD_BEAM);
  const maximizing = seatTeam === botTeam; // il proprio turno (o del compagno): massimizza; l'avversario minimizza
  let bestValue = maximizing ? -Infinity : Infinity;
  for (const cand of beam) {
    const clone = botCloneStateForSearch(state);
    applyMove(clone, active, cand.card, cand.move);
    checkWin(clone);
    let value;
    if (clone.phase === "finished" || COLORS.every((c) => clone.hands[c].length === 0)) {
      value = botLeafValue(clone, botTeam);
    } else {
      advanceTurn(clone);
      value = botLookaheadValue(clone, botTeam, plies - 1, seatLevels);
    }
    if (maximizing ? value > bestValue : value < bestValue) bestValue = value;
  }
  return bestValue;
}

// Valuta una mossa candidata del bot con l'intero orizzonte di ricerca
// (la sostituta "profonda" di botScoreMove per la decisione reale).
function botScoreMoveDeep(state, active, card, move, botTeam, seatLevels) {
  const clone = botCloneStateForSearch(state);
  applyMove(clone, active, card, move);
  checkWin(clone);
  if (clone.phase === "finished") return botLeafValue(clone, botTeam);
  if (COLORS.every((c) => clone.hands[c].length === 0)) return botLeafValue(clone, botTeam);
  advanceTurn(clone);
  return botLookaheadValue(clone, botTeam, BOT_LOOKAHEAD_PLIES - 1, seatLevels);
}

// Punteggio della posizione risultante dal punto di vista della squadra
// `forTeam`: quanta strada hanno fatto le proprie pedine (molto di più se
// sono già in casa) meno quella delle avversarie, con una penalità per ogni
// propria pedina lasciata a tiro (poche caselle davanti) di un avversario.

// Termine strategico di botEvaluateBoard: chi ostacola chi (vedi BOT_WEIGHTS.block*).
function botBlockingTerm(pawns, lapped, forTeam) {
  const occ = new Array(64).fill(null);
  for (const c of COLORS) for (let i = 0; i < 4; i++) {
    const p = pawns[c][i];
    if (p >= 0 && p < 1000) occ[p] = c;
  }
  const rel = (teamSeeker, teamBlocker, w) => {
    if (teamSeeker !== teamBlocker) return teamBlocker === forTeam ? w : (teamSeeker === forTeam ? -w : 0);
    return forTeam === teamSeeker ? -w : w;
  };
  let score = 0;
  for (const c of COLORS) {
    const base = BOARD.baseIndex[c];
    for (let i = 0; i < 4; i++) {
      const pos = pawns[c][i];
      if (pos < 0 || pos >= 1000) continue;
      const wasLapped = !!(lapped && lapped[c] && lapped[c][i]);
      const steps = stepsFromOwnBase(c, pos, wasLapped);
      const tS = TEAM_OF[c];
      // (1) pedina in vista della propria casa: bloccata da chi ha davanti?
      if (steps >= 44) {
        const remaining = 64 - steps; // caselle fino alla propria base compresa
        const reach = Math.min(remaining, 13);
        for (let d = 1; d <= reach; d++) {
          const bc = occ[(pos + d) % 64];
          if (bc) { score += rel(tS, TEAM_OF[bc], BOT_WEIGHTS.blockSeeker); break; }
        }
      }
      // (2) pedina ferma sulla propria base, non ancora "girata": 4 indietro + casa
      if (pos === base && !wasLapped) {
        for (let d = 1; d <= 3; d++) {
          const bc = occ[(base - d + 64) % 64];
          if (bc) { score += rel(tS, TEAM_OF[bc], BOT_WEIGHTS.blockBack); break; }
        }
        // (3) posto di blocco: chi le sta arrivando dietro (entro 12 caselle)
        for (let d = 1; d <= 12; d++) {
          const bc = occ[(base - d + 64) % 64];
          if (!bc) continue;
          const w = BOT_WEIGHTS.parkBase * (1 - (d - 1) / 13);
          // bc è "bloccato" dalla pedina ferma: vantaggio per la squadra della ferma se bc è avversario, danno se è compagno
          score += TEAM_OF[bc] === tS ? (forTeam === tS ? -w : w) : (forTeam === tS ? w : -w);
        }
      }
    }
  }
  return score;
}

function botEvaluateBoard(pawns, lapped, forTeam) {
  let score = 0;
  for (const c of COLORS) {
    const sign = TEAM_OF[c] === forTeam ? 1 : -1;
    for (let i = 0; i < 4; i++) {
      const pos = pawns[c][i];
      let val;
      if (pos === -1) val = BOT_WEIGHTS.evalBase; // in base: meglio essere in gioco
      else if (pos >= 1000) val = BOT_WEIGHTS.evalHomeBase + (pos - 1000) * BOT_WEIGHTS.evalHomeStep; // in casa: sempre molto meglio
      else {
        val = stepsFromOwnBase(c, pos, lapped && lapped[c] && lapped[c][i]);
        // Ferma esattamente sulla propria casella-base e non ancora girata:
        // è protetta (isPawnProtected) — non mangiabile, non selezionabile
        // dal Jack. Un piccolo bonus dà al bot un motivo per non spostarla
        // via da lì senza un reale vantaggio, invece di trattarla come una
        // pedina in gioco qualunque.
        if (pos === BOARD.baseIndex[c] && !(lapped && lapped[c] && lapped[c][i])) {
          val += BOT_WEIGHTS.evalProtectedBase;
        }
      }
      score += sign * val;
    }
  }
  for (const c of COLORS) {
    if (TEAM_OF[c] !== forTeam) continue;
    for (let i = 0; i < 4; i++) {
      const pos = pawns[c][i];
      if (pos === -1 || pos >= 1000) continue;
      for (const oc of COLORS) {
        // Solo pedine AVVERSARIE: prima si saltava solo il proprio colore, quindi
        // anche le pedine del COMPAGNO contavano come minaccia (penalità) e come
        // bersaglio (bonus "le tengo sotto tiro") — il bot era premiato per
        // restare dietro al compagno, che è una delle cause di "mangia troppo il
        // compagno".
        if (TEAM_OF[oc] === forTeam) continue;
        for (let j = 0; j < 4; j++) {
          const opos = pawns[oc][j];
          if (opos === -1 || opos >= 1000) continue;
          const dist = (pos - opos + 64) % 64; // passi che servirebbero all'avversario per arrivarci
          if (dist >= 1 && dist <= 10) score -= (11 - dist) * BOT_WEIGHTS.threatPenalty;
          // Simmetrico: quanti passi servirebbero A NOI per raggiungere
          // QUESTO avversario. Prima non c'era nessun premio per restare in
          // posizione di minaccia (solo una penalità per essere minacciati),
          // quindi il bot correva sempre subito in casa appena poteva. Un
          // piccolo bonus qui gli dà un motivo reale per restare fuori un
          // altro giro quando può tenere sotto tiro una pedina avversaria.
          const distToThem = (opos - pos + 64) % 64;
          if (distToThem >= 1 && distToThem <= 10) score += (11 - distToThem) * BOT_WEIGHTS.threatBonus;
        }
      }
    }
  }
  score += botBlockingTerm(pawns, lapped, forTeam);
  return score;
}

// Timer del banner di vittoria (vedi onStateChange) — tenuto a livello di
// modulo così una chiamata successiva può annullare un ritardo ancora in
// sospeso invece di accumularne più di uno.
let _winBannerTimer = null;
let _winCelebrateUntil = 0;

// Festa sul tabellone a fine partita: le 8 pedine della squadra vincente
// saltano una dopo l'altra (a onda) con un anello del loro colore. Ritorna
// quanto dura (ms), 0 se non parte (movimento ridotto, tabellone assente).
function celebrateWinOnBoard(state, delayMs) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return 0;
  if (!boardSvg || !state || !state.winnerTeam) return 0;
  const winners = COLORS.filter((c) => TEAM_OF[c] === state.winnerTeam);
  const items = [];
  winners.forEach((c) => [0, 1, 2, 3].forEach((i) => {
    const el = _pawnAnimState.els[c + "-" + i];
    const pos = state.pawns && state.pawns[c] && state.pawns[c][i];
    if (el && pos != null && pos !== -1) items.push({ el, color: c, cell: cellForColor(BOARD, c, pos) });
  }));
  if (!items.length) return 0;
  const GAP = 80, HOP = 420, lift = BOARD.cellRadiusMm * 1.3;
  setTimeout(() => {
    items.forEach((it, n) => setTimeout(() => {
      const gen = (it.el.__animGen || 0) + 1;
      it.el.__animGen = gen;
      const t0 = performance.now();
      const f = (now) => {
        if (it.el.__animGen !== gen) return;
        const k0 = Math.min(1, (now - t0) / HOP), k = fxQ(k0);
        it.el.setAttribute("transform", `translate(${it.cell.x},${it.cell.y - Math.sin(k * Math.PI) * lift})`);
        if (k0 < 1) requestAnimationFrame(f);
        else fxRing(boardSvg, it.cell.x, it.cell.y, BOARD.cellRadiusMm * 0.6, BOARD.cellRadiusMm * 1.6, fxCol(it.color), 480, 3);
      };
      requestAnimationFrame(f);
    }, n * GAP));
  }, delayMs);
  return (items.length - 1) * GAP + HOP + 300;
}
// Evita di ritentare il reclamo della classifica ad ogni singolo
// re-render mentre la partita resta "finished" (onStateChange viene
// richiamato spesso) — un solo tentativo per transizione, azzerato non
// appena la fase lascia "finished" (nuova partita), stesso schema già
// usato per _winBannerTimer qui sopra.
let _leaderboardClaimAttempted = false;

function onStateChange(state) {
  if (!state) return;
  currentState = state;
  // Schermata di gioco non presente (si è usciti dal tavolo ma l'ascolto è
  // rimasto): niente da disegnare, e nessun bot da far avanzare da qui.
  if (!document.getElementById("hand-wrap")) return;
  maybeAdvanceBotTurn(state);
  maybeAdvanceBotChat(state);
  maybePlaySounds(state);
  recordMoveHistoryIfFresh(state);
  renderDealerDrawScreen(state);
  renderStartControls(state);
  const pawnAnimMs = renderPawns(boardSvg, BOARD, state.pawns, state.lastSwap, state.lastCapture, state.lastHomeEntry, state.lastSeven);
  noteBotBusy(state, pawnAnimMs);
  renderTurnIndicator(state);
  renderCenterDiscard(state);
  renderPlayerStatus(state);
  renderHand(state);
  renderExchangeControls(state); // dopo turno+mano: ne riusa gli spazi durante lo scambio
  renderChat(state);
  renderLog(state);
  renderHandsDebugPanel(state);
  if (state.phase === "finished") {
    // Aspetta che l'animazione della mossa finale (l'ultima pedina che
    // scorre in casa) sia visibilmente conclusa prima di mostrare il
    // banner — altrimenti il banner, che copre il tabellone, appariva
    // subito sopra la mossa ancora in corso (segnalato: "fai vedere prima
    // l'entrata e poi il banner"). pawnAnimMs è 0 quando non c'è
    // un'animazione fresca da aspettare (es. si riapre l'app su una
    // partita già conclusa), quindi in quel caso il banner compare subito.
    // Partita appena vinta davanti ai nostri occhi (pawnAnimMs > 0): dopo
    // l'ultima mossa le pedine della squadra vincente fanno un saltello "a
    // onda" sul tabellone, e solo dopo arriva il banner. Il momento in cui
    // il banner può comparire è segnato una volta sola (_winCelebrateUntil),
    // così un nuovo render nel frattempo non lo fa spuntare prima.
    if (pawnAnimMs > 0 && !_winCelebrateUntil) {
      const startIn = pawnAnimMs + 250;
      const waveMs = celebrateWinOnBoard(state, startIn);
      _winCelebrateUntil = Date.now() + startIn + waveMs + (waveMs > 0 ? 200 : 0);
    }
    clearTimeout(_winBannerTimer);
    _winBannerTimer = setTimeout(() => {
      if (!currentState || currentState.phase !== "finished") return;
      // v5.65: il banner "nasce" dalla riga di un giocatore della squadra vincente.
      const st = currentState, wc = COLORS.filter((c) => TEAM_OF[c] === st.winnerTeam);
      const from = document.querySelector(".board-player.bp-" + (wc.includes(myColor) ? myColor : wc[0]));
      if (from && !document.querySelector("#app .win-banner-backdrop")) vtGo(from, ".win-banner", () => renderWinBanner(st), { noAuto: true });
      else renderWinBanner(st);
    }, Math.max(0, (_winCelebrateUntil || 0) - Date.now()));
    if (!_leaderboardClaimAttempted) {
      _leaderboardClaimAttempted = true;
      tryClaimLeaderboardCredit(state).catch(() => {});
    }
  } else {
    _leaderboardClaimAttempted = false;
    _winCelebrateUntil = 0;
    clearTimeout(_winBannerTimer);
    // The banner is prepended straight into #app (outside the normal
    // per-section re-render), so once the phase leaves "finished" — e.g.
    // "Nuova partita" — nothing else ever takes it back down. Remove it
    // explicitly here, every render, so it can never get stuck on screen.
    const stale = $("#app").querySelector(".win-banner-backdrop");
    if (stale) stale.remove();
  }
}

// ---------------- Estrazione del mazziere (Asso di Cuori) ----------------
//
// Solo per la primissima mano di una stanza (vedi startGame). La sequenza
// di carte è calcolata una volta sola e salvata in state.dealerDraw, così
// l'animazione che vedono i 4 giocatori è identica; ogni client la anima
// per conto proprio (locale, non sincronizzata mossa per mossa) e, alla
// fine, uno qualsiasi dei 4 (il primo che ci arriva) scrive il risultato e
// fa partire la mano vera e propria — protetto da un controllo di fase
// dentro la transazione, quindi anche se più client ci arrivano insieme il
// risultato viene applicato una volta sola.
let dealerDrawAnimShown = { forRoom: null, done: false };

// Mostrata come bottom sheet che sale da sotto (stesso openPicker/
// closePicker usato per i picker del Jack/7/regole), non più come riquadro
// fisso in mezzo alla pagina — su richiesta, coerente col resto dell'app.
//
// Torna a usare openPicker/#picker-wrap (il pannello a foglio che sale dal
// basso, come Jack/7/regole): i due bug reali che rendevano invisibile la
// rivelazione erano (a) l'ordine di renderGameShell()/watchRoom() in
// onDraftStateChange e (b) una classe CSS in collisione con la pulizia del
// banner di vittoria — nessuno dei due riguardava il meccanismo del picker
// in sé, quindi ora che sono corretti non c'è più motivo di evitarlo, ed è
// coerente con lo stile del resto dell'app.
function renderDealerDrawScreen(state) {
  // Il gating è su state.dealerDraw (non più su state.phase === "dealerDraw":
  // vedi dealAndRevealDealer) — la fase passa subito a "exchanging" con le
  // carte già distribuite, e questa rimane solo la rivelazione scenica di
  // un risultato già calcolato, mostrata in sovraimpressione a ogni client.
  if (!state.dealerDraw) {
    if (dealerDrawAnimShown.forRoom === myRoomId) {
      dealerDrawAnimShown = { forRoom: null, done: false };
      closePicker();
    }
    return;
  }

  if (dealerDrawAnimShown.forRoom === myRoomId) return; // già in corso o conclusa per questa stanza

  dealerDrawAnimShown = { forRoom: myRoomId, done: false };
  const slotsByColor = {};
  const grid = el("div", { class: "dealer-draw-grid" });
  const dealerNames = {};
  // v6.10: riquadri nello stesso ordine degli angoli del tabellone (Rosso e Verde in alto,
  // Blu e Giallo in basso), non nell'ordine di COLORS: prima Giallo e Blu erano scambiati.
  ["red", "green", "blue", "yellow"].forEach((c) => {
    dealerNames[c] = playerName(state, c);
    // Mostra anche il nome del giocatore (non solo il colore) — playerName
    // ricade già da solo sul nome del colore se non c'è un nome impostato
    // (es. posto libero improbabile qui, o un bot già rinominato "Bot X").
    const name = playerName(state, c);
    // v5.56: nello stile Classico (riquadri Bento) basta il nome, il colore
    // lo dice già il pallino.
    const label = name === colorLabel(c) ? colorLabel(c) : isClassicSkin() ? name : `${colorLabel(c)} · ${name}`;
    const slot = el(
      "div",
      { class: "dealer-slot", id: "dealer-slot-" + c },
      el("div", { class: "dealer-slot-label" }, el("span", { class: "swatch swatch-" + c }), label),
      // v5.81: spazio della carta già riservato, così il riquadro non si allarga alla prima carta
      isClassicSkin() ? el("div", { class: "dealer-pile" }) : null
    );
    slotsByColor[c] = slot;
    grid.appendChild(slot);
  });
  grid.appendChild(el("div", { class: "dealer-deck", id: "dealer-deck", "aria-hidden": "true" }, el("span"), el("span"), el("span")));
  openPicker(
    el(
      "div",
      { class: "choice-box", style: "text-align:center;" },
      el("h1", { style: "font-size:1.15rem;margin:0 0 6px;" }, "🎴 Estrazione del mazziere"),
      el("p", { class: "muted", style: "margin:0 auto 14px;font-weight:500;" }, "Si pesca a turno: chi trova l'Asso di Cuori dà le carte per primo."),
      grid,
      el("div", { id: "dealer-draw-banner" })
    ),
    { opaque: true }
  );
  animateDealerDraw(state.dealerDraw.sequence, dealerNames);
}

// Ogni carta parte dal mazzetto al centro e scivola già scoperta verso chi
// la pesca, con il suono della carta; all'Asso di Cuori il "ding". Stesso
// ritmo di prima (una carta ogni 550 ms).
function flyDealerCard(btn) {
  const deck = document.getElementById("dealer-deck");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!deck || reduce || !btn.animate) { btn.classList.add("dealer-card-pop"); return; }
  const d = deck.getBoundingClientRect(), b = btn.getBoundingClientRect();
  const dx = d.left + d.width / 2 - (b.left + b.width / 2), dy = d.top + d.height / 2 - (b.top + b.height / 2);
  // Arriva già scoperta (niente giro: quello "piatto" a metà strada non
  // piaceva): scivola dal mazzetto con una leggera rotazione e si assesta.
  btn.animate(
    [
      { transform: `translate(${dx}px, ${dy}px) rotate(-14deg) scale(0.9)` },
      { transform: "translate(0, 0) rotate(2deg) scale(1.03)", offset: 0.8 },
      { transform: "translate(0, 0) rotate(0deg) scale(1)" },
    ],
    { duration: 420, easing: isArcade() ? "steps(6, end)" : "cubic-bezier(.2,.8,.3,1)" }
  );
}

// v5.56 (solo stile Classico): "lancio" — la carta si stacca dal mazzetto,
// fa una piccola curva girando su sé stessa e si posa un po' storta sul
// mucchietto delle carte già pescate da quel giocatore (restano le ultime 4).
function throwDealerCard(slot, btn, n) {
  let pile = slot.querySelector(".dealer-pile");
  if (!pile) { pile = el("div", { class: "dealer-pile" }); slot.appendChild(pile); }
  const olds = [...pile.querySelectorAll(".card-btn")];
  olds.slice(0, Math.max(0, olds.length - 3)).forEach((o) => o.remove());
  olds.forEach((o) => o.classList.add("dealer-under"));
  const r = ((n * 37) % 15) - 7; // angolo "a caso" ma uguale su tutti i telefoni
  btn.style.transform = `rotate(${r}deg)`;
  pile.appendChild(btn);
  const deck = document.getElementById("dealer-deck");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!deck || reduce || !btn.animate) return;
  const d = deck.getBoundingClientRect(), b = btn.getBoundingClientRect();
  const dx = d.left + d.width / 2 - (b.left + b.width / 2), dy = d.top + d.height / 2 - (b.top + b.height / 2);
  // v5.81 ("B · mazzo piccolo e leggero"): scivola dritta dal mazzetto, senza giravolte.
  btn.animate(
    [
      { transform: `translate(${dx}px, ${dy}px) rotate(0deg) scale(.6)`, opacity: 0.4 },
      { transform: `translate(0, 0) rotate(${r}deg) scale(1)`, opacity: 1 },
    ],
    { duration: 340, easing: "cubic-bezier(.2,.8,.3,1)" }
  );
}

function isClassicSkin() { return !document.documentElement.hasAttribute("data-skin"); }

async function animateDealerDraw(sequence, names) {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let n = 0;
  for (const step of sequence) {
    const slot = document.getElementById("dealer-slot-" + step.color);
    if (!slot) continue;
    const btn = buildCardButton(step.card, true, () => {});
    if (isClassicSkin()) {
      throwDealerCard(slot, btn, n++);
    } else {
      const old = slot.querySelector(".card-btn");
      if (old) old.remove();
      slot.appendChild(btn);
      flyDealerCard(btn);
    }
    try { playSound("dealerCard"); } catch (e) {}
    await sleep(550);
  }
  const winnerColor = sequence[sequence.length - 1].color;
  try { playSound("homeDing"); } catch (e) {}
  const winnerSlot = document.getElementById("dealer-slot-" + winnerColor);
  if (winnerSlot) winnerSlot.classList.add("dealer-winner");
  const banner = document.getElementById("dealer-draw-banner");
  if (banner) {
    const name = names && names[winnerColor];
    const who = name && name !== colorLabel(winnerColor) ? `${name} (${colorLabel(winnerColor)})` : colorLabel(winnerColor);
    banner.textContent = `🎉 ${who} dà le carte per primo!`;
    banner.classList.add("show");
  }
  await sleep(1600);
  dealerDrawAnimShown.done = true;
  finishDealerDraw();
}

// Non distribuisce più le carte (lo fa già dealAndRevealDealer, subito,
// non appena il mazziere è determinato) — qui si limita a far sparire dal
// database il risultato ormai mostrato, così un client che si ricollega
// più tardi non si ritrova a rivedere una rivelazione vecchia di una mano
// già in corso da un pezzo.
async function finishDealerDraw() {
  try {
    await updateState(myRoomId, (state) => {
      if (!state.dealerDraw) return; // già ripulito da un altro client
      state.dealerDraw = null;
    });
  } catch (e) {
    console.error(e);
  }
}

function renderStartControls(state) {
  const wrap = $("#start-wrap");
  if (!wrap) return; // schermata di gioco non presente (es. timer/ritardo dopo essere usciti dal tavolo)
  wrap.innerHTML = "";
  if (state.phase !== "lobby") return;
  // COLORS (non Object.keys) apposta: Object.keys segue l'ordine di
  // ingresso in stanza, quindi elencava i giocatori nell'ordine casuale in
  // cui erano entrati invece che nella sequenza fissa rosso-verde-
  // giallo-blu usata ovunque altrove nell'app (tabellone, status in
  // partita, ecc.) — incoerente da schermata a schermata.
  const joined = COLORS.filter((c) => state.players && state.players[c]);
  const missing = COLORS.filter((c) => !state.players[c]);
  // Se hai dimenticato di assegnare qualche posto al computer prima di
  // entrare, non serve più uscire e rientrare nella stanza (cosa che tra
  // l'altro non riportava alla schermata giusta): si può fare da qui,
  // direttamente nella sala d'attesa. watchRoom/onStateChange è già in
  // ascolto, quindi basta il giro Firebase per far ricomparire questa
  // schermata aggiornata da sola.
  // v5.51: stesso stile della schermata della stanza (una riga per colore,
  // divise per squadra); sui posti vuoti i due pulsanti per il computer.
  const seat = (c) => {
    const p = state.players && state.players[c];
    return el(
      "div",
      { class: "room-seat " + (p ? (p.isBot ? "rs-bot" : "rs-taken") : "rs-free") + (c === myColor ? " rs-mine" : "") },
      el("span", { class: "room-dot", style: `background:var(--${c})` }),
      el("div", { class: "room-seat-text" },
        el("span", { class: "room-seat-name" }, p ? (p.isBot ? "🤖 Computer" : p.name || colorLabel(c)) : "Libero"),
        el("span", { class: "room-seat-sub" }, p && p.isBot ? (p.botLevel === "easy" ? "normale" : "difficile") : colorLabel(c) + (c === myColor ? " · tu" : ""))),
      p ? "" : [
        el("button", { class: "room-chip", onclick: () => assignBotToColor(myRoomId, c, () => {}, "easy") }, "🤖 Normale"),
        el("button", { class: "room-chip", onclick: () => assignBotToColor(myRoomId, c, () => {}, "hard") }, "🤖 Difficile"),
      ]
    );
  };
  const team = (t) => el("div", { class: "room-team" },
    el("div", { class: "room-team-head" }, `Squadra ${t === "A" ? 1 : 2} · ${TEAM_LABEL[t]}`),
    COLORS.filter((c) => TEAM_OF[c] === t).map(seat));
  wrap.appendChild(
    el(
      "div",
      { class: "start-card" },
      el("div", { class: "t-sec", style: "margin-top:4px;" }, el("b", {}, "In attesa dei giocatori"), el("span", {}, `${joined.length}/4`)),
      el("div", { class: "room-teams" }, team("A"), el("div", { class: "room-vs" }, "VS"), team("B")),
      missing.length > 0 ? el("p", { class: "t-note", style: "margin:-6px 2px 10px;" }, "Aspetta gli amici o metti il computer sui posti liberi.") : "",
      el("button", { class: "primary", disabled: missing.length > 0, onclick: startGame }, missing.length === 1 ? "Manca 1 giocatore" : missing.length > 1 ? `Mancano ${missing.length} giocatori` : "Inizia partita")
    )
  );
}

async function startGame() {
  try {
    await updateState(myRoomId, (state) => {
      if (COLORS.some((c) => !state.players[c])) throw new Error("mancano giocatori");
      // Si parte SEMPRE da un mazzo nuovo e intero: la prima mano di una partita
      // è da 5 carte a testa. Se la stanza era già stata usata e restava un
      // mazzo a metà (segnalato: "ha dato 4 carte di prima mano"), lo si scarta.
      if (state.phase === "lobby") {
        state.deck = [];
        state.firstHandOfCycle = true;
        state.playedThisCycle = [];
      }
      if (!state.hasDealtBefore) {
        // Primissima mano di questa stanza: estrae il mazziere e distribuisce
        // subito (vedi dealAndRevealDealer per perché non si aspetta più
        // l'animazione per farlo davvero).
        dealAndRevealDealer(state);
      } else {
        dealNewHand(state); // sets phase to "exchanging" itself
      }
    });
  } catch (e) {
    showToast("Non è partita: " + describeError(e));
    console.error(e);
  }
}

// ---------------- Blind card exchange ----------------

function renderExchangeControls(state) {
  // Lo scambio usa gli STESSI due spazi del gioco: una riga sottile al posto
  // di "Turno di…" (#turn-indicator) e le carte in #hand-wrap, così le carte
  // restano ESATTAMENTE dove sono durante la partita invece di scendere sotto
  // un riquadro alto (segnalato). #exchange-wrap non serve più: si svuota.
  const exWrap = $("#exchange-wrap");
  if (!exWrap) return;
  exWrap.innerHTML = "";
  if (state.phase !== "exchanging") return;
  const line = $("#turn-indicator");
  const handWrap = $("#hand-wrap");
  if (!line || !handWrap) return;
  line.innerHTML = "";
  handWrap.innerHTML = "";
  const already = !!state.pendingExchange[myColor];
  const partner = PARTNER_OF[myColor];
  const waitingColors = COLORS.filter((c) => !state.pendingExchange[c]);
  const dots = el(
    "span",
    { class: "exchange-dots" },
    COLORS.map((c) =>
      el(
        "span",
        {
          class: "exchange-dot exchange-dot-" + c + " " + (state.pendingExchange[c] ? "done" : "waiting"),
          title: playerName(state, c) + (state.pendingExchange[c] ? " ha scelto" : " sta scegliendo"),
        },
        (playerName(state, c) || "?").trim().charAt(0).toUpperCase(),
        el("span", { class: "exchange-dot-check" + (state.pendingExchange[c] ? "" : " pending") }, "✓")
      )
    )
  );
  // v5.65: appena data la carta la riga diventa verde "✓ Carta data a …"
  // (prima "Mando la carta…" con la rotellina, vedi il clic sulle carte sotto).
  const justSent = already && Date.now() - _exchangeSentAt < 4000;
  if (justSent && _exchangeOkSound !== _exchangeSentAt) { _exchangeOkSound = _exchangeSentAt; try { playSound("fbOk"); } catch (e) {} }
  line.appendChild(
    el(
      "div",
      { class: "turn-line exchange-line" + (already ? "" : " my-turn") + (justSent ? " ex-ok" : "") },
      already
        ? el("strong", {}, !waitingColors.length ? "Tutti pronti, avvio…" : justSent ? "✓ Carta data a " + playerName(state, partner) : "✓ Scelta fatta")
        : el("strong", {}, "🤝 Dai una carta a " + playerName(state, partner)),
      dots
    )
  );
  // La carta data è già stata tolta da state.hands (vedi submitExchangeCard):
  // restano solo le carte che tieni davvero.
  // Distribuzione: animazione solo la prima volta che si vede una mano appena data
  // (chiave = carte rimaste nel mazzo, cambia a ogni distribuzione) e solo se è
  // davvero appena successo (non rientrando a metà scambio).
  const dealKey = String((state.deck || []).length) + ":" + (state.dealerColor || "");
  const justDealt = _dealAnimKey !== dealKey && Date.now() - (state.turnStartedAt || 0) < 15000;
  _dealAnimKey = dealKey;
  _handRenderedAt = Date.now();
  (state.hands[myColor] || []).filter(Boolean).forEach((card, i) => {
    const btn = already ? buildCardButton(card, false) : buildCardButton(card, true, (e) => {
      flyGivenCard(e && e.currentTarget);
      _exchangeSentAt = Date.now();
      const st = document.querySelector(".exchange-line strong");
      if (st) { st.innerHTML = ""; st.append(el("span", { class: "fb-spin", "aria-hidden": "true" }), "Mando la carta…"); }
      sendExchangeCard(card);
    });
    if (justDealt) {
      btn.classList.add("deal-card");
      btn.style.setProperty("--i", i);
      btn.style.setProperty("--dx", ((i - 2) * -14) + "px");
      btn.style.setProperty("--rot", (i % 2 ? -16 : 16) + "deg");
      setTimeout(() => { try { playSound("deal"); } catch (e) {} }, i * 260 + 120);
      setTimeout(() => btn.classList.remove("deal-card"), i * 260 + 900);
    }
    handWrap.appendChild(btn);
  });
  applyHandFan();
}
let _dealAnimKey = null;
let _handRenderedAt = 0;
let _exchangeSentAt = 0, _exchangeOkSound = 0;

// Rete di sicurezza per "a volte spariscono le carte": se la mano nello
// stato ha carte ma sullo schermo ce ne sono di meno (render interrotto,
// timer, ritorno dallo sfondo su iPhone) le ridisegna; e se un'animazione
// di distribuzione è rimasta a metà (carte a opacità 0) la toglie.
function ensureHandVisible() {
  try {
    const st = currentState;
    if (!st || !myColor || document.hidden) return;
    if (st.phase !== "playing" && st.phase !== "exchanging") return;
    const wrap = document.getElementById("hand-wrap");
    if (!wrap) return;
    const expected = (st.hands[myColor] || []).filter(Boolean).length;
    if (wrap.children.length !== expected) {
      if (st.phase === "exchanging") renderExchangeControls(st); else renderHand(st);
      return;
    }
    if (Date.now() - _handRenderedAt > 3500) {
      wrap.querySelectorAll(".card-btn.deal-card, .card-btn.deal-in, .card-btn.received-fly").forEach((b) => b.classList.remove("deal-card", "deal-in", "received-fly"));
    }
  } catch (e) {}
}
setInterval(ensureHandVisible, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(ensureHandVisible, 150); });
window.addEventListener("pageshow", () => setTimeout(ensureHandVisible, 150));
window.addEventListener("focus", () => setTimeout(ensureHandVisible, 150));

// Animazione carta data: un clone della carta vola verso l'alto (lato
// compagno) rimpicciolendosi e sfumando; la carta vera sparisce subito
// dalla mano perché lo stato la toglie.
function flyGivenCard(btn) {
  try {
    if (!btn || !btn.getBoundingClientRect) return;
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = btn.getBoundingClientRect();
    const c = btn.cloneNode(true);
    c.removeAttribute("disabled");
    c.classList.add("card-giving");
    Object.assign(c.style, { position: "fixed", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", margin: "0", zIndex: 9999, pointerEvents: "none" });
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 700);
    try { playSound("chatMessage"); } catch (e) {}
  } catch (e) {}
}

async function sendExchangeCard(card) {
  keepAudioAlive();
  try {
    await updateState(myRoomId, (state) => {
      submitExchangeCard(state, myColor, card);
    });
  } catch (e) {
    showToast("Errore nello scambio: " + describeError(e));
    _exchangeSentAt = 0;
    try { playSound("fbFail"); } catch (e2) {}
    if (currentState) renderExchangeControls(currentState); // la riga torna "Dai una carta a …"
  }
}

// Ordine di lettura sopra/sotto il tabellone: [alto-sx, alto-dx] e
// [basso-sx, basso-dx]. L'ordine COLORS (rosso, verde, giallo, blu) letto
// così metterebbe il giallo in basso a SINISTRA e il blu in basso a DESTRA
// — l'opposto di come stanno le basi sul tabellone vero (giallo in basso a
// destra, blu in basso a sinistra, proseguendo in senso orario da rosso a
// verde). Questo ordine dedicato (giallo e blu scambiati rispetto a
// COLORS) fa sì che ogni nome compaia vicino alla PROPRIA base — NON va
// confuso con COLORS, che resta l'ordine di gioco/turni vero e proprio,
// invariato.
const STATUS_TOP_ORDER = ["red", "green"];
const STATUS_BOTTOM_ORDER = ["blue", "yellow"];

// Nome + pedine "fuori dalla base" (vedi miniPawnsRow) per ciascun
// giocatore, senza più un riquadro/card a sé — solo testo e pallini
// posizionati sopra e sotto il tabellone, agli angoli corrispondenti alla
// base di quel colore (segnalato: troppi contenitori separati; ora si
// legge subito vicino a dove gioca davvero). Nome e pallini stanno sulla
// STESSA riga (non più impilati) — a sinistra del tabellone i pallini
// vengono prima e il nome dopo, verso il centro; a destra è speculare
// (nome verso il centro, pallini verso il bordo), così i due nomi si
// avvicinano l'uno all'altro invece di restare ognuno appiccicato al suo
// bordo. Il colore lo dicono già i pallini pieni/vuoti (stesso hex del
// giocatore), quindi non serve più anche un pallino separato solo per
// quello. Il giocatore di turno si riconosce dal nome sottolineato nel
// SUO colore, non più da un bordo su un riquadro che non c'è più.
function renderPlayerStatus(state) {
  const topWrap = $("#board-players-top");
  const bottomWrap = $("#board-players-bottom");
  if (!topWrap || !bottomWrap) return;
  topWrap.innerHTML = "";
  bottomWrap.innerHTML = "";
  if (state.phase !== "playing" && state.phase !== "exchanging") return;

  const buildPlayer = (c, isRightSide) => {
    // Solo il giocatore di TURNO va sottolineato (chiesto esplicitamente:
    // "la sottolineatura deve stare solamente sotto al giocatore di
    // turno") — durante "exchanging" (scambio alla cieca) non c'è un
    // turno singolo, quindi in quella fase nessuno è sottolineato: era
    // stato provato a estenderla a "chi è ancora in attesa" nello scambio,
    // ma non è quello che serve qui, tornato indietro.
    const isTurn = state.phase === "playing" && state.turnColor === c;
    // Mentre state.dealerDraw è presente, l'estrazione del mazziere (Asso di
    // Cuori) sta ancora animandosi in sovraimpressione (vedi
    // renderDealerDrawScreen): dealerColor è già stato deciso e scritto nel
    // database nello stesso istante (dealAndRevealDealer), quindi senza
    // questo controllo il distintivo comparirebbe subito sul tabellone
    // sotto al foglio, rivelando chi ha vinto PRIMA che l'animazione lo
    // sveli (segnalato: "spoiler"). Torna a comparire non appena
    // state.dealerDraw viene ripulito, cioè a rivelazione conclusa.
    const isDealer = state.dealerColor === c && !state.dealerDraw;
    const isBotSeat = state.players[c] && state.players[c].isBot;
    // presenceState[c] è un oggetto { connId: true, ... } — una chiave per
    // ogni connessione viva di quel colore (vedi setupOwnPresence), non un
    // singolo booleano: online finché ne resta almeno una.
    const isOnline = !!presenceState[c] && Object.keys(presenceState[c]).length > 0;
    const nameEl = el("span", { class: "board-player-name" }, playerName(state, c));
    const dots = miniPawnsRow(state.pawns[c], c);
    // Le pedine sempre nello stesso ordine (dal bordo schermo verso il
    // centro) per TUTTI i giocatori, non solo per chi sta a sinistra
    // (chiesto). L'SVG di miniPawnsRow disegna sempre da sinistra a destra
    // al suo interno; per chi sta a destra lo specchiamo (scaleX(-1)) così
    // il pallino "più esterno" resta lo stesso, sul lato del nome, invece
    // di finire capovolto verso il centro.
    if (isRightSide) dots.style.transform = "scaleX(-1)";
    // Mazziere/offline in un contenitore a parte (non più dentro
    // board-player-head insieme al nome): vedi ordine sotto.
    const extras = el(
      "span",
      { class: "board-player-extras" }
    );
    // Avviso "non connesso": fuori dalla pillola, accanto ad essa (come il mazziere).
    // v5.31: un pallino grigio (stile "offline" delle chat) al posto del ⚠️,
    // che sembrava un errore.
    const warn = !isBotSeat && state.players[c] && !isOnline
      ? el("span", { class: "status-offline-dot", title: `${colorLabel(c)} non è connesso in questo momento`, "aria-label": `${colorLabel(c)} non connesso` })
      : null;
    // Dall'esterno (bordo schermo) verso l'interno (centro/tabellone):
    // nome, pedine, poi le altre info (mazziere/disconnesso) — chiesto.
    // Prima erano nome+mazziere/disconnesso insieme più esterni delle
    // pedine; ora le pedine stanno in mezzo.
    const pill = el(
      "div",
      { class: `board-player bp-${c}` + (isTurn ? " bp-active" : "") + (isRightSide ? " bp-right" : "") },
      ...(isRightSide ? [extras, dots, nameEl] : [nameEl, dots, extras])
    );
    // Il mazziere sta FUORI dalla pillola, accanto ad essa (nello spazio
    // centrale della riga): così le 4 pillole hanno tutte la stessa misura.
    const badge = isDealer ? dealerBadge(handsRemainingBeforeReshuffle(state)) : null;
    return { pill, side: el("div", { class: "bp-side" }, warn || "", badge || "") };
  };
  const buildRow = (wrap, cL, cR) => {
    const L = buildPlayer(cL, false), R = buildPlayer(cR, true);
    wrap.appendChild(L.pill);
    wrap.appendChild(el("div", { class: "bp-gap" }, L.side, R.side));
    wrap.appendChild(R.pill);
  };
  buildRow(topWrap, STATUS_TOP_ORDER[0], STATUS_TOP_ORDER[1]);
  buildRow(bottomWrap, STATUS_BOTTOM_ORDER[0], STATUS_BOTTOM_ORDER[1]);
}

// Icona del mazziere: l'Asso di Cuori, la carta che si pesca davvero per
// diventare mazziere (vedi dealAndRevealDereal/dealAndRevealDealer) — prima
// era un generico mazzetto di 3 cartine, che non c'entrava con la regola
// reale del gioco. Distintivo pieno in oro (stesso linguaggio degli altri
// badge tondi dell'app, es. exchange-done-badge) con la carta bianca sopra,
// leggibile a colpo d'occhio anche piccolissimo.
// withBg=false disegna solo la cartina, senza il proprio cerchio dorato:
// usata dentro dealerBadge(), che mette icona + numero mani rimaste in un
// unico contenitore pillola (prima erano due badge separati affiancati).
function dealerIcon(withBg) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");

  svg.appendChild(title);
  if (withBg !== false) {
    const bg = document.createElementNS(ns, "circle");
    bg.setAttribute("class", "dc-bg");
    bg.setAttribute("cx", 20);
    bg.setAttribute("cy", 20);
    bg.setAttribute("r", 20);
    svg.appendChild(bg);
  }
  const card = document.createElementNS(ns, "rect");
  card.setAttribute("class", "dc-card");
  card.setAttribute("x", 11);
  card.setAttribute("y", 7);
  card.setAttribute("width", 18);
  card.setAttribute("height", 24);
  card.setAttribute("rx", 3);
  card.setAttribute("transform", "rotate(-6 20 20)");
  svg.appendChild(card);
  const g = document.createElementNS(ns, "g");
  g.setAttribute("transform", "rotate(-6 20 20)");
  const letter = document.createElementNS(ns, "text");
  letter.setAttribute("class", "dc-letter");
  letter.setAttribute("x", 13.6);
  letter.setAttribute("y", 15.5);
  letter.setAttribute("font-size", 7.5);
  letter.textContent = "A";
  g.appendChild(letter);
  const heart = document.createElementNS(ns, "path");
  heart.setAttribute("class", "dc-heart");
  heart.setAttribute(
    "d",
    "M20 27.5c-3.6-2.6-5.8-4.9-5.8-7.6 0-2 1.5-3.4 3.3-3.4 1.1 0 2 .5 2.5 1.4.5-.9 1.4-1.4 2.5-1.4 1.8 0 3.3 1.4 3.3 3.4 0 2.7-2.2 5-5.8 7.6z"
  );
  g.appendChild(heart);
  svg.appendChild(g);
  return svg;
}

// Icona mazziere + numero di mani rimaste (vedi handsRemainingBeforeReshuffle)
// in un unico contenitore "pillola", invece di due badge separati affiancati
// (richiesto dall'utente dopo aver visto i due badge distinti in v5.24).
function dealerBadge(handsLeft) {
  return el(
    "span",
    { class: "dealer-badge", title: `Mazziere · mani rimaste prima del rimescolamento: ${handsLeft}` },
    dealerIcon(false),
    el("span", { class: "dealer-badge-count" }, String(handsLeft))
  );
}

// Pallini accanto al nome di ogni giocatore: uno per ogni pedina non ancora
// entrata in gioco (vedi sotto). Prima c'erano sempre 4 pallini con 3 stati
// (base/fuori/casa), poco leggibili così piccoli.
function miniPawnsRow(pawnPositions, color) {
  const hex = { red: "#D9636B", green: "#3FA77E", yellow: "#E3AC33", blue: "#3E8FCB" }[color];
  const darkHex = { red: "#B8434B", green: "#29765A", yellow: "#B3801E", blue: "#2A6B98" }[color];
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 100 22");
  svg.setAttribute("class", "mini-pawns");
  const defs = document.createElementNS(ns, "defs");
  const gradId = "pawn-grad-" + color + "-" + Math.random().toString(36).slice(2, 8);
  const grad = document.createElementNS(ns, "radialGradient");
  grad.setAttribute("id", gradId);
  grad.setAttribute("cx", "33%");
  grad.setAttribute("cy", "28%");
  grad.setAttribute("r", "75%");
  const stops = [
    ["0%", "#ffffff"],
    ["52%", hex],
    ["100%", darkHex],
  ];
  stops.forEach(([offset, stopColor]) => {
    const stop = document.createElementNS(ns, "stop");
    stop.setAttribute("offset", offset);
    stop.setAttribute("stop-color", stopColor);
    grad.appendChild(stop);
  });
  defs.appendChild(grad);
  svg.appendChild(defs);
  // v5.31: i pallini indicano SOLO quante pedine non sono ancora in gioco
  // (ferme alla partenza, pos === -1) — chiesto: le pedine sul tabellone e
  // quelle a casa si vedono già sul tabellone. Quattro posti fissi (la
  // pillola non cambia larghezza), riempiti partendo dal lato della pillola
  // opposto al nome (per chi sta a destra l'SVG è specchiato, quindi vale
  // per tutti allo stesso modo).
  const notInPlay = pawnPositions.filter((pos) => pos === -1).length;
  svg.setAttribute("aria-label", `${notInPlay} pedine non ancora in gioco`);
  for (let i = 0; i < notInPlay; i++) {
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", 12 + (3 - i) * 25);
    c.setAttribute("cy", 11);
    c.setAttribute("r", 8);
    c.setAttribute("fill", `url(#${gradId})`);
    c.setAttribute("stroke", hex);
    c.setAttribute("stroke-width", 2.2);
    svg.appendChild(c);
  }
  return svg;
}

// ---------------- Turn / hand ----------------

function formatElapsed(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

let turnTimerInterval = null;
function ensureTurnTimerRunning() {
  if (turnTimerInterval) return;
  turnTimerInterval = setInterval(() => {
    const span = document.getElementById("turn-timer");
    if (!span || !currentState || currentState.phase !== "playing" || !currentState.turnStartedAt) return;
    span.textContent = formatElapsed(Date.now() - currentState.turnStartedAt);
  }, 1000);
}

function renderTurnIndicator(state) {
  const wrap = $("#turn-indicator");
  if (!wrap) return; // schermata di gioco non presente (es. timer/ritardo dopo essere usciti dal tavolo)
  wrap.innerHTML = "";
  if (state.phase !== "playing") return;
  if (replayViewPawns || replayNoteText) {
    renderReplayBar(wrap);
    return;
  }
  ensureTurnTimerRunning();
  const active = activeColorFor(state, myColor);
  const isMyTurn = state.turnColor === myColor;
  const elapsedNow = state.turnStartedAt ? Date.now() - state.turnStartedAt : 0;
  const turnLineEl = el(
    "div",
    { class: "turn-line" + (isMyTurn ? " my-turn" : "") },
    el("span", { class: "swatch swatch-" + state.turnColor }),
    el("span", { class: "turn-av swatch-" + state.turnColor }, (playerName(state, state.turnColor) || "?").trim().charAt(0).toUpperCase()),
    // v5.31: quando tocca a te c'è già "▶ Tocca a te" accanto, quindi basta
    // il nome (più grande): con "Turno di" davanti i nomi lunghi venivano
    // tagliati ("Turno di Giulia…", in Arcade spariva del tutto).
    el("strong", { class: "turn-name" }, isMyTurn ? playerName(state, state.turnColor) : ` Turno di ${playerName(state, state.turnColor)}`),
    isMyTurn
      ? el(
          "span",
          { class: "you-badge-strong" },
          active === myColor ? "▶ Tocca a te" : `▶ Muovi ${playerName(state, active)}`
        )
      : "",
    el("span", { id: "turn-timer", class: "turn-timer" }, formatElapsed(elapsedNow))
  );
  wrap.appendChild(turnLineEl);
  updateActiveBaseGlow(state.turnColor);
}

// Le pedine in gioco di chi ha il turno pulsano piano (al posto dell'anello sulla base).
function updateActiveBaseGlow(color) {
  try {
    const svg = document.querySelector("#board-wrap svg");
    if (!svg) return;
    svg.querySelectorAll(".base-glow").forEach((n) => n.remove());
    svg.querySelectorAll(".pawn.pawn-turn").forEach((p) => p.classList.remove("pawn-turn"));
    if (!color) return;
    svg.querySelectorAll('.pawn[data-color="' + color + '"]').forEach((p) => p.classList.add("pawn-turn"));
  } catch (e) {}
}

// L'ultima carta giocata (da chiunque, non solo dagli avversari) è mostrata
// al centro del tabellone invece che in un riquadro di testo a parte
// (chiesto): un badge con l'iniziale di chi l'ha giocata (colorata) +
// mini-carta, utile per non dover aprire il registro (ora chiuso di
// default) solo per vedere cos'ha appena giocato un altro giocatore.
// Indicatore del Jack sulla carta centrale: le due pedine scambiate (colore e
// pallini esatti) con ⇄ in mezzo, sulla faccia della carta, per ~4s. Tracciato
// in locale (id visto + scadenza) così all'ingresso/ricarica non riparte.
const _jackOv = { seenId: null, shownId: null, until: 0, timer: null };
const JACK_OV_MS = 4500;
function buildJackOverlay(swap) {
  const HEX = { red: "#D9636B", green: "#3FA77E", yellow: "#E3AC33", blue: "#3E8FCB" };
  const ns = "http://www.w3.org/2000/svg";
  const mk = (c, i) => {
    const sv = document.createElementNS(ns, "svg");
    sv.setAttribute("viewBox", "-22 -22 44 44");
    sv.setAttribute("width", 25); sv.setAttribute("height", 25);
    sv.style.cssText = "overflow:visible;display:block;flex:none";
    sv.appendChild(buildPawnGroup(c, i, 15));
    return sv;
  };
  // Una "pillola" al centro della carta (solo sul simbolo in filigrana): gli
  // indici negli angoli (valore e seme del J) restano leggibili.
  return el("div", { class: "jack-overlay" },
    el("div", { class: "jack-chip a", style: "--c:" + HEX[swap.a.color] }, mk(swap.a.color, swap.a.pawnIndex)),
    el("span", { class: "jack-overlay-arrow" }, "⇄"),
    el("div", { class: "jack-chip b", style: "--c:" + HEX[swap.b.color] }, mk(swap.b.color, swap.b.pawnIndex)));
}

// Carta giocata: parte dalla mano (se è la mia) o dal lato del giocatore e
// "scatta" sul mucchio al centro. Solo per una carta NUOVA vista dal vivo
// (non al primo caricamento, non nel replay). Se il render viene rifatto
// subito (altro aggiornamento di stato) l'animazione riparte da dove era.
const _cardFly = { id: null, t0: 0, from: null };
function flyCenterCard(cdEl, boardWrap, shownCard) {
  try {
    if (replayViewPawns || !shownCard || !shownCard.id || !cdEl.animate) return;
    if (_cardFly.id === null) { _cardFly.id = shownCard.id; return; }
    const now = Date.now();
    if (shownCard.id !== _cardFly.id) {
      _cardFly.id = shownCard.id; _cardFly.t0 = now; _cardFly.from = null;
      try { playSound("cardFlick"); } catch (e) {}
    } else if (now - _cardFly.t0 > 420) return;
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = cdEl.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (!_cardFly.from) {
      let ox, oy;
      const bw = boardWrap.getBoundingClientRect();
      const hw = document.getElementById("hand-wrap");
      if (shownCard.color === myColor && hw) {
        const h = hw.getBoundingClientRect(); ox = h.left + h.width / 2; oy = h.top + h.height / 2;
      } else {
        const left = shownCard.color === "red" || shownCard.color === "blue";
        const top = shownCard.color === "red" || shownCard.color === "green";
        ox = left ? bw.left + 40 : bw.right - 40;
        oy = top ? bw.top - 30 : bw.bottom + 30;
      }
      _cardFly.from = { dx: ox - cx, dy: oy - cy };
    }
    const remain = Math.max(60, 400 - (now - _cardFly.t0));
    const { dx, dy } = _cardFly.from;
    const k = remain / 400;
    cdEl.animate(
      [
        { translate: `${dx * k}px ${dy * k}px`, scale: String(0.55 + 0.45 * (1 - k)), rotate: `${-14 * k}deg`, opacity: 0.2 + 0.8 * (1 - k) },
        { translate: "0px 0px", scale: "1.08", rotate: "2deg", opacity: 1, offset: 0.8 },
        { translate: "0px 0px", scale: "1", rotate: "0deg", opacity: 1 },
      ],
      { duration: remain, easing: isArcade() ? "steps(7, end)" : "cubic-bezier(.2,.8,.3,1)" }
    );
  } catch (e) {}
}

function renderCenterDiscard(state) {
  const boardWrap = $("#board-wrap");
  if (!boardWrap) return;
  if (!state.lastCardPlayed && _cardFly.id === null) _cardFly.id = 0; // baseline: anche la PRIMA carta della partita vola
  // Nessun Jack ancora: baseline 0 (PRIMA del return sotto, che scatta quando
  // non c'è ancora nessuna carta giocata), così anche il PRIMO Jack della
  // partita viene mostrato invece di essere preso per "vecchio".
  if (!state.lastSwap && _jackOv.seenId === null) _jackOv.seenId = 0;
  const existing = boardWrap.querySelector(".center-discard");
  if (existing) existing.remove();
  const shownCard = replayViewPawns && replayViewCard ? { color: replayViewCard.color, card: replayViewCard.card, burned: false } : state.lastCardPlayed;
  if (!shownCard) return;
  const { color, card, burned } = shownCard;
  const hex = { red: "#D9636B", green: "#3FA77E", yellow: "#E3AC33", blue: "#3E8FCB" }[color];
  const initial = (playerName(state, color) || "?").trim().charAt(0).toUpperCase();
  // Pallino iniziali e fuoco sono FRATELLI della carta dentro
  // .center-discard, non più figli di .mini-card: dentro .mini-card il
  // filtro grayscale di .mini-card-burned li desaturava insieme alla
  // carta quando bruciata (segnalato: "non si vede bene il colore con la
  // iniziale") — da fratelli restano a piena saturazione. .center-discard
  // non ha padding/margine, quindi gli angoli combaciano comunque con
  // quelli della mini-carta (vedi i commenti su .initial-badge/
  // .mini-card-burn-badge in CSS).
  const sw = state.lastSwap;
  if (sw && sw.id) {
    if (_jackOv.seenId === null) _jackOv.seenId = sw.id; // primo render: vecchio, non mostrare
    else if (sw.id !== _jackOv.seenId) {
      _jackOv.seenId = sw.id; _jackOv.shownId = sw.id; _jackOv.until = Date.now() + JACK_OV_MS;
    }
  }
  // Le due pedine sopra la carta centrale per il Jack sono state tolte (richiesta): lo scambio
  // si vede già dall'animazione sul tabellone. Riattivabile rimettendo la condizione originale.
  const showJack = false;
  if (showJack) {
    clearTimeout(_jackOv.timer);
    _jackOv.timer = setTimeout(() => { const o = document.querySelector(".jack-overlay"); if (o) o.remove(); }, Math.max(50, _jackOv.until - Date.now()));
  }
  const cdEl =
    el(
      "div",
      { class: "center-discard", title: `${playerName(state, color)} ha ${burned ? "bruciato" : "giocato"}: ${card}` },
      burned ? el("div", { class: "center-flames" }, ...[[-30,1.5,0,-4],[-34,1.8,.5,4],[29,1.4,.9,5],[33,2,.3,-4],[-27,1.7,1.1,3],[31,1.6,1.3,-3],[-22,1.9,.7,-2],[24,1.7,1.6,3]].map(([x,d,dl,dx]) => el("span", { class: "spark", style: `--sx:${x}px;--sd:${d}s;--sl:${dl}s;--sd2:${dx}px` }))) : "",
      miniCardVisual(card, burned),
      showJack ? buildJackOverlay(sw) : "",
      el("span", { class: "initial-badge swatch-" + color }, initial)
    );
  boardWrap.appendChild(cdEl);
  flyCenterCard(cdEl, boardWrap, shownCard);
}

function miniCardVisual(card, burned) {
  const s = card.split("-")[1];
  const isRed = !!RED_SUITS[s];
  // Stessa carta (stesse classi e stessa facciata) di quelle in mano.
  return el(
    "div",
    { class: "card-btn center-card " + (isRed ? "suit-red" : "suit-black") + (burned ? " mini-card-burned" : "") },
    ...buildCardFace(card)
  );
}

// Evidenzia solo temporaneamente la carta appena ricevuta dal compagno (poi
// il bordo va tolto da solo) — tenuta fuori dallo state condiviso apposta:
// uno scadere legato all'orologio di CHI L'HA RICEVUTA (locale, un solo
// dispositivo) invece che confrontando timestamp tra dispositivi diversi,
// che è la stessa causa già vista con la mangiata che a volte non si
// animava per orologi non sincronizzati (vedi flashCapture).
const _receivedHighlight = { card: null, until: 0, animDone: null };
const RECEIVED_HIGHLIGHT_MS = 10000;

function applyHandFan() { /* carte dritte (ventaglio rimosso) */ }

function renderHand(state) {
  const wrap = $("#hand-wrap");
  if (!wrap) return; // schermata di gioco non presente (es. timer/ritardo dopo essere usciti dal tavolo)
  // Durante lo scambio le carte le disegna renderExchangeControls: se
  // renderHand (richiamata anche da un timer, vedi sotto) svuotasse qui
  // #hand-wrap, la mano spariva fino al prossimo aggiornamento dello stato.
  if (state.phase === "exchanging") { renderExchangeControls(state); return; }
  wrap.innerHTML = "";
  if (state.phase !== "playing") return;
  const isMyTurn = state.turnColor === myColor;
  const hand = state.hands[myColor] || [];
  const receivedCard = state.lastReceivedCard && state.lastReceivedCard[myColor];
  if (receivedCard && receivedCard !== _receivedHighlight.card) {
    _receivedHighlight.card = receivedCard;
    _receivedHighlight.until = Date.now() + RECEIVED_HIGHLIGHT_MS;
    setTimeout(() => { if (currentState) renderHand(currentState); }, RECEIVED_HIGHLIGHT_MS);
  } else if (!receivedCard) {
    _receivedHighlight.card = null;
    _receivedHighlight.until = 0;
    _receivedHighlight.animDone = null;
  }
  const highlightNow = receivedCard && receivedCard === _receivedHighlight.card && Date.now() < _receivedHighlight.until;
  // Animazione di arrivo: solo la prima volta che si disegna la mano dopo lo scambio
  const animKey = receivedCard ? receivedCard : null;
  const playAnim = !!(highlightNow && animKey && _receivedHighlight.animDone !== animKey);
  if (playAnim) { _receivedHighlight.animDone = animKey; try { playSound("cardSwap"); } catch (e) {} }
  _handRenderedAt = Date.now();
  hand.filter(Boolean).forEach((card, i) => {
    const btn = buildCardButton(card, isMyTurn, (e) => onCardClick(card, e), highlightNow && card === receivedCard);
    if (playAnim) {
      if (card === receivedCard) btn.classList.add("received-fly");
      else { btn.classList.add("deal-in"); btn.style.setProperty("--i", i); }
      setTimeout(() => btn.classList.remove("deal-in", "received-fly"), 1600);
    }
    wrap.appendChild(btn);
  });
  applyHandFan();
}

const RED_SUITS = { hearts: "♥", diamonds: "♦" };
const BLACK_SUITS = { clubs: "♣", spades: "♠" };

const SUIT_NAMES = { hearts: "hearts", diamonds: "diamonds", clubs: "clubs", spades: "spades" };

let suitGradientSeq = 0;
// Due set di forme: quelle "semplici" (senza gambo, viewBox stretta) per i
// semini piccoli — corner e griglia numerica — dove un dettaglio in più a
// 10px diventava solo rumore visivo e rendeva tutto meno pulito; quelle
// "glossy" (con gambo + gradiente) solo per il simbolo grande in filigrana
// di Asso/Figure, l'unico abbastanza grande da apprezzare il dettaglio.

function suitIconSvg(suit, size, glossy) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", glossy ? "0 0 24 26" : "0 0 24 24");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", (glossy ? GLOSSY_SUIT_PATHS : SIMPLE_SUIT_PATHS)[suit]);
  if (glossy) {
    suitGradientSeq += 1;
    const gid = "suitGrad" + suitGradientSeq;
    const defs = document.createElementNS(ns, "defs");
    const grad = document.createElementNS(ns, "linearGradient");
    grad.setAttribute("id", gid);
    grad.setAttribute("x1", "0%"); grad.setAttribute("y1", "0%");
    grad.setAttribute("x2", "100%"); grad.setAttribute("y2", "100%");
    const isRed = suit === "hearts" || suit === "diamonds";
    const stops = isRed
      ? [["0%", "#E8848F"], ["55%", "#C23B4A"], ["100%", "#96222F"]]
      : [["0%", "#5A5145"], ["55%", "#2E241A"], ["100%", "#120D08"]];
    stops.forEach(([off, color]) => {
      const stop = document.createElementNS(ns, "stop");
      stop.setAttribute("offset", off);
      stop.setAttribute("stop-color", color);
      grad.appendChild(stop);
    });
    defs.appendChild(grad);
    svg.appendChild(defs);
    path.setAttribute("fill", `url(#${gid})`);
    path.setAttribute("opacity", "0.9");
  } else {
    path.setAttribute("fill", "currentColor");
  }
  svg.appendChild(path);
  return svg;
}

// Facciata della carta (indice numero+seme nei due angoli + simbolo grande in
// filigrana): UNICA per le carte in mano e per quella al centro del
// tabellone, così hanno lo stesso aspetto (chiesto).
function buildCardFace(card) {
  const [r, s] = card.split("-");
  const cornerSuit = () => {
    const i = suitIconSvg(s, 10);
    i.setAttribute("class", "card-corner-suit");
    return i;
  };
  // Un unico simbolo grande in filigrana al centro per ogni carta (numeri
  // compresi, non solo figure/asso) — la griglia con il conteggio esatto
  // dei semi è stata provata ma restava troppo fitta/confusa alle
  // dimensioni di questa carta. Indice classico numero+seme impilato in
  // entrambi gli angoli.
  const faceContent = suitIconSvg(s, 32, true);
  faceContent.setAttribute("class", "card-center-watermark");
  faceContent.style.position = "absolute";
  faceContent.style.left = "50%";
  faceContent.style.top = "50%";
  faceContent.style.transform = "translate(-50%, -50%)";
  const cornerTl = el("span", { class: "card-corner card-corner-tl" }, r, cornerSuit());
  const cornerBr = el("span", { class: "card-corner card-corner-br" }, r, cornerSuit());
  return [cornerTl, faceContent, cornerBr];
}

function buildCardButton(card, enabled, onClick, highlighted) {
  const s = card.split("-")[1];
  const isRed = !!RED_SUITS[s];
  const [cornerTl, faceContent, cornerBr] = buildCardFace(card);
  return el(
    "button",
    {
      class: "card-btn " + (isRed ? "suit-red" : "suit-black") + (highlighted ? " received-highlight" : ""),
      disabled: !enabled,
      onclick: onClick,
    },
    cornerTl,
    faceContent,
    cornerBr
  );
}

function cardLabel(card) {
  const [r, s] = card.split("-");
  const suitSym = { hearts: "♥", diamonds: "♦", clubs: "♣", spades: "♠" }[s];
  return r + suitSym;
}

// A card is now always resolved in ONE turn: it either plays (possibly
// after picking among several pawns / a Jack target / a 7 split), or —
// if it genuinely has no legal use — it is burned right away. Either way
// the turn advances by exactly one card.
async function onCardClick(card, evt) {
  if (moveInFlight) {
    showToast("Aspetta, la mossa precedente è ancora in salvataggio...");
    return;
  }
  keepAudioAlive();
  if (replayViewPawns) exitReplay(); // si gioca sempre sulla posizione reale
  const active = activeColorFor(currentState, myColor);
  const options = legalMovesForCard(currentState, active, card);

  if (options.length === 0) {
    // v5.65: la carta senza mosse trema e si colora di rosso, poi la domanda.
    const btn = evt && evt.currentTarget;
    if (btn && btn.classList) {
      btn.classList.remove("card-bad"); void btn.offsetWidth; btn.classList.add("card-bad");
      try { playSound("fbFail"); } catch (e) {}
      await new Promise((resolve) => setTimeout(resolve, 480));
    }
    const ok = confirm(`"${cardLabel(card)}" non ha mosse legali ora: la bruci e passi il turno?`);
    if (btn && btn.classList) btn.classList.remove("card-bad");
    if (!ok) return;
    // Piccola animazione di "bruciatura" sulla carta cliccata, prima che
    // sparisca davvero dallo stato — invece di sparire di scatto.
    if (btn && btn.classList) {
      btn.classList.add("card-burning");
      await new Promise((resolve) => setTimeout(resolve, 600));
    }
    setMoveInFlight(true);
    try {
      await runUpdate((state) => {
        // Burn from the current turn's OWN hand (same fix as applyMove — see
        // its comment). Using `active` here was the bug: when a player's
        // pawns are all home and they're playing a partner's turn, the card
        // never actually left their hand, so it kept reappearing/blocking.
        burnOneCard(state, state.turnColor, card);
        advanceTurn(state);
      });
    } catch (e) {
      console.error(e); // runUpdate ha già mostrato un toast comprensibile
    } finally {
      setMoveInFlight(false);
    }
    return;
  }

  const opt = options[0];
  if (opt.type === "jack") {
    openJackPicker(active, card);
    return;
  }
  if (opt.type === "seven") {
    // Se una sola pedina può davvero ricevere passi (le altre sono
    // bloccate/a fine percorso-casa, vedi sevenPawnCanReceiveSteps) l'unica
    // distribuzione possibile è "tutti e 7 i passi su quella pedina": non
    // c'è nessuna vera scelta da fare, quindi si gioca direttamente senza
    // mostrare lo splitter — prima si controllava solo il numero grezzo di
    // pedine in gioco, che apriva comunque lo splitter (con una sola riga,
    // da portare a 7 a mano) ogni volta che le altre pedine in gioco erano
    // bloccate pur essendocene più di una sul tabellone.
    const eligible = currentState.pawns[active]
      .map((p, i) => i)
      .filter((i) => currentState.pawns[active][i] !== -1)
      .filter((i) => sevenPawnCanReceiveSteps(currentState, active, i));
    // Se è possibile che questo 7 mandi tutte le proprie pedine a casa a
    // metà giocata e proseguire coi passi rimasti sul compagno (vedi
    // sevenHasAnyLeftoverToPartner), c'è sempre una vera scelta da fare
    // (quanti passi tenere per sé, quale pedina del compagno usare per il
    // resto) — quindi non si salta mai lo splitter in quel caso.
    const leftoverPossible = sevenHasAnyLeftoverToPartner(currentState, active);
    if (!leftoverPossible && eligible.length === 1) {
      await playMove(active, card, { type: "seven", distribution: [{ pawnIndex: eligible[0], steps: 7 }] });
      return;
    }
    openSevenSplitter(active, card);
    return;
  }
  if (options.length === 1) {
    await playMove(active, card, opt);
    return;
  }
  showPawnChoice(active, card, options);
}

// A picker (pawn choice, Jack, or the 7 splitter) is shown as a centered
// overlay — fixed on screen — so it's always immediately visible without
// scrolling, regardless of where the person is on the page when it opens.
function ensurePickerBackdrop() {
  let bd = document.getElementById("picker-backdrop");
  if (!bd) {
    bd = document.createElement("div");
    bd.id = "picker-backdrop";
    bd.className = "picker-backdrop";
    bd.onclick = closePickerAnimated;
    document.body.appendChild(bd);
  }
  return bd;
}

// Blocca lo scroll della pagina sotto mentre un picker è aperto — non solo
// per correttezza (toccare "attraverso" il backdrop non deve muovere la
// pagina), ma perché è la vera causa del "salto" del tabellone segnalato
// aprendo il picker del 7: anche un piccolo scroll residuo fa nascondere la
// barra degli indirizzi di Safari su mobile, che cambia l'altezza reale
// della pagina (100dvh, vedi il commento su #app) e sposta il contenuto.
// Bloccando davvero lo scroll (invece di limitarsi a un overlay "fixed" con
// la pagina sotto ancora scrollabile) quel gesto non arriva mai alla
// pagina, quindi la barra degli indirizzi non si muove e il tabellone
// nemmeno. Tecnica standard cross-browser: body diventa esso stesso
// "fixed", con un offset negativo che compensa lo scroll già fatto, così
// visivamente non cambia nulla; allo sblocco si ripristina la posizione.
let _pickerScrollY = null;
function lockBodyScroll() {
  if (_pickerScrollY !== null) return; // già bloccato (es. un picker che ne sostituisce un altro)
  _pickerScrollY = window.scrollY || window.pageYOffset || 0;
  const s = document.body.style;
  s.position = "fixed";
  s.top = -_pickerScrollY + "px";
  s.left = "0";
  s.right = "0";
  s.width = "100%";
}
function unlockBodyScroll() {
  if (_pickerScrollY === null) return;
  const y = _pickerScrollY;
  _pickerScrollY = null;
  const s = document.body.style;
  s.position = "";
  s.top = "";
  s.left = "";
  s.right = "";
  s.width = "";
  window.scrollTo(0, y);
}

// v5.65: pannelli del gioco che "escono" dal pulsante toccato (⚙️, ≡, 💬,
// riga "Regolamento") e ci rientrano quando si chiudono con ✕ / Chiudi /
// tocco fuori. _pickerOrigin = l'elemento da cui si è aperto il pannello.
let _pickerOrigin = null;
function openPickerFrom(fromEl, openFn) {
  return vtGo(fromEl, "#picker-wrap", () => { openFn(); _pickerOrigin = fromEl || null; }, { noAuto: true });
}
function closePickerAnimated() {
  const o = _pickerOrigin, wrap = document.getElementById("picker-wrap");
  if (o && o.isConnected && wrap && wrap.childElementCount) return vtGo(wrap, o, closePicker, { noAuto: true });
  closePicker();
}

function openPicker(contentEl, opts) {
  const wrap = $("#picker-wrap");
  wrap.innerHTML = "";
  // Di norma il foglio è trasparente (vedi il commento CSS su
  // .picker-overlay), ma l'estrazione del mazziere mostra carte vere
  // sopra la griglia del tabellone: lì la trasparenza rendeva pedine e
  // scritte illeggibili (segnalato dall'utente), quindi quel picker
  // chiede esplicitamente lo sfondo pieno con opts.opaque.
  wrap.className = "picker-overlay" + (opts && opts.opaque ? " picker-opaque" : "");
  wrap.style.transform = ""; // azzera un eventuale trascinamento rimasto da un picker precedente
  const handleZone = el("div", { class: "picker-handle-zone" }, el("div", { class: "picker-handle" }));
  // handleZone + contentEl stanno in un contenitore interno scrollabile
  // (.picker-scroll), separato da quello con lo sfondo trasparente/sfocato
  // (.picker-overlay stesso) — vedi il commento CSS su backdrop-filter +
  // overflow-y sullo stesso elemento, che su iOS rompeva la trasparenza.
  const scroll = el("div", { class: "picker-scroll" }, handleZone, contentEl);
  wrap.appendChild(scroll);
  const bd = ensurePickerBackdrop();
  bd.classList.add("show");
  bd.style.opacity = "";
  lockBodyScroll();
  setupPickerDragToClose(wrap, handleZone);
}
function closePicker() {
  document.querySelectorAll(".pawn.pawn-candidate, .pawn.pawn-hot").forEach((p) => p.classList.remove("pawn-candidate", "pawn-hot"));
  const wrap = $("#picker-wrap");
  wrap.innerHTML = "";
  wrap.className = "";
  wrap.style.transform = "";
  const bd = document.getElementById("picker-backdrop");
  if (bd) {
    bd.classList.remove("show");
    bd.style.opacity = "";
  }
  unlockBodyScroll();
  _pickerOrigin = null;
  // Se era la chat ad essere aperta, torna a contare i messaggi non letti
  // da qui in avanti (no-op innocuo se non era la chat).
  if (chatPickerOpen) {
    chatPickerOpen = false;
    _chatFabRenderKey = null;
    if (currentState) renderChatFab(currentState.chat || []);
  }
  logPickerOpen = false;
  _sevenRowKeys = null;
}

// Gesto di trascinamento sulla maniglia del picker: segue il dito 1:1 verso
// il basso (transizione disattivata durante il trascinamento), e al
// rilascio o richiude il pannello (se trascinato oltre una certa soglia, o
// con un colpo secco anche se breve) o torna su di scatto. In precedenza
// trascinare "sbirciava" solo il tabellone sotto (senza chiudere davvero) —
// segnalato come un pannello che "si incastra": qui invece un trascinamento
// verso il basso chiude per davvero, come un normale foglio a comparsa.
// Solo la MANIGLIA ha questi listener (non tutto il pannello), quindi lo
// scroll del contenuto sotto — es. il regolamento, spesso più lungo di un
// avviso — resta lo scroll nativo del browser, non tocca questo gesto.
function setupPickerDragToClose(wrap, handleZone) {
  let dragging = false;
  let startY = 0;
  let startTime = 0;
  let sheetHeight = 0;

  const onDown = (evt) => {
    dragging = true;
    startY = evt.clientY;
    startTime = Date.now();
    sheetHeight = wrap.getBoundingClientRect().height || 1;
    wrap.style.transition = "none";
    if (handleZone.setPointerCapture) {
      try { handleZone.setPointerCapture(evt.pointerId); } catch (e) {}
    }
  };
  const onMove = (evt) => {
    if (!dragging) return;
    const next = Math.max(0, evt.clientY - startY); // solo verso il basso
    wrap.style.transform = `translateY(${next}px)`;
    const bd = document.getElementById("picker-backdrop");
    if (bd) bd.style.opacity = String(Math.max(0, 1 - (next / sheetHeight) * 1.15));
    evt.preventDefault();
  };
  const onUp = (evt) => {
    if (!dragging) return;
    dragging = false;
    wrap.style.transition = "";
    const delta = Math.max(0, evt.clientY - startY);
    const elapsedMs = Math.max(1, Date.now() - startTime);
    const speed = delta / elapsedMs; // px/ms — un colpo secco chiude anche se breve
    const pastThreshold = delta > Math.min(140, sheetHeight * 0.28);
    if (pastThreshold || speed > 0.6) {
      closePicker();
      return;
    }
    // Non abbastanza: torna su di scatto invece di restare a metà.
    wrap.style.transform = "";
    const bd = document.getElementById("picker-backdrop");
    if (bd) bd.style.opacity = "";
  };

  handleZone.addEventListener("pointerdown", onDown);
  handleZone.addEventListener("pointermove", onMove);
  handleZone.addEventListener("pointerup", onUp);
  handleZone.addEventListener("pointercancel", onUp);
}

// ---- Toast (sostituisce alert() per errori/messaggi) --------------------
// alert() nativo blocca l'intera pagina finché non lo chiudi — su mobile è
// particolarmente pesante (stile di sistema fuori tema, e può bloccare
// anche gli aggiornamenti in arrivo da Firebase mentre è aperto). Questo
// toast mostra lo stesso messaggio in un pannello in basso, con un tasto
// "OK" da toccare per chiuderlo (niente auto-dismiss: un errore importante
// — es. "non riesco a contattare il server" — non deve poter sparire da
// solo prima che l'utente l'abbia letto), ma senza bloccare nient'altro
// sotto. Le chiamate si accodano (come farebbero comunque una sequenza di
// alert() nativi, che si bloccano l'uno con l'altro) così due messaggi
// ravvicinati non si sovrappongono mai sullo schermo.
let toastQueue = [];
let toastShowing = false;

// Il tastino "i" nella riga menu in alto (chiesto, al posto della scritta
// fissa sotto Stanza/Squadra): mostra la versione a richiesta con lo
// stesso toast usato per gli altri messaggi, invece di occupare
// spazio in pagina in permanenza.
function showVersionInfo() {
  showToast(`Tock ${APP_VERSION}`);
}

function showToast(message) {
  toastQueue.push(message);
  if (!toastShowing) renderNextToast();
}

function ensureToastWrap() {
  let wrap = document.getElementById("toast-wrap");
  if (!wrap) {
    wrap = document.createElement("div");
    wrap.id = "toast-wrap";
    document.body.appendChild(wrap);
  }
  return wrap;
}

function renderNextToast() {
  if (toastQueue.length === 0) {
    toastShowing = false;
    const wrap = document.getElementById("toast-wrap");
    if (wrap) wrap.innerHTML = ""; // niente coda: non lasciare in giro l'ultimo box già dismesso (solo invisibile via CSS)
    return;
  }
  toastShowing = true;
  const message = toastQueue.shift();
  const wrap = ensureToastWrap();
  wrap.innerHTML = "";
  wrap.className = "toast-overlay";
  wrap.appendChild(
    el(
      "div",
      { class: "toast-box" },
      el("div", { class: "toast-text" }, message),
      el("button", { class: "toast-ok-btn", onclick: dismissToast }, "OK")
    )
  );
  // Un frame dopo l'inserimento, non nello stesso — altrimenti il browser
  // "unisce" partenza (opacity:0) e arrivo (show) in un solo passaggio e
  // l'animazione di comparsa non si vede mai.
  requestAnimationFrame(() => wrap.classList.add("show"));
}

function dismissToast() {
  const wrap = document.getElementById("toast-wrap");
  if (wrap) wrap.classList.remove("show");
  setTimeout(renderNextToast, 180); // lascia respirare la piccola animazione di uscita prima del prossimo in coda
}

// Trasforma un errore "tecnico" in una frase comprensibile da mostrare nel
// toast, invece del solito "Errore: " + e.message grezzo — che per un
// errore di rete o di permessi di Firebase è spesso un codice in inglese
// senza alcun contesto (es. "PERMISSION_DENIED", "Failed to fetch"). I
// nostri stessi errori "di gioco" (regole violate, nome già preso,
// transazione respinta — vedi es. updateState/applyJackSwap/
// sevenValidateDistribution) hanno già un messaggio scritto apposta per
// essere letto da un giocatore, quindi quello passa così com'è.
function describeError(e) {
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    return "sei offline: controlla la connessione e riprova.";
  }
  const code = ((e && e.code) || "").toString().toUpperCase();
  const msg = ((e && e.message) || "").toString();
  if (code === "PERMISSION_DENIED") {
    return "il server ha rifiutato la richiesta. Riprova, e se continua segnalalo.";
  }
  if (code === "UNAVAILABLE" || code === "NETWORK_ERROR" || /network|fetch|timeout/i.test(msg)) {
    return "non riesco a contattare il server. Controlla la connessione e riprova.";
  }
  return msg || "errore sconosciuto. Riprova.";
}
