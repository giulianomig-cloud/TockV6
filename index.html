<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Tock</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FBF5E9" />
<!-- Senza questo, Chrome su Android può attivare "Forza colori scuri" e
     reinterpretare algoritmicamente la palette crema/oro pensata per la
     modalità chiara (sfondo scurito, colori desaturati) — dichiarando che
     la pagina è progettata SOLO per light si evita che il browser tenti
     di "aiutare" scurendola da solo. --><meta name="color-scheme" content="light only" />
<!-- Applica subito (prima ancora che <body> venga disegnato) il tema
     scelto in precedenza, se scuro — così non si vede un lampo chiaro
     all'apertura prima che il resto del JS (in fondo al file) giri.
     Vedi applyTheme/initTheme più sotto per i dettagli. -->
<script>
try {
  if (localStorage.getItem("tock-theme") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
} catch (e) {}
try { const sk = localStorage.getItem("tock-skin"); if (sk === "wood" || sk === "night" || sk === "bright" || sk === "arcade") document.documentElement.setAttribute("data-skin", sk); } catch (e) {}
// Aspetto "rilievo 3D": acceso di default, si spegne dal pulsante 🧊 in home.
try {
  if (localStorage.getItem("tock-fx3d") !== "0") document.documentElement.classList.add("fx3d");
} catch (e) { document.documentElement.classList.add("fx3d"); }
</script>
<link rel="apple-touch-icon" sizes="180x180" href="icon-v6b-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tock" />
<style>
/* Font in locale (invece del link a Google Fonts) — il service worker
   mette in cache solo le risorse dello stesso dominio (vedi sw.js), quindi
   un font caricato da fonts.gstatic.com non veniva mai salvato: aprendo
   l'app installata offline "Tock" perdeva il carattere disegnato a mano e
   ripiegava sul cursive generico di sistema, diverso da telefono a
   telefono. File scaricati da @fontsource/permanent-marker (Apache 2.0) e
   @fontsource/plus-jakarta-sans (OFL-1.1): licenze in fonts/. Dalla v5.79 i file ci sono
   davvero (prima mancavano: niente carattere e sw.js non salvava nulla per l'offline). */
@font-face {
  font-family: 'Permanent Marker';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/permanent-marker-latin-400-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Plus Jakarta Sans';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('fonts/plus-jakarta-sans-latin-500-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Plus Jakarta Sans';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url('fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Plus Jakarta Sans';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/plus-jakarta-sans-latin-700-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Plus Jakarta Sans';
  font-style: normal;
  font-weight: 800;
  font-display: swap;
  src: url('fonts/plus-jakarta-sans-latin-800-normal.woff2') format('woff2');
}
:root {
  color-scheme: light only;
  --ink: #241C15;
  --cream: #FBF5E9;
  --panel: #FFFFFF;
  --panel-border: #E7DCC5;
  --gold: #C99A3A;
  --gold-deep: #9C7420;
  --gold-hover: #D6AA4A;
  --gold-metallic: linear-gradient(135deg, #F3D98A 0%, #C99A3A 45%, #9C7420 75%, #E9C572 100%);
  --muted: #A79A82;
  --muted-2: #8A7F6E;
  --muted-3: #5A5145;
  /* Testo/icone sopra sfondi dorati fissi (bottoni .primary, toast,
     banner) — NON cambia col tema (l'oro resta lo stesso in chiaro e
     scuro), a differenza di --ink che invece si inverte in dark mode.
     Tenerli separati evita che un bottone dorato finisca con testo
     chiarissimo su oro (illeggibile) quando si passa al tema scuro. */
  --ink-on-gold: #241C15;
  --red: #D9636B;
  --green: #3FA77E;
  --yellow: #E3AC33;
  --blue: #3E8FCB;
  /* Sfumatura tra i due colori della squadra — stesse tinte pastello già
     usate per le card "preso" nella scelta colore (.cc-*.cc-taken), così
     il menu in alto e la riga "chi sei" restano nello stesso linguaggio
     visivo del resto dell'app invece di introdurre colori nuovi. */
  /* Più marcate apposta (chiesto) di prima (#F7DCDE/#FBF1D8 e
     #DCEFE5/#DCE9F3, quasi bianche): ora la metà "Squadra" della pillola
     (vedi .room-team-team) risalta a dovere accanto alla metà "Stanza",
     rimasta a sfondo pieno neutro. */
  --team-a-gradient: linear-gradient(120deg, #F2AEB6 0%, #F5D989 100%);
  --team-b-gradient: linear-gradient(120deg, #A9DDBF 0%, #A9C9E8 100%);
}

* { box-sizing: border-box; }

html {
  background: var(--cream);
  color-scheme: light only;
}
html[data-theme="dark"] { color-scheme: dark only; }

body {
  margin: 0;
  min-height: 100%;
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--cream);
  color: var(--ink);
}
/* Il tocco su mobile disegna di suo un rettangolo grigio traslucido sopra
   il bottone toccato (il default del browser) — oltre a essere brutto,
   in scuro si sommava allo sfondo chiaro di alcuni :hover (vedi sopra) e
   contribuiva a rendere illeggibile il bottone appena premuto. Meglio
   disattivarlo e affidarsi solo ai nostri :hover/:active già pensati per
   ogni tema. */
button, a, [role="button"] { -webkit-tap-highlight-color: transparent; }
/* v5.79: pulsanti e campi con lo stesso carattere del resto dell'app (di loro usano quello del telefono) */
button, input, select, textarea { font-family: inherit; }

/* min-height: 100vh fa "saltare" leggermente il contenuto (es. il
   tabellone) quando si interagisce con un elemento fisso in basso come il
   picker del 7 — su mobile (Safari in particolare) l'interazione può far
   comparire/sparire la barra degli indirizzi, che cambia il valore di
   100vh e quindi l'altezza minima della pagina. 100dvh segue l'altezza
   REALE visibile in ogni momento invece di quella "massima teorica", ed
   è ignorato in automatico dai browser che non lo supportano (restano
   sul 100vh sopra come fallback). */
#app { max-width: 480px; margin: 0 auto; padding: calc(26px + env(safe-area-inset-top)) 20px 20px; min-height: 100vh; min-height: 100dvh; }

/* Distanze verticali COSTANTI (10px) tra tutti i blocchi della schermata di
   gioco: prima ogni blocco aveva un margine suo (6/10/16px). Ora decide solo
   il gap del contenitore; i blocchi vuoti non occupano spazio. */
.game-shell { display: flex; flex-direction: column; gap: 10px; }
.game-shell > * { margin: 0 !important; }
.game-shell > #conn-banner:empty, .game-shell > #dealer-draw-wrap:empty,
.game-shell > #start-wrap:empty, .game-shell > #exchange-wrap:empty { display: none; }
#chat-wrap { display: flex; flex-direction: column; gap: 10px; }
#chat-wrap > *, #chat-wrap .nudge-btn { margin: 0 !important; }
#turn-indicator > * { margin: 0 !important; }
/* Telefono in orizzontale: non si gioca, si chiede di ruotare. */
@media (orientation: landscape) and (max-height: 500px) {
  body:has(.game-shell)::before {
    content: "📱 Ruota il telefono in verticale per giocare";
    position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; background: var(--cream); color: var(--ink);
    font-weight: 800; font-size: 1.15rem; line-height: 1.4;
  }
  html[lang="en"] body:has(.game-shell)::before { content: "📱 Turn your phone upright to play"; }
}

/* Su schermi più larghi del telefono (tablet in verticale, es. iPad) fa
   crescere la colonna principale e i fogli/toast che condividono lo stesso
   max-width, invece di lasciarli piccoli in mezzo a bordi vuoti. Sotto i
   700px (qualsiasi telefono) questa regola non si applica: tutto resta
   identico a prima. */
@media (min-width: 700px) {
  #app, .picker-overlay, .toast-overlay { max-width: 640px; }
}

h1 { font-size: 1.4rem; margin: 0 0 4px; color: var(--ink); }
/* Il logo era prima ricostruito a mano con pallini CSS + testo + una
   "squiggle" SVG (rimasti come commento nella storia del file) — ora è
   direttamente il logo vero (logo.png), identico su tutti i dispositivi
   invece di essere una ricostruzione approssimata via codice. */
.app-logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; transform: rotate(-2deg); }
.app-logo-img { display: block; width: 170px; max-width: 50vw; height: auto; }
.sound-test-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.app-meta { font-size: 0.65rem; color: #A79A82; letter-spacing: 0.02em; opacity: 0.8; margin: 0; }
.muted { color: #8A7F6E; font-size: 0.9rem; }

.lobby-card, .start-card {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
  box-shadow: none;
}

/* Scambio alla cieca: qui il mockup (Scambio.dc.html) vuole INVECE una
   card bianca a sé per l'intestazione/stato, diversa dalla sala d'attesa
   — non riusa .start-card (ormai trasparente) ma una classe propria. */
.exchange-line { justify-content: space-between; }
.exchange-dots { display: inline-flex; gap: 7px; margin-left: auto; }
.exchange-dot {
  position: relative; width: 24px; height: 24px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 800; color: #fff;
}
.exchange-dot-red { background: #D9636B; }
.exchange-dot-green { background: #3FA77E; }
.exchange-dot-yellow { background: #E3AC33; color: #3B2A0E; }
.exchange-dot-blue { background: #3E8FCB; }
/* Tutti i cerchietti sempre ben visibili (colore pieno, bordo chiaro);
   la spunta compare solo quando quel giocatore ha davvero scelto/scambiato. */
.exchange-dot { box-shadow: 0 0 0 2px rgba(255,255,255,0.85), 0 1px 4px rgba(0,0,0,0.3); }
.exchange-dot.waiting { opacity: 1; }
.exchange-dot-check.pending { display: none; }
.exchange-dot-check { opacity: 1; }
.exchange-dot-check.pending { background: #B9B09F; }
.exchange-dot-check {
  position: absolute; right: -4px; bottom: -4px; width: 13px; height: 13px; border-radius: 50%;
  background: #4E9770; color: #fff; font-size: 0.55rem; line-height: 13px; text-align: center;
  border: 1.5px solid var(--panel);
}
.exchange-card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 12px 14px;
  /* Prima non aveva margine sopra: subito dopo la riga di nomi/pedine
     sotto il tabellone restava "attaccata" (segnalato), con solo i 6px di
     .board-players-row a separarla. */
  margin: 10px 0 14px;
}
/* Titolo un filo meno ingombrante nel riquadro ora più compatto (chiesto:
   "meno invadente" — vedi mockup a 3 varianti condivisi in chat). */
.exchange-card-title { font-weight: 700; font-size: 0.82rem; }
.exchange-card p { margin: 0 0 6px; }
.exchange-card p:last-child { margin-bottom: 0; }
.exchange-pill-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.72rem; font-weight: 700; margin-top: 6px; }
.exchange-pill-row:first-of-type { margin-top: 10px; }
.exchange-pill-lead { color: var(--muted-3); }
.exchange-pill-lead.done { color: #4E9770; }
/* Badge di spunta al posto dell'emoji ✅ — un pallino pieno con icona SVG
   in tinta, come gli altri indicatori dell'app (log-dot, icon-btn), invece
   di un emoji che stona con lo stile grafico del resto. */
.exchange-done-line { display: flex; align-items: center; gap: 8px; }
.exchange-done-badge {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  background: #4E9770;
}
.exchange-pill {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 999px; padding: 3px 9px 3px 6px;
}
.exchange-pill .swatch { width: 7px; height: 7px; margin: 0; }
.exchange-pill.done { background: #E7F4EC; }
.exchange-pill.waiting { background: #FBF1D8; }
.exchange-label {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--muted-3); margin-bottom: 10px;
}

/* Intestazione delle schermate di sala d'attesa: logo (pallini + scritta)
   a sinistra, pulsante "Invita" a destra sulla stessa riga — invece del
   vecchio titolo centrato + bottone a tutta larghezza sotto. */
.lobby-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}
.lobby-header-row .app-logo {
  align-items: flex-start;
  margin-bottom: 0;
}
.lobby-header-row .app-logo-img { width: 104px; max-width: 34vw; }

/* Stanza "C · Squadre" (v5.46) */
.room-teams { margin-bottom: 16px; }
.room-team { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px; overflow: hidden; }
.room-team-head { padding: 9px 14px; font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-3); background: rgba(201,154,58,.08); }
.room-seat { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--panel-border); }
.room-seat.rs-mine { background: rgba(201,154,58,.13); }
.room-seat.rs-pending .room-seat-name { font-style: italic; color: var(--muted-2); }
.room-dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: .78rem; font-weight: 900; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
.rs-free .room-dot, .rs-pending .room-dot { opacity: .55; }
.room-seat-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.room-seat-name { font-weight: 800; color: var(--ink); font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-seat-sub { font-size: .72rem; font-weight: 700; color: var(--muted-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-chip { all: unset; box-sizing: border-box; cursor: pointer; flex-shrink: 0; text-align: center; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--panel-border); background: var(--panel); font-size: .78rem; font-weight: 800; color: var(--ink); white-space: nowrap; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.room-chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.room-chip-bot { padding: 7px 10px; }
.room-chip.room-chip-sit, .room-chip.room-chip-sit * { background: var(--gold); border-color: var(--gold); color: var(--ink-on-gold); }
.room-chip.room-chip-sit { padding: 7px 16px; }
.room-vs { display: flex; align-items: center; gap: 10px; margin: 8px 0; color: var(--muted-3); font-size: .72rem; font-weight: 900; letter-spacing: .1em; }
.room-vs::before, .room-vs::after { content: ""; flex: 1; height: 1px; background: var(--panel-border); }
html.fx3d .room-team { background: linear-gradient(165deg, #FFFFFF 0%, #FBF5E6 60%, #F3E9D0 100%); border-color: #D9CBA8; box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 3px 0 #D2C093, 0 8px 10px -4px rgba(60,40,10,.35); }
html.fx3d[data-theme="dark"] .room-team { background: linear-gradient(165deg, #30281E 0%, #261F17 100%); border-color: #4F4030; box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 3px 0 #0E0B08, 0 8px 10px -4px rgba(0,0,0,.65); }
@media (pointer: coarse) { .lobby-card > .lobby-header-row:first-child { margin-top: max(0px, calc(50px - env(safe-area-inset-top, 0px))); } }
/* "Etichetta" bianca con il codice stanza, come nel mockup — al posto del
   codice infilato nel paragrafo di istruzioni. */
.room-tag {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 22px;
  width: fit-content;
}
.room-tag-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted-3);
}
.room-tag-code { font-size: 1.05rem; font-weight: 800; letter-spacing: 0.04em; color: var(--ink); }
/* Testata piccola (v5.51): etichetta del codice accanto al logo, non sotto. */
.small-header { align-items: center; margin-bottom: 18px; }
.small-header .room-tag { margin-bottom: 0; }

#room-input, #name-input,
#torneo-code-input, #torneo-organizer-name, #torneo-join-name, #torneo-join-partner {
  width: 100%;
  padding: 14px 16px;
  font-size: 1rem;
  font-weight: 600;
  border: 1.5px solid var(--panel-border);
  border-radius: 14px;
  margin: 8px 0;
  background: var(--panel);
  color: var(--ink);
}
#room-input:focus, #name-input:focus,
#torneo-code-input:focus, #torneo-organizer-name:focus, #torneo-join-name:focus, #torneo-join-partner:focus {
  outline: 2px solid var(--gold); outline-offset: 1px;
}
#room-input, #torneo-code-input { text-transform: uppercase; }

/* Autocomplete della rubrica giocatori (v5): elenco a discesa che filtra
   mentre si digita, agganciato subito sotto il campo nome. position:
   relative sul wrapper + absolute sulla lista, così non sposta il resto
   della schermata quando appare/scompare. */
.name-autocomplete-wrap { position: relative; }
.name-autocomplete-list {
  position: absolute;
  left: 0; right: 0; top: calc(100% - 4px);
  z-index: 20;
  background: var(--panel);
  border: 1.5px solid var(--panel-border);
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  overflow: hidden;
  max-height: 220px;
  overflow-y: auto;
}
.name-autocomplete-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 11px 16px;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink);
  background: none;
  border: none;
  border-bottom: 1px solid var(--panel-border);
  cursor: pointer;
}
.name-autocomplete-item:last-child { border-bottom: none; }
.name-autocomplete-item:hover, .name-autocomplete-item:focus { background: var(--panel-2, rgba(0,0,0,0.04)); }
:root[data-theme="dark"] .name-autocomplete-item:hover,
:root[data-theme="dark"] .name-autocomplete-item:focus { background: #3A2F22; }

/* Squadre raggruppate visivamente: le due pedine dello stesso team stanno
   nello stesso riquadro tratteggiato, con un badge "VS" al centro tra i
   due riquadri — così si capisce subito chi gioca con chi. */
/* Griglia unica 2x2 (non più due grid separate per squadra): così le due
   card sulla stessa riga (es. rosso+verde, giallo+blu) condividono sempre
   la stessa altezza — con due grid indipendenti una card senza pulsante
   bot sotto (es. il tuo colore già scelto) restava più bassa di quella
   affiancata, con le dimensioni visibilmente diverse. */
.teams-grid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 10px 14px; margin-bottom: 16px; position: relative; }
/* Filo verticale dietro le due card della stessa colonna (stessa squadra:
   rosso+giallo a sinistra, verde+blu a destra — vedi TEAM_OF) per far
   capire a colpo d'occhio che sono in coppia, senza toccare le dimensioni
   delle card: sta DIETRO (z-index sotto quello di .color-cell) quindi si
   vede solo nello spazio vuoto tra le due card, come se le collegasse.
   Posizionato in assoluto (non come cella della grid, per non "rubare"
   una riga all'auto-placement) — il centro di ogni colonna, con due
   colonne 1fr e 14px di gap tra loro, è a calc(25% - metà gap) e
   calc(75% + metà gap) rispetto al contenitore. */
.team-thread {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 3px;
  margin-left: -1.5px;
  border-radius: 2px;
  z-index: 0;
}
.team-thread-a { left: calc(25% - 3.5px); background: linear-gradient(180deg, var(--red), var(--yellow)); }
.team-thread-b { left: calc(75% + 3.5px); background: linear-gradient(180deg, var(--green), var(--blue)); }
.vs-badge {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--panel);
  border: 1.5px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 8px rgba(90,65,20,0.18);
  z-index: 2;
}
.vs-badge span {
  color: var(--muted-3);
  font-weight: 800;
  font-size: 0.62rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

/* Ogni riquadro colore è un'unica card (bordo tratteggiato se libero, bordo
   pieno se preso/scelto) che contiene sia il pallino+nome sia — quando
   libero — i pulsanti "assegna al computer": prima erano due blocchi
   separati (bottone + div sotto), ora sono un solo riquadro come nel mockup. */
.color-cell {
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  padding: 13px;
  background: var(--panel);
  border: 1.5px solid var(--panel-border);
  position: relative;
  z-index: 1; /* sopra il filo .team-thread, che deve restare dietro */
  /* Altezza fissa (non solo un minimo) uguale al contenuto più alto
     possibile (libero, con etichetta + due pulsanti impilati) — così le
     quattro card restano identiche SEMPRE, in ogni stato e combinazione,
     non solo tra le due della stessa riga. */
  min-height: 178px;
  height: 178px;
  transition: border-color .12s ease, background .12s ease, transform .12s ease;
}
/* Il pulsante bot (quando c'è) va in fondo alla card, non subito sotto al
   nome — così tutte e quattro le card restano della stessa altezza anche
   quando una (es. il tuo colore già scelto) non ha nessun pulsante sotto. */
.color-cell > .bot-cell-assign, .color-cell > .bot-btn-remove { margin-top: auto; padding-top: 10px; }
.bot-assign-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin-bottom: 5px; }
/* Libero: prima era solo un bordo tratteggiato su sfondo bianco (tanto
   vuoto, poco invitante); ora bordo pieno più leggero + una leggerissima
   tinta del colore, così la card si distingue subito anche da lontano. */
.color-cell.cc-red.cc-free { border-color: #EDD3D5; background: #FDF6F6; }
.color-cell.cc-green.cc-free { border-color: #D7E9DF; background: #F4FAF7; }
.color-cell.cc-yellow.cc-free { border-color: #F1E4BB; background: #FDFAEF; }
.color-cell.cc-blue.cc-free { border-color: #D7E6F0; background: #F4F9FC; }
/* In scelta da un altro giocatore proprio in questo momento (vedi
   reserveColorPending) — non ancora "preso" per davvero (quello succede
   solo quando qualcuno preme "Entra nella stanza", protetto da
   transazione), ma un piccolo avviso subito evita che due persone
   scelgano lo stesso colore senza accorgersene finché una delle due non
   perde la conferma finale (bug segnalato). Resta cliccabile: è solo un
   avviso, non un blocco vero. */
.color-cell.cc-pending { border-style: dashed; border-width: 1.5px; }
.color-cell.cc-red.cc-pending { border-color: #E3ABB0; background: #FDF6F6; }
.color-cell.cc-green.cc-pending { border-color: #9FCFB4; background: #F4FAF7; }
.color-cell.cc-yellow.cc-pending { border-color: #EFDFB0; background: #FDFAEF; }
.color-cell.cc-blue.cc-pending { border-color: #9EC3DE; background: #F4F9FC; }
.cc-pending .color-card-free-label { font-style: italic; }
.pending-hint { font-style: italic; }
.color-cell.cc-taken {
  border-style: solid;
  border-width: 1.5px;
}
.color-cell.cc-red.cc-taken { background: #F7DCDE; border-color: #E3ABB0; }
.color-cell.cc-green.cc-taken { background: #DCEFE5; border-color: #9FCFB4; }
.color-cell.cc-yellow.cc-taken { background: #FBF1D8; border-color: #EFDFB0; }
.color-cell.cc-blue.cc-taken { background: #DCE9F3; border-color: #9EC3DE; }
.color-cell.cc-mine {
  border-style: solid;
  border-width: 2px;
  transform: scale(0.98);
}
.color-cell.cc-red.cc-mine { background: #F7DCDE; border-color: var(--red); }
.color-cell.cc-green.cc-mine { background: #DCEFE5; border-color: var(--green); }
.color-cell.cc-yellow.cc-mine { background: #FBF1D8; border-color: var(--yellow); }
.color-cell.cc-blue.cc-mine { background: #DCE9F3; border-color: var(--blue); }

.color-card-check {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.color-cell.cc-red .color-card-check { background: var(--red); }
.color-cell.cc-green .color-card-check { background: var(--green); }
.color-cell.cc-yellow .color-card-check { background: var(--yellow); }
.color-cell.cc-blue .color-card-check { background: var(--blue); }

.color-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  border: none;
  background: transparent;
  padding: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.color-btn:disabled { cursor: default; }
.color-card-dot {
  display: block;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  margin-bottom: 8px;
  background: currentColor;
}
.cc-free .color-card-dot { opacity: 0.85; }
.color-red .color-card-dot, .cc-red .color-card-dot { color: var(--red); }
.color-green .color-card-dot, .cc-green .color-card-dot { color: var(--green); }
.color-yellow .color-card-dot, .cc-yellow .color-card-dot { color: var(--yellow); }
.color-blue .color-card-dot, .cc-blue .color-card-dot { color: var(--blue); }
.color-card-name { font-size: 0.88rem; font-weight: 800; color: var(--ink); }
.color-card-sub { font-size: 0.7rem; font-weight: 700; margin-top: 2px; }
.cc-red .color-card-sub { color: #A5424A; }
.cc-green .color-card-sub { color: #2C7A54; }
.cc-yellow .color-card-sub { color: #A5842B; }
.cc-blue .color-card-sub { color: #2E6690; }
.color-card-free-label { font-size: 0.86rem; font-weight: 800; color: var(--muted-3); margin-bottom: 8px; }
.bot-btn {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 7px 6px;
  border-radius: 999px;
  border: 1px solid var(--panel-border);
  background: var(--panel);
  color: var(--muted-3);
  cursor: pointer;
}
.bot-btn:hover { background: var(--cream); }
.bot-btn:active { transform: translateY(1px); }
.bot-btn-remove { color: #A5424A; border-color: #e0b3a8; background: var(--panel); }
/* Due pulsanti affiancati (Normale/Difficile) al posto di uno solo, quando
   il posto va assegnato al computer — vedi botCell/renderStartControls. */
.bot-btn-row { display: flex; flex-direction: column; gap: 6px; }
.bot-btn-row .bot-btn { width: 100%; padding: 7px 4px; }

/* Pulsanti "assegna al computer" per i posti ancora liberi, mostrati nella
   sala d'attesa (dopo essere entrati) invece che solo nella lobby iniziale. */
.missing-bots-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }

.color-red { color: var(--red); }
.color-green { color: var(--green); }
.color-yellow { color: var(--yellow); }
.color-blue { color: var(--blue); }

/* ---- modalità stanza: manuale / estrazione ---- */
.mode-choice { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.mode-btn {
  padding: 16px 16px;
  border-radius: 16px;
  border: 1.5px solid var(--panel-border);
  background: var(--panel);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
}
.mode-btn:hover { border-color: var(--gold); box-shadow: 0 6px 16px -10px rgba(201,154,58,0.5); }
.mode-btn:active { border-color: var(--gold); transform: translateY(1px); }
.mode-btn .mt { font-weight: 800; font-size: 0.94rem; margin-bottom: 3px; color: var(--ink); }
.mode-btn .ms { font-size: 0.78rem; color: #8A7F6E; line-height: 1.4; }
.mode-btn-selected { border-color: var(--gold); background: #F3EBD8; box-shadow: 0 6px 16px -10px rgba(201,154,58,0.5); }

/* ---- sala d'attesa (modalità estrazione) ---- */
.waiting-list { list-style: none; padding: 0; margin: 10px 0; }
.waiting-list li {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: var(--panel); border: 1.5px solid var(--panel-border);
  border-radius: 12px; margin-bottom: 6px; font-size: 0.88rem; font-weight: 700;
  color: var(--ink);
}
.waiting-list li.pending { opacity: 0.55; font-weight: 500; font-style: italic; background: transparent; border-style: dashed; }
.waiting-list li .wname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.waiting-list li .bot-btn-remove { flex-shrink: 0; margin-left: 8px; padding: 2px 8px; font-size: 0.72rem; }
.wdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
.wdot.off { background: #C7BCA4; }

/* ---- estrazione coppie ---- */
.player-slot {
  padding: 11px 6px; border-radius: 12px; font-weight: 800; text-align: center;
  min-height: 18px; display: flex; align-items: center; justify-content: center;
  font-size: 0.87rem; background: var(--panel); border: 1.5px solid var(--panel-border); color: var(--ink);
}
.player-slot.spinning { animation: slotShake 0.12s linear infinite; }
@keyframes slotShake { 0% { transform: translateX(-1px); } 50% { transform: translateX(1px); } 100% { transform: translateX(-1px); } }
.team-group.ready { animation: teamReadyGlow 1s ease-in-out infinite; }
@keyframes teamReadyGlow {
  0%, 100% { box-shadow: 0 0 6px 1px rgba(201,154,58,0.4); }
  50% { box-shadow: 0 0 18px 5px rgba(201,154,58,0.7); }
}

/* ---- scelta accoppiata colori / colore personale ---- */
.pair-choice, .solo-choice { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.solo-choice { flex-direction: row; }
.pair-btn, .solo-btn {
  padding: 16px; border-radius: 16px; border: none; font-weight: 800;
  font-size: 0.9rem; cursor: pointer; color: white; display: flex; align-items: center;
  justify-content: center; gap: 8px; text-align: center;
  box-shadow: 0 6px 16px -8px rgba(90,65,20,0.35);
  transition: transform 0.08s ease, filter 0.1s ease;
}
.pair-btn:hover, .solo-btn:hover { filter: brightness(1.05); }
.pair-btn:active, .solo-btn:active { transform: translateY(1px); }
.solo-btn { flex: 1; }
.solo-btn:disabled { opacity: 0.45; cursor: default; }
.pair-ry { background: linear-gradient(90deg, var(--red), var(--yellow)); }
.pair-gb { background: linear-gradient(90deg, var(--green), var(--blue)); }
/* .color-* (righe più sopra) imposta solo il COLORE DEL TESTO — utile per
   badge/icone su sfondo chiaro, ma qui su .solo-btn (testo bianco fisso)
   serviva anche uno sfondo colorato: senza, il pulsante restava bianco su
   bianco (testo invisibile). */
.solo-btn.color-red { background: var(--red); }
.solo-btn.color-green { background: var(--green); }
.solo-btn.color-yellow { background: var(--yellow); }
.solo-btn.color-blue { background: var(--blue); }
.dot-sm { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1.5px solid rgba(255,255,255,0.7); flex-shrink: 0; }

/* ---- estrazione mazziere (asso di cuori) ---- */
.dealer-draw-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 18px 0 6px;
}
.dealer-slot {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 12px 6px 16px; border-radius: 12px; min-height: 92px;
  position: relative;
  background: transparent; border: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.dealer-slot-label {
  font-weight: 700; font-size: 0.78rem; color: var(--muted-3);
  display: flex; align-items: center; gap: 5px;
  flex-wrap: wrap; justify-content: center; text-align: center;
}
.dealer-slot-label .swatch { width: 8px; height: 8px; margin: 0; }
.dealer-slot.dealer-winner .dealer-slot-label { font-weight: 800; color: var(--ink); }
.dealer-slot.dealer-winner {
  animation: teamReadyGlow 1s ease-in-out infinite;
  border-radius: 14px;
}
.dealer-slot.dealer-winner::before {
  content: "👑"; position: absolute; top: -16px; font-size: 18px; left: 50%; transform: translateX(-50%);
}
/* La carta qui riusa .card-btn (stessa di quelle in mano), ma la formula
   "larghezza / 5" di .card-btn è pensata per una fila di 5 carte in mano
   — in questa griglia da 2 colonne, con UNA sola carta per slot, quella
   formula la faceva collassare quasi sempre al minimo (46px), molto più
   piccola e sproporzionata (filigrana enorme sulla carta minuscola)
   rispetto alle carte vere in partita (segnalato: "più brutte di quelle
   di gioco"). Qui la dimensione è fissa, uguale a quella massima delle
   carte in mano, non calcolata sulla larghezza dello slot. */
.dealer-slot .card-btn { width: 64px; max-width: 64px; min-width: 64px; }
.dealer-card-pop { animation: dealerCardPop 0.35s ease-out; }
@keyframes dealerCardPop {
  0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
  70% { transform: scale(1.08) rotate(2deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
/* Mazzetto coperto al centro dei 4 riquadri: ogni carta parte da qui, vola
   verso chi la pesca già scoperta (vedi animateDealerDraw). */
/* Mazzetto grande quanto le carte scoperte (64x90): le colonne si
   allargano per fargli posto e i nomi restano su una riga. */
.dealer-draw-grid { position: relative; column-gap: 66px; }
.dealer-draw-grid .dealer-slot-label { flex-wrap: nowrap; white-space: nowrap; }
.dealer-deck {
  position: absolute; left: 50%; top: 50%; width: 64px; height: 90px; margin: -45px 0 0 -32px;
  pointer-events: none; z-index: 1;
}
.dealer-deck span {
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 4px, transparent 4px 8px), linear-gradient(135deg, #B8434B, #7E2730);
  border: 2px solid #fff; border-radius: 6px; box-shadow: 0 2px 5px rgba(36,28,21,.3);
}
.dealer-deck span { position: absolute; inset: 0; }
.dealer-deck span:nth-child(1) { transform: translate(3px, 3px) rotate(4deg); }
.dealer-deck span:nth-child(2) { transform: translate(1.5px, 1.5px) rotate(-3deg); }
.dealer-slot .card-btn { position: relative; }
html[data-skin="arcade"] .dealer-deck span {
  background: repeating-linear-gradient(0deg, rgba(255,43,214,.35) 0 2px, transparent 2px 6px), #1a0c3a;
  border: 2px solid #ff2bd6; border-radius: 2px; box-shadow: 0 0 8px rgba(255,43,214,.6);
}
#dealer-draw-banner {
  text-align: center; margin-top: 14px; background: linear-gradient(135deg, #F3D98A, #D9A93E);
  color: #3B2A18; border: none; border-radius: 999px; padding: 10px 18px;
  font-size: 0.85rem; font-weight: 800; opacity: 0; transform: translateY(-6px);
  box-shadow: 0 8px 18px -10px rgba(180,130,20,0.55);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
#dealer-draw-banner.show { opacity: 1; transform: translateY(0); }

button.primary {
  width: 100%;
  padding: 17px 14px;
  font-size: 1rem;
  font-weight: 800;
  background: var(--gold);
  color: var(--ink-on-gold);
  border: none;
  border-radius: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease, background 0.08s ease;
  box-shadow: 0 8px 20px -8px rgba(201,154,58,0.55);
}
/* Link testuale senza bordo/sfondo, come "Cambia stanza" nel mockup —
   prima riusava lo stesso stile a pillola bianca dei pulsanti bot/suono,
   che nel mockup invece è un semplice link con icona. */
.text-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  color: var(--muted-3);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.text-link-btn:hover { color: var(--ink); }
button.primary:hover { background: var(--gold-hover); }
button.primary:active {
  transform: translateY(1px);
  filter: brightness(0.96);
}
button.primary:disabled {
  opacity: 0.4;
  cursor: default;
  box-shadow: none;
}

/* Anticipazione della home v5 (torneo): per ora solo un'anteprima NON
   cliccabile di cosa arriverà (elenco tornei + "Organizza un torneo"),
   così si vede la futura struttura senza che sembri già funzionante —
   vedi docs/v5-roadmap.md. */
.home-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 14px; }
.home-divider .hd-line { flex: 1; height: 1px; background: var(--panel-border); }
.home-divider .hd-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.section-label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-3); }
.v5-tag {
  font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--muted-2); background: #EFEAE0; border-radius: 999px; padding: 3px 8px; flex-shrink: 0;
}
.tourney-placeholder {
  box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1.5px dashed var(--panel-border); border-radius: 16px;
  padding: 16px; color: var(--muted); font-size: 0.82rem; font-weight: 600; text-align: center;
  margin-bottom: 14px;
}
.organize-btn-disabled {
  all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center;
  justify-content: center; gap: 8px; background: transparent; border: 1.5px dashed var(--panel-border);
  border-radius: 16px; padding: 12px 16px; color: var(--muted); cursor: default;
}
.organize-btn-disabled .plus-badge {
  display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px;
  border-radius: 50%; background: var(--muted); color: #FFFFFF; font-size: 0.8rem; font-weight: 800; line-height: 1;
}
/* Variante ATTIVA dello stesso riquadro tratteggiato — "Organizza un
   torneo" ora è cliccabile, non più un placeholder "in arrivo". */
.organize-btn {
  all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center;
  justify-content: center; gap: 8px; background: transparent; border: 1.5px dashed var(--gold);
  border-radius: 16px; padding: 12px 16px; color: var(--ink); font-weight: 700; cursor: pointer;
  transition: background .12s ease;
}
.organize-btn:hover { background: #F3EBD8; }
.organize-btn .plus-badge {
  display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px;
  border-radius: 50%; background: var(--gold); color: #FFFFFF; font-size: 0.8rem; font-weight: 800; line-height: 1;
}
/* Home "A · Tessere" (v5.46) */
.home-play { display: flex; gap: 8px; align-items: stretch; }
.home-play #room-input { flex: 1; min-width: 0; margin: 0; }
.home-play #continue-btn { width: auto; margin: 0; padding: 0 20px; white-space: nowrap; flex-shrink: 0; }
.home-hint { margin: 6px 2px 0; font-size: 0.78rem; color: var(--muted-2); }
.home-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 10px; }
.home-tile { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 14px; border-radius: 18px;
  background: var(--panel); border: 1px solid var(--panel-border); box-shadow: 0 6px 14px -10px rgba(60,40,10,.4); -webkit-tap-highlight-color: transparent; }
.home-tile:hover { border-color: var(--gold); }
.home-tile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.home-tile-em { font-size: 1.7rem; line-height: 1; }
.home-tile b { font-size: 0.98rem; color: var(--ink); }
.home-tile small { font-size: 0.74rem; color: var(--muted-2); }
.home-section { margin: 20px 0 8px; }
.tourney-group { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px; overflow: hidden; }
.tourney-group .tourney-row { margin: 0; border: none; border-radius: 0; background: transparent; }
.tourney-group .tourney-row + .tourney-row { border-top: 1px solid var(--panel-border); }
.tourney-group .tourney-row:hover { background: rgba(201,154,58,.08); }
.tourney-group .tourney-placeholder { border: none; margin: 0; }
.tourney-row.tourney-done { opacity: 0.8; }
.home-tools { display: flex; justify-content: center; gap: 16px; margin-top: 22px; }
.home-tool { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.66rem; font-weight: 700; color: var(--muted-2); }
.home-tool > button { margin: 0; }
.home-tool > .sound-test-btn { width: 31px; height: 31px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; line-height: 1; }
.home-meta { text-align: center; margin-top: 12px; }
html.fx3d .home-tile { background: linear-gradient(165deg, #FFFFFF 0%, #FBF5E6 60%, #F3E9D0 100%); border-color: #D9CBA8; box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 3px 0 #D2C093, 0 8px 10px -4px rgba(60,40,10,.35); }
html.fx3d[data-theme="dark"] .home-tile { background: linear-gradient(165deg, #30281E 0%, #261F17 100%); border-color: #4F4030; box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 3px 0 #0E0B08, 0 8px 10px -4px rgba(0,0,0,.65); }
/* Logo in cima: se il telefono non riserva spazio alla barra dell'ora
   (safe-area 0) il logo finiva sotto l'ora, dove l'iPhone sfuma il
   contenuto ("i pallini del logo sono sfocati"). Qui scende quanto basta;
   con la safe-area normale non cambia nulla. */
@media (pointer: coarse) { .lobby-card > .app-logo:first-child { margin-top: max(0px, calc(50px - env(safe-area-inset-top, 0px))); } }
/* Pagina del torneo (v5.48) */

.bx-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.bx-t { font-size: 1.05rem; font-weight: 800; color: var(--bx-ink); }
.bx-lb { grid-row: span 2; }
.bx-pod { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.bx-pod div { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; color: var(--bx-ink); min-width: 0; }
.bx-pod i { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: .72rem; font-weight: 800; color: #2B2016; }
.bx-pod .bx-m1 { background: linear-gradient(135deg, #F7DE91, #D4A63F); }
.bx-pod .bx-m2 { background: linear-gradient(135deg, #F1F1F1, #BDBDBD); }
.bx-pod .bx-m3 { background: linear-gradient(135deg, #EBB98C, #C0804A); }
.bx-pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bx-pv { margin-left: auto; color: var(--bx-sub); font-weight: 800; font-size: .8rem; }
.bx-muted { color: var(--bx-sub); font-size: .82rem; }
.bx-ring { display: flex; align-items: center; gap: 10px; }
.bx-ring-bg { stroke: var(--bx-line); }
/* "bx-dark" = riquadro nel colore dei pulsanti principali (oro, v5.54). */
.bx-dark { background: var(--bx-btn-bg); }
.bx-dark .bx-t, .bx-dark .bx-t * { color: var(--bx-btn-ink); }
.bx-dark .bx-k { color: #5A4320; }
.bx-sec { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 4px 10px; }
.bx-sec b { font-size: 1.15rem; letter-spacing: -.01em; color: var(--bx-ink); }
.bx-scroll { display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 8px; scroll-snap-type: x mandatory; scroll-padding-left: 20px; -webkit-overflow-scrolling: touch; }
.bx-scroll .tourney-row { flex: 0 0 62%; margin: 0; flex-direction: column; align-items: flex-start; gap: 10px; scroll-snap-align: start; padding: 14px; border: none; border-radius: 22px; background: var(--bx-card); box-shadow: var(--bx-shadow); }
.bx-scroll .tourney-row-side { align-items: flex-start; flex-direction: row-reverse; gap: 8px; }
.bx-scroll .tourney-row-code { font-size: 1.05rem; }
.bx-scroll .tourney-placeholder { flex: 1; }
html.fx3d .bx-card, html.fx3d .bx-scroll .tourney-row { box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 3px 0 #D2C093, 0 10px 14px -6px rgba(60,40,10,.35); }
html.fx3d[data-theme="dark"] .bx-card, html.fx3d[data-theme="dark"] .bx-scroll .tourney-row { box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 3px 0 #0E0B08, 0 10px 14px -6px rgba(0,0,0,.65); }
/* Elenco tornei attivi in home. */
.tourney-row {
  all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; padding: 11px 14px; margin-bottom: 8px;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; cursor: pointer;
  transition: border-color .12s ease, background .12s ease;
}
.tourney-row:hover { border-color: var(--gold); background: #F3EBD8; }
.tourney-row-main { display: flex; flex-direction: column; gap: 2px; }
.tourney-row-code { font-weight: 800; color: var(--ink); font-size: 0.9rem; letter-spacing: 0.02em; }
.tourney-row-format { font-size: 0.75rem; color: var(--muted-3); }
.tourney-row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.tourney-row-count { font-size: 0.72rem; color: var(--muted); }
.tourney-row-status { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 999px; }
.tourney-row-status.status-open { background: #E7F3EC; color: #2E7D52; }
.tourney-row-status.status-live { background: #FCEFD9; color: #B4791E; }
/* Voce cliccabile "Classifica generale" in home — stesso ingombro visivo
   degli altri riquadri della sezione v5, ma attiva (non tratteggiata). */
.leaderboard-open-btn {
  all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center;
  justify-content: space-between; gap: 8px; background: var(--panel); border: 1.5px solid var(--panel-border);
  border-radius: 16px; padding: 13px 16px; color: var(--ink); font-weight: 700; font-size: 0.9rem;
  cursor: pointer; margin-bottom: 14px; transition: border-color .12s ease, background .12s ease;
}
.leaderboard-open-btn:hover { border-color: var(--gold); background: #F3EBD8; }
.leaderboard-open-arrow { color: var(--muted); font-size: 1.1rem; }
.leaderboard-list { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 16px; }
.leaderboard-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
}
.leaderboard-rank { font-weight: 800; color: var(--muted-2); width: 26px; flex-shrink: 0; }
.leaderboard-name { flex: 1; font-weight: 700; color: var(--ink); }
.leaderboard-wins { font-size: 0.82rem; font-weight: 700; color: var(--muted-3); flex-shrink: 0; }
/* Righe classifica (vedi buildLbRow) */
.lb-desc { color: var(--muted-2); }
.lb-row {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
}
.lb-row > * { position: relative; z-index: 1; }
.lb-rank {
  width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.84rem; color: var(--muted-2);
  font-variant-numeric: tabular-nums;
}
.lb-r1 .lb-rank, .lb-r2 .lb-rank, .lb-r3 .lb-rank { color: #2B2016; box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(0,0,0,.3); }
.lb-r1 .lb-rank { background: linear-gradient(135deg, #F7DE91 0%, #D4A63F 55%, #A87D22 100%); }
.lb-r2 .lb-rank { background: linear-gradient(135deg, #F1F1F1 0%, #BDBDBD 55%, #8F8F8F 100%); }
.lb-r3 .lb-rank { background: linear-gradient(135deg, #EBB98C 0%, #C0804A 55%, #8F5A2E 100%); }
.lb-r1 { border-color: var(--gold); }
/* Classifica a linguette, elenco in un unico riquadro (v5.45) */
.lb-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin: 8px 0 12px; border-radius: 999px; background: rgba(201,154,58,.14); }
.lb-tab { all: unset; box-sizing: border-box; text-align: center; padding: 9px 0; border-radius: 999px; font-weight: 800; font-size: .86rem; color: var(--muted-2); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.lb-tab.on, .lb-tab.on * { color: var(--ink); }
.lb-tab.on { background: var(--panel); box-shadow: 0 1px 4px rgba(60,40,10,.18); }
.lb-tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.lb-list-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; overflow: hidden; }
.lb-list-card .lb-row { border: none !important; border-radius: 0 !important; background: transparent !important; box-shadow: none !important; margin: 0 !important; padding: 9px 14px; }
.lb-list-card .lb-row + .lb-row { border-top: 1px solid var(--panel-border) !important; }
.lb-list-card .lb-row.lb-me { background: rgba(201,154,58,.13) !important; }
.lb-namecol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.lb-bar { height: 4px; border-radius: 2px; background: rgba(201,154,58,.18); max-width: 160px; }
.lb-bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #D4A63F, #A87D22); }
.lb-few-label { margin: 14px 2px 6px; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-2); }
.lb-few .lb-row { opacity: .6; }
:root[data-theme="dark"] .lb-list-card { background: linear-gradient(180deg, #2A231B, #211B15); border-color: #4A3C2C; }
:root[data-theme="dark"] .lb-list-card .lb-row + .lb-row { border-top-color: #4A3C2C !important; }
:root[data-theme="dark"] .lb-tab.on { background: #34291A; }
html.fx3d .lb-list-card { background: linear-gradient(165deg, #FFFFFF 0%, #FBF5E6 60%, #F3E9D0 100%); border-color: #D9CBA8; box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 3px 0 #D2C093, 0 8px 10px -4px rgba(60,40,10,.35); margin-bottom: 3px; }
html.fx3d[data-theme="dark"] .lb-list-card { background: linear-gradient(165deg, #30281E 0%, #261F17 100%); border-color: #4F4030; box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 3px 0 #0E0B08, 0 8px 10px -4px rgba(0,0,0,.65); }
.lb-r1 .lb-name { font-size: 1.04rem; }
.lb-name { flex: 1; min-width: 0; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-you {
  margin-left: 8px; padding: 1px 7px; border-radius: 999px; vertical-align: 2px;
  font-size: 0.62rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
  background: var(--gold); color: var(--ink-on-gold);
}
.lb-me { box-shadow: 0 0 0 1.5px var(--gold) inset; }
.lb-val { display: flex; align-items: baseline; gap: 5px; flex-shrink: 0; color: var(--ink); }
.lb-val b { font-size: 1.12rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.lb-val small { font-size: 0.74rem; font-weight: 700; color: var(--muted-2); }
:root[data-theme="dark"] .lb-row { background: linear-gradient(180deg, #2A231B, #211B15); border-color: #4A3C2C; }
:root[data-theme="dark"] .lb-r1 { background: linear-gradient(180deg, #34291A, #271F14); border-color: #9C7420; }
:root[data-theme="dark"] .lb-val small { color: var(--muted-3); }
/* rilievo 3D: righe in cartoncino con spessore, come le carte */
html.fx3d .lb-row {
  background: linear-gradient(165deg, #FFFFFF 0%, #FBF5E6 60%, #F3E9D0 100%);
  border-color: #D9CBA8;
  box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 -2px 0 rgba(0,0,0,.04) inset, 0 3px 0 #D2C093, 0 8px 10px -4px rgba(60,40,10,.35);
  margin-bottom: 3px;
}
html.fx3d .lb-me { box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 0 0 1.5px var(--gold) inset, 0 3px 0 #C8A24E, 0 8px 10px -4px rgba(60,40,10,.35); }
html.fx3d .lb-rank { box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 0 rgba(0,0,0,.25); }
html.fx3d[data-theme="dark"] .lb-row {
  background: linear-gradient(165deg, #30281E 0%, #261F17 100%);
  border-color: #4F4030;
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 3px 0 #0E0B08, 0 8px 10px -4px rgba(0,0,0,.65);
}
html.fx3d[data-theme="dark"] .lb-r1 { background: linear-gradient(165deg, #3B2E1B 0%, #2B2216 100%); }
html.fx3d[data-theme="dark"] .lb-me { box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 0 0 1.5px var(--gold) inset, 0 3px 0 #0E0B08, 0 8px 10px -4px rgba(0,0,0,.65); }

/* Passi numerati 1-2-3 nella lobby: guidano l'occhio nell'ordine giusto
   (nome → colore → entra) invece di lasciare i tre blocchi alla stessa
   altezza visiva. */
.step-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0 6px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--muted-3);
}
.step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--cream);
  font-size: 0.68rem;
  font-weight: 700;
  flex-shrink: 0;
}
button.secondary {
  padding: 10px 14px;
  border-radius: 8px;
  border: 2px solid var(--ink);
  background: var(--panel);
  margin: 4px;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
  box-shadow: 0 3px 0 rgba(0,0,0,0.25);
}
button.secondary:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
  filter: brightness(0.94);
}
button.danger {
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  background: #C24A50;
  color: white;
  margin-top: 8px;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
  box-shadow: 0 3px 0 rgba(0,0,0,0.35);
}
button.danger:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.35);
  filter: brightness(0.9);
}

/* Riga in cima: solo i pulsanti menu, allineati a destra. Il riferimento
   di build non è più una scritta fissa qui né sotto la pillola
   Stanza/Squadra (chiesto: "togli la build da lì") — resta consultabile
   solo a richiesta tramite il tastino "i" (vedi showVersionInfo). */
/* Menu Impostazioni */
.set-box { padding-bottom: 6px; }
.set-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.set-title { font-weight:800; font-size:1.1rem; margin:0; }
.set-close { width:32px; height:32px; border-radius:50%; border:1px solid var(--panel-border); background:var(--panel); color:var(--muted-3); font-size:.95rem; padding:0; cursor:pointer; }
.set-card { background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; margin-bottom:12px; overflow:hidden; }
.set-card-title { font-size:.68rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-3); padding:10px 14px 4px; }
.set-row { display:flex; align-items:center; gap:12px; min-height:46px; padding:0 14px; border-top:1px solid var(--panel-border); }
.set-card-title + .set-row { border-top:none; }
.set-row-tap { cursor:pointer; }
.set-row-tap:active { background:rgba(201,152,46,.14); }
.set-ico { width:24px; text-align:center; font-size:1.05rem; }
.set-lbl { flex:1; font-size:.92rem; font-weight:600; }
.set-chev { color:var(--muted-3); font-size:1.3rem; }
.set-radio { width:20px; height:20px; border-radius:50%; border:2px solid var(--panel-border); box-sizing:border-box; position:relative; }
.set-radio.on { border-color:#C9982E; }
.set-radio.on::after { content:""; position:absolute; inset:3px; border-radius:50%; background:linear-gradient(#E5BF63,#C9982E); }
.set-tog { width:46px; height:28px; border-radius:14px; border:1px solid var(--panel-border); background:#D9D2C3; padding:0; position:relative; cursor:pointer; flex-shrink:0; transition:background .15s; }
.set-tog.on { background:linear-gradient(#E5BF63,#C9982E); border-color:#B5851F; }
.set-knob { position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:transform .15s; }
.set-tog.on .set-knob { transform:translateX(18px); }
/* v5.79: foglio "Tornare alla home?" (vedi leaveGameToHome) */
.picker-overlay .leave-box > .leave-title { margin: 2px 2px 6px; padding: 0 !important; background: none !important; font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; color: var(--bx-ink); }
.leave-sub { margin: 0 2px 16px; font-size: .92rem; line-height: 1.35; color: var(--bx-sub); }
.leave-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.leave-btns button { margin: 0; height: 50px; border-radius: 18px; font-size: 1rem; font-weight: 800; }
.leave-btns .leave-stay { background: var(--bx-card); color: var(--bx-ink); border: none; box-shadow: var(--bx-shadow); }
.leave-btns .leave-go { background: var(--bx-btn-bg); color: #2A1C05; border: none; box-shadow: 0 10px 22px -12px rgba(168,125,34,.65); }
html:not([data-skin="arcade"]) #picker-wrap:has(.leave-box) { background: var(--bx-bg); }
/* v5.79: col Rilievo 3D acceso il tastino 🔊 in home non ha più il "bordo spesso" sotto (come la pillola);
   il 🧊 resta in rilievo quando è acceso perché è il suo modo di dire "acceso". */
html.fx3d .bx-icons .theme-toggle-btn:not(#fx3d-toggle-btn) { box-shadow: var(--bx-shadow), inset 0 1px 3px rgba(60,40,10,.12); }
html.fx3d[data-theme="dark"] .bx-icons .theme-toggle-btn:not(#fx3d-toggle-btn) { box-shadow: var(--bx-shadow), inset 0 1px 4px rgba(0,0,0,.5); }
/* v5.77: Impostazioni in stile home (vedi openSettingsPanel) */
html:not([data-skin="arcade"]) #picker-wrap:has(.sx-box) { background: var(--bx-bg); }
.sx-box { padding: 2px 2px 8px; }
.picker-overlay .sx-box > .sx-head { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 14px; padding: 0 !important; background: none !important; border-radius: 0 !important; }
.sx-head h2 { margin: 0; font-size: 1.75rem; font-weight: 800; letter-spacing: -.03em; color: var(--bx-ink); }
.sx-close { position: relative; isolation: isolate; width: 38px; height: 38px; padding: 0; border-radius: 50%; border: none; background: #FFFFFF; box-shadow: var(--bx-shadow), inset 0 1px 3px rgba(60,40,10,.12); font-size: .9rem; font-weight: 800; color: var(--bx-ink); cursor: pointer; }
.sx-close::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #F5F1EA; box-shadow: 0 2px 5px rgba(60,40,10,.25); z-index: -1; }
:root[data-theme="dark"] .sx-close { background: #262B40; }
:root[data-theme="dark"] .sx-close::before { background: #343A55; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.sx-sec { margin: 16px 4px 8px; font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; color: var(--bx-ink); }
.sx-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sx-tile { min-width: 0; background: var(--bx-card); border-radius: 22px; box-shadow: var(--bx-shadow); padding: 12px 14px; }
.sx-tile.bx-icons { display: block; }
.sx-tile .bx-k { display: block; margin-bottom: 8px; }
.sx-skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sx-skin { position: relative; height: 96px; padding: 10px 8px 8px; border: none; border-radius: 20px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; text-align: left; overflow: hidden; box-shadow: var(--bx-shadow); cursor: pointer; }
.sx-skin .ic { font-size: 1.5rem; line-height: 1; margin-bottom: auto; }
.sx-skin .nm { font-size: .8rem; font-weight: 800; line-height: 1.1; }
.sx-skin.on { outline: 3px solid #D9A93A; outline-offset: -3px; }
.sx-skin.on::after { content: "✓"; position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: #D9A93A; color: #2A1C05; font-size: .72rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }
.sx-k1, .sx-k1 * { color: #2B2014; } .sx-k1 { background: linear-gradient(160deg,#FBF4E4,#EAD9B4); }
.sx-k2, .sx-k2 * { color: #F6E7C8; } .sx-k2 { background: radial-gradient(70% 70% at 70% 80%,#5A3A20 0 34%,transparent 35%), radial-gradient(110% 70% at 50% 35%,#2F6B47,#163E29); }
.sx-k3, .sx-k3 * { color: #F4EBD0; } .sx-k3 { background: radial-gradient(110% 70% at 50% 30%,#1D4A3C,#0A1713); }
.sx-k4, .sx-k4 * { color: #3A2A55; } .sx-k4 { background: linear-gradient(160deg,#EAF4FF,#F7F1FF 55%,#FFE7D2); }
.sx-k5, .sx-k5 * { color: #7CF7FF; } .sx-k5 { background: #120A3A; box-shadow: inset 0 0 0 2px #FF2BD6, var(--bx-shadow); }
.sx-list { background: var(--bx-card); border-radius: 22px; box-shadow: var(--bx-shadow); overflow: hidden; }
.sx-list .set-row { border-top: 1px solid var(--bx-line); }
.sx-list .set-row:first-child { border-top: none; }
.sx-acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sx-act { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border: none; border-radius: 20px; background: var(--bx-card); box-shadow: var(--bx-shadow); font-size: .78rem; font-weight: 800; color: var(--bx-ink); cursor: pointer; }
.sx-act .ic { font-size: 1.4rem; }
/* Arcade: tessere scure come il resto dello stile (testi azzurro neon) */
html[data-skin="arcade"] .sx-box { --bx-card: rgba(124,247,255,.07); --bx-ink: #D9F7FF; --bx-line: rgba(124,247,255,.22); --bx-shadow: inset 0 0 0 1px rgba(124,247,255,.35); }
